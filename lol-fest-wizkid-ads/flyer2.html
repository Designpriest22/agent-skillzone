<!doctype html>
<html><head><meta charset="utf-8"><title>LOL FEST x sponsor flyers v2</title>
<style>html,body{margin:0;background:#222}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style>
</head><body><canvas id="c"></canvas>
<script src="lib.js"></script>
<script>
'use strict';
// v2 static co-branded flyers, built on the grammar of the client's own LOL FEST flyer:
// one full, unclipped portrait (the supplied colour cutout), thin condensed WIZKID headline behind the head,
// 13 DEC / LIVE / ABUJA flanking the head, the festival logo on the chest, venue, ticket line, and the ONE sponsor logo.
// ?s=<sponsor>&v=1|2&f=feed|story|square&dpr=1|2
//   v=1 "Signature"     the flyer layout, re-cut in the sponsor's palette with the brush-stroke field in its tones
//   v=2 "Brand Edition" the sponsor's device as the backdrop (always BEHIND the portrait), an info panel and a ticket button
const Q = new URLSearchParams(location.search);
const FMT = { feed: [1080, 1350], story: [1080, 1920], square: [1080, 1080] };
const fk = Q.get('f') || 'feed', V = Number(Q.get('v') || 1), dpr = Number(Q.get('dpr') || 1);
const [W, H] = FMT[fk], CX = W / 2;
const pk = (st, fe, sq) => fk === 'story' ? st : fk === 'feed' ? fe : sq;
const cv = document.getElementById('c'); cv.width = W * dpr; cv.height = H * dpr; cv.style.aspectRatio = `${W}/${H}`;
const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const L = { W, H, u: 1 };
const IM = {};
window.__sizes = {};
const note = (k, v) => { window.__sizes[k] = Math.min(window.__sizes[k] ?? 1e9, v); };

// ---------------- primitives ----------------
const radial = (c0, c1, cx = CX, cy = H * .4, r = Math.hypot(W, H) * .7) => { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
const lin = (stops, x0 = 0, y0 = 0, x1 = 0, y1 = H) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const capK = {}; function capOf(fam, w) { const k = fam + w; if (!capK[k]) { setFont(ctx, fam, 100, w); capK[k] = ctx.measureText('H').actualBoundingBoxAscent / 100; } return capK[k]; }
// big headline: fit a cap height, then track out to the target width (never stretched)
// the official WIZKID text logo as the headline (tinted only where the background is light)
function wizMark(cx, top, w, dark) { const im = dark ? tinted(IMG.wizkid, dark) : IMG.wizkid, h = w * IMG.wizkid.height / IMG.wizkid.width; drawImg(ctx, im, cx, top + h / 2, w); return { h }; }
function headline(str, cx, capTop, targetW, cap, o) {
  let size = cap / capOf(o.fam, o.w); let nat = measure(ctx, str, { fam: o.fam, w: o.w, size });
  if (nat > targetW) { size *= targetW / nat; nat = targetW; }
  const track = Math.max(0, (targetW - nat) / ((str.length - 1) * size));
  const base = capTop + size * capOf(o.fam, o.w);
  text(ctx, str, cx, base, { fam: o.fam, w: o.w, size, track, color: o.color, align: o.align || 'center', alpha: o.alpha ?? 1, shadow: o.shadow });
  return { size, base, h: size * capOf(o.fam, o.w) };
}
function tline(str, x, base, cap, o) { const size = cap / capOf(o.fam, o.w); text(ctx, str, x, base, { ...o, size }); return measure(ctx, str, { ...o, size }); }
// the supplied colour portrait, drawn whole. Never masked into a shape.
function portrait(cx, top, w, o = {}) {
  const im = IM.portrait, h = w * im.height / im.width;
  ctx.save(); if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = 60; }
  drawImg(ctx, im, cx, top + h / 2, w); ctx.restore();
  return { x: cx - w / 2, y: top, w, h };
}
const SL = (cx, cy, maxW, maxH, o = {}) => { const im = T.logoDark ? tinted(IMG.sponsor, T.logoDark) : IMG.sponsor, w = Math.min(maxW, maxH * im.width / im.height); drawImg(ctx, im, cx, cy, w, o); return { w, h: w * im.height / im.width }; };
const lolW = h => h * IMG.lol.width / IMG.lol.height;
// dry-brush stroke field (the flyer's texture), seeded per sponsor
function brush(seed, col, a = .55, n = 70) {
  const r = rng(seed); ctx.save(); ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = r() * W, y = r() * H, ang = [-1.05, 1.0, -.35, .5, -1.25][Math.floor(r() * 5)] + (r() - .5) * .3;
    const len = (220 + r() * 620) * (W / 1080), wid = 34 + r() * 80, br = 12 + Math.floor(r() * 8);
    const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
    for (let k = 0; k < br; k++) {
      const off = (k / (br - 1) - .5) * wid, lw = wid / br * (0.7 + r() * 1.3);
      ctx.strokeStyle = col; ctx.globalAlpha = a * (.35 + r() * .65); ctx.lineWidth = lw;
      const l0 = len * (r() * .15), l1 = len * (.75 + r() * .25);
      ctx.setLineDash([len * (.2 + r() * .6), len * r() * .08]);
      ctx.beginPath(); const sx = x + nx * off, sy = y + ny * off;
      ctx.moveTo(sx + dx * l0, sy + dy * l0);
      const bend = (r() - .5) * 30; ctx.quadraticCurveTo(sx + dx * len * .5 + nx * bend, sy + dy * len * .5 + ny * bend, sx + dx * l1, sy + dy * l1); ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  for (let c = 0; c < 14; c++) { const cx = r() * W, cy = r() * H; for (let i = 0; i < 26; i++) { const d = Math.pow(r(), 2) * 120; const th = r() * 7; ctx.globalAlpha = a * (.4 + r() * .6); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx + Math.cos(th) * d, cy + Math.sin(th) * d, .8 + r() * 5 * (1 - d / 130), 0, 7); ctx.fill(); } }
  ctx.restore();
}
function grainFx(a = .05) { const r = rng(7); const g = ctx.createImageData(256, 256); for (let i = 0; i < g.data.length; i += 4) { const v = r() * 255; g.data[i] = g.data[i + 1] = g.data[i + 2] = v; g.data[i + 3] = 255; } const c = document.createElement('canvas'); c.width = c.height = 256; c.getContext('2d').putImageData(g, 0, 0); ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = ctx.createPattern(c, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.restore(); }
const fadeDown = (y0, y1, col) => { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, rgba(col, 0)); g.addColorStop(1, rgba(col, 1)); ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0 + 1); ctx.fillStyle = col; ctx.fillRect(0, y1, W, H - y1); };

// ticket line, the flyer's way: light lead + bold URL on one line
function ticketLine(cx, base, urlSize, T) {
  const lead = { fam: 'Montserrat', w: 400, size: urlSize * .74, track: .08 }, url = { fam: 'Montserrat', w: 700, size: urlSize, track: .02 };
  const wl = measure(ctx, BRAND.event.ticketsLead, lead), wu = measure(ctx, BRAND.event.url, url), gap = urlSize * .5, x = cx - (wl + gap + wu) / 2;
  text(ctx, BRAND.event.ticketsLead, x, base, { ...lead, align: 'left', color: T.lead });
  text(ctx, BRAND.event.url, x + wl + gap, base, { ...url, align: 'left', color: T.url });
  note('url', urlSize); return wl + gap + wu;
}
function venue(cx, base, size, T, align = 'center', track = .3) { text(ctx, BRAND.event.venue, cx, base, { fam: 'Oswald', w: 700, size, track, align, color: T.venue }); note('venue', size); }
// ticket button for the Brand Edition (one shape per sponsor)
function ticketButton(x, y, w, h, T) {
  const c = T.btn; ctx.save();
  const rr = r => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
  if (c.shape === 'pill') { rr(h / 2); ctx.fillStyle = c.bg; ctx.fill(); }
  else if (c.shape === 'line') { ctx.strokeStyle = c.line; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); ctx.strokeRect(x + 7, y + 7, w - 14, h - 14); }
  else if (c.shape === 'block') { ctx.fillStyle = c.shadow || 'transparent'; ctx.fillRect(x + 10, y + 10, w, h); ctx.fillStyle = c.bg; ctx.fillRect(x, y, w, h); }
  else if (c.shape === 'slant') { ctx.fillStyle = c.bg; ctx.beginPath(); ctx.moveTo(x + 22, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w - 22, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill(); }
  else if (c.shape === 'plaque') { ctx.fillStyle = c.bg; ctx.fillRect(x, y, w, h); ctx.strokeStyle = c.line; ctx.lineWidth = 2; ctx.strokeRect(x + 6, y + 6, w - 12, h - 12); }
  else if (c.shape === 'pass') { rr(14); ctx.fillStyle = c.bg; ctx.fill(); ctx.fillStyle = c.stub; ctx.beginPath(); ctx.roundRect(x + w * .86, y, w * .14, h, [0, 14, 14, 0]); ctx.fill(); ctx.fillStyle = c.bg; for (let yy = y + 8; yy < y + h - 6; yy += 13) ctx.fillRect(x + w * .86 - 2, yy, 4, 6); }
  else if (c.shape === 'grad') { rr(h / 2); const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#FC543C'); g.addColorStop(.55, '#FCB424'); g.addColorStop(1, '#CC3C6C'); ctx.fillStyle = g; ctx.fill(); }
  ctx.restore();
  const inner = c.shape === 'pass' ? w * .845 : w * .93, cxT = c.shape === 'pass' ? x + w * .43 : x + w / 2;
  const us = Math.min(h * .5, fitSize(ctx, BRAND.event.url, inner, { fam: 'Montserrat', w: 800, track: .02 }));
  text(ctx, BRAND.event.url, cxT, y + h / 2 + us * .36, { fam: 'Montserrat', w: 800, size: us, track: .02, color: c.fg, align: 'center' }); note('url', us);
}

// ---------------- brand devices for the Brand Edition backdrop (behind the portrait) ----------------
const DEVICE = {
  silk: T => { radial('#D9161F', '#62050e', CX, H * .3); ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.lineCap = 'round'; for (let i = 0; i < 4; i++) { const y0 = H * (.12 + i * .07), amp = 110 + i * 30, ph = i * 1.3; const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.3, `rgba(255,232,232,${.22 * (1 - i * .18)})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.strokeStyle = g; ctx.lineWidth = 96 - i * 18; ctx.filter = `blur(${6 + i * 5}px)`; ctx.beginPath(); for (let x = -100; x <= W + 100; x += 24) { const yy = y0 + Math.sin(x / 260 + ph) * amp - x * .22; x <= -100 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); } ctx.stroke(); } ctx.filter = 'none'; ctx.restore(); },
  desp: T => { radial('#EC1B24', '#9A000C', CX, H * .35); ctx.save(); ctx.translate(CX, H * .4); ctx.rotate(-.42); ctx.fillStyle = '#0A0A0A'; ctx.fillRect(W * .3, -H, 120, H * 2); ctx.fillStyle = '#FFD200'; ctx.fillRect(W * .3 + 140, -H, 16, H * 2); ctx.restore(); },
  cream: T => { radial('#FBF6EA', '#E4D2AE', CX, H * .35); ctx.strokeStyle = '#B08D4F'; ctx.lineWidth = 2; ctx.strokeRect(26, 26, W - 52, H - 52); },
  amber: T => { radial('#2a1709', '#050403', CX, H * .3); ctx.save(); ctx.globalCompositeOperation = 'screen'; const g = ctx.createLinearGradient(CX - 140, 0, CX + 140, 0); g.addColorStop(0, 'rgba(255,170,70,0)'); g.addColorStop(.5, 'rgba(255,170,70,.22)'); g.addColorStop(1, 'rgba(255,170,70,0)'); ctx.fillStyle = g; ctx.fillRect(CX - 140, 0, 280, H); ctx.translate(CX, H * .42); ctx.scale(1, .35); const r = ctx.createRadialGradient(0, 0, 0, 0, 0, W * .7); r.addColorStop(0, 'rgba(255,170,70,.4)'); r.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = r; ctx.fillRect(-W, -H * 3, W * 2, H * 6); ctx.restore(); ctx.strokeStyle = 'rgba(201,151,79,.55)'; ctx.lineWidth = 1.5; ctx.strokeRect(28, 28, W - 56, H - 56); },
  rays: T => { radial('#16924a', '#032412', CX, H * .3); ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(CX, H * .3); for (let i = 0; i < 14; i++) { ctx.rotate(Math.PI / 7); ctx.fillStyle = 'rgba(180,255,205,.06)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-70, -H * 1.5); ctx.lineTo(70, -H * 1.5); ctx.fill(); } ctx.restore(); },
  ribbon: T => { ctx.fillStyle = '#F40009'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; for (const [y0, lw, a] of [[H * .36, 46, 1], [H * .36 + 70, 10, .8]]) { ctx.globalAlpha = a; ctx.lineWidth = lw; ctx.beginPath(); for (let x = -20; x <= W + 20; x += 10) { const y = y0 + Math.sin(x / 170 + .6) * 70 - x * .12; x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); } ctx.restore(); },
  slashes: T => { ctx.fillStyle = '#0A0A0A'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.translate(CX, H * .4); ctx.rotate(-.42); ctx.fillStyle = '#D7191C'; ctx.fillRect(-W * .55, -H, 300, H * 2); ctx.fillRect(W * .18, -H, 120, H * 2); ctx.fillStyle = '#fff'; ctx.fillRect(-W * .55 + 330, -H, 18, H * 2); ctx.restore(); },
  guilloche: T => { radial('#241e15', '#060504', CX, H * .35); ctx.save(); ctx.strokeStyle = '#E6C88F'; ctx.lineWidth = 1; for (let k = 0; k < 12; k++) { ctx.globalAlpha = .12; ctx.beginPath(); for (let i = 0; i <= 720; i++) { const th = i / 360 * Math.PI; const rr = W * (.28 + .03 * Math.sin(th * 14 + k * .7) + k * .022); const X = CX + Math.cos(th) * rr, Y = H * .36 + Math.sin(th) * rr; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } ctx.stroke(); } ctx.restore(); ctx.strokeStyle = 'rgba(230,200,143,.6)'; ctx.lineWidth = 2; ctx.strokeRect(26, 26, W - 52, H - 52); ctx.lineWidth = 1; ctx.strokeRect(36, 36, W - 72, H - 72); },
  bars: T => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.translate(CX, H * .4); ctx.rotate(.35); ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(-W * .62, -H, W * .3, H * 2); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(W * .26, -H, 26, H * 2); ctx.fillRect(-W * .7, -H, 10, H * 2); ctx.restore(); },
  label: T => { radial('#4a1218', '#120304', CX, H * .35); const m = 34; labelFrame(m, m, W - 2 * m, H - 2 * m); },
  arch: T => { lin([[0, '#13254a'], [1, '#060c1a']]); const r = W * pk(.34, .34, .25), cy = pk(H * .3, H * .36, H * .42); ctx.save(); ctx.globalCompositeOperation = 'screen'; const g = ctx.createRadialGradient(CX, cy, 0, CX, cy, r * 1.6); g.addColorStop(0, 'rgba(255,205,130,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); ctx.strokeStyle = '#D8B878'; ctx.lineWidth = 2.5; for (const d of [0, 16]) { ctx.beginPath(); ctx.moveTo(CX - r - d, H); ctx.lineTo(CX - r - d, cy); ctx.arc(CX, cy, r + d, Math.PI, 0); ctx.lineTo(CX + r + d, H); ctx.globalAlpha = d ? .45 : 1; ctx.stroke(); } ctx.globalAlpha = 1; },
  weave: T => { radial('#14432a', '#04100a', CX, H * .35); ctx.save(); for (let x = 0; x < W; x += 44) { ctx.fillStyle = (x / 44) % 2 ? 'rgba(60,180,84,.28)' : 'rgba(180,204,84,.18)'; ctx.fillRect(x, 0, 3, H); } for (let y = 0; y < H; y += 44) { ctx.fillStyle = (y / 44) % 2 ? 'rgba(60,180,84,.22)' : 'rgba(180,204,84,.15)'; ctx.fillRect(0, y, W, 3); } ctx.restore(); },
  sky: T => { lin([[0, '#8cc4ec'], [.6, '#dceefa'], [1, '#ffffff']]); ctx.save(); ctx.strokeStyle = 'rgba(12,108,180,.6)'; ctx.lineWidth = 4; ctx.setLineDash([18, 14]); ctx.beginPath(); ctx.moveTo(-40, H * .52); ctx.quadraticCurveTo(CX, H * .02, W + 40, H * .3); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = 'rgba(255,255,255,.7)'; const r = rng(5); for (let i = 0; i < 6; i++) ctx.fillRect(r() * W, H * (.08 + r() * .4), 160 + r() * 240, 3); ctx.restore(); },
  plus: T => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); plusPath(ctx, CX, H * .38, W * .62, W * .17); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.5)'; for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) { ctx.beginPath(); plusPath(ctx, 70 + i * 34, 70 + j * 34, 8, 2.5); ctx.fill(); } ctx.restore(); },
  plan: T => { ctx.fillStyle = '#16181b'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.strokeStyle = '#8FA3B8'; ctx.globalAlpha = .18; ctx.lineWidth = 1; for (let x = 0; x < W; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); } ctx.globalAlpha = .7; ctx.strokeStyle = '#C9D2DC'; const s = W * .62, x0 = CX - s / 2, y0 = pk(H * .17, H * .14, H * .12); ctx.lineWidth = 2; ctx.strokeRect(x0, y0, s, s); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, y0 - 24); ctx.lineTo(x0 + s, y0 - 24); ctx.moveTo(x0, y0 - 34); ctx.lineTo(x0, y0 - 14); ctx.moveTo(x0 + s, y0 - 34); ctx.lineTo(x0 + s, y0 - 14); ctx.moveTo(x0 - 24, y0); ctx.lineTo(x0 - 24, y0 + s); ctx.moveTo(x0 - 34, y0); ctx.lineTo(x0 - 14, y0); ctx.moveTo(x0 - 34, y0 + s); ctx.lineTo(x0 - 14, y0 + s); ctx.stroke(); ctx.restore(); },
  burst: T => { radial('#3a1236', '#0d030d', CX, H * .35); ctx.save(); ctx.globalAlpha = .55; const cols = ['#FCB424', '#FC543C', '#CC3C6C', '#FCD27A']; ctx.translate(CX, H * .36); for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4 + .05); ctx.fillStyle = cols[i % 4]; ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(0, -H); ctx.lineTo(26, 0); ctx.fill(); } ctx.restore(); ctx.save(); ctx.strokeStyle = '#FCB424'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.globalAlpha = .8; ctx.beginPath(); for (let x = 40; x <= W - 40; x += 8) { const y = H * .62 + Math.sin(x / 70) * 22; x === 40 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); ctx.restore(); },
};
function tornEdge(y, seed) { const r = rng(seed); ctx.save(); ctx.beginPath(); ctx.moveTo(0, H + 10); ctx.lineTo(0, y); for (let x = 0; x <= W + 30; x += 18 + r() * 26) ctx.lineTo(x, y + (r() - .5) * 46 + Math.sin(x / 140) * 14); ctx.lineTo(W, H + 10); ctx.closePath(); ctx.strokeStyle = 'rgba(235,230,225,.85)'; ctx.lineWidth = 5; ctx.stroke(); ctx.fillStyle = '#0A0A0A'; ctx.fill(); ctx.restore(); }
function plusPath(g, cx, cy, r, th) { [[-th, -r], [th, -r], [th, -th], [r, -th], [r, th], [th, th], [th, r], [-th, r], [-th, th], [-r, th], [-r, -th], [-th, -th]].forEach(([x, y], i) => i ? g.lineTo(cx + x, cy + y) : g.moveTo(cx + x, cy + y)); g.closePath(); }
function labelFrame(x, y, w, h) { ctx.save(); ctx.strokeStyle = '#F3E6D0'; ctx.lineWidth = 4; ctx.strokeRect(x, y, w, h); ctx.lineWidth = 1.5; ctx.strokeRect(x + 14, y + 14, w - 28, h - 28); ctx.fillStyle = '#E0453C'; for (const [cx, cy] of [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4); ctx.fillRect(-8, -8, 16, 16); ctx.restore(); } ctx.restore(); }

// ---------------- per-sponsor themes ----------------
// bg: Signature backdrop [centre, edge]; stroke: brush tone; head/num/live/abuja/venue/lead/url: type colours
// panel: Brand Edition info panel colour; dev: Brand Edition backdrop; btn: ticket button; tab: plate behind the sponsor logo (only where the logo needs contrast)
const TH = {
  hennessy: { bg: ['#D9161F', '#62050e'], stroke: '#3e0207', strokeA: .42, head: '#FFFFFF', num: '#FFFFFF', live: '#FFFFFF', abuja: '#FFFFFF', venue: '#FFD7D2', lead: '#FFE8E5', url: '#FFFFFF', bottom: '#5a040c',
    panel: '#5a040c', dev: 'silk', btn: { shape: 'line', line: '#FFFFFF', fg: '#FFFFFF' } },
  heineken: { bg: ['#0e5a2c', '#021a0c'], stroke: '#02200e', head: '#FFFFFF', num: '#FFFFFF', live: '#FFFFFF', abuja: '#E3001B', venue: '#9BE7A8', lead: '#D8F5DF', url: '#FFFFFF',
    panel: '#04240f', dev: 'rays', btn: { shape: 'pill', bg: '#008200', fg: '#FFFFFF' } },
  'coca-cola': { bg: ['#F40009', '#A5000A'], stroke: '#9c0007', strokeA: .3, head: '#FFFFFF', num: '#FFFFFF', live: '#FFFFFF', abuja: '#FFFFFF', venue: '#FFFFFF', lead: '#FFE5E5', url: '#FFFFFF', bottom: '#8f0007',
    panel: '#FFFFFF', ptype: { num: '#F40009', live: '#1a1a1a', abuja: '#F40009', venue: '#1a1a1a', lead: '#333' }, dev: 'ribbon', btn: { shape: 'pill', bg: '#F40009', fg: '#FFFFFF' }, tab: '#FFFFFF' },
