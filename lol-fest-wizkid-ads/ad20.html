<script>
'use strict';
// v2 co-branded 20 s spots, one visual system per sponsor.   ?s=<id>&f=reels|feed|square
// 00:00-00:05 brand-led opening · 00:05-00:15 festival (footage + approved info + CTA WIZKID.TIX.AFRICA) · 00:15-00:20 sponsor logo ONLY
// Cut to the supplied track: 107.5 BPM, edit starts on a downbeat.
const Q = new URLSearchParams(location.search);
const L = layout(Q.get('f') || 'reels');

const bt = n => n * B;
const cv = document.getElementById('c'); cv.width = L.W; cv.height = L.H; cv.style.aspectRatio = `${L.W}/${L.H}`;

const OFF = []; function off(i) { if (!OFF[i]) { const c = document.createElement('canvas'); c.width = W; c.height = H; OFF[i] = c; } const x = OFF[i].getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, W, H); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; x.filter = 'none'; return [OFF[i], x]; }

const radial = (c0, c1, cx = W / 2, cy = H * .45, r = Math.hypot(W, H) * .62, g = ctx) => { const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
const lin = (stops, x0 = 0, y0 = 0, x1 = 0, y1 = H, g = ctx) => { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
const fill = (c) => { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); };

// ---------------- footage ----------------
const SH = { stage: [0, 2.4], aerial: [2.48, 4.24], arrival: [4.3, 5.7], walk: [5.76, 7.9], profile: [7.94, 9.6], smoke: [10.86, 12.18] };
const FOC = { stage: [.5, .44], aerial: [.52, .5], arrival: [.42, .56], walk: [.47, .5], profile: [.4, .42], smoke: [.6, .5] };
const EXP = { stage: 'contrast(1.1) saturate(1.1)', aerial: 'brightness(1.35) contrast(1.12)', arrival: 'brightness(1.4) contrast(1.1)', walk: 'brightness(1.4) contrast(1.08)', profile: 'contrast(1.06)', smoke: 'brightness(1.15) contrast(1.08)' };
function srcAt(c, t) { const k = c.keys; if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) return mix(k[i - 1][1], k[i][1], (k[i][2] || E.lin)(prog(t, k[i - 1][0], k[i][0]))); const n = k.length - 1, sl = (k[n][1] - k[n - 1][1]) / Math.max(.01, k[n][0] - k[n - 1][0]); return k[n][1] + (t - k[n][0]) * sl; }
// a shot: {a, b, shot, keys?, from?, to?, z:[z0,z1], fx, fy, mask(g,t)?, rect(t)?, grade?, filter?}
function shot(a, b, name, o = {}) { const [s0, s1] = SH[name]; const from = o.from ?? s0, to = o.to ?? Math.min(s1, from + (b - a)); return { a, b, name, keys: o.keys || [[a, from], [b, to]], fx: o.fx ?? FOC[name][0], fy: o.fy ?? FOC[name][1], z: o.z || [1.1, 1.0], ...o }; }
const val = (v, u) => typeof v === 'function' ? v(u) : Array.isArray(v) ? mix(v[0], v[1], E.inOutQuad(u)) : v;
async function drawShot(c, t, g = ctx) {
  const u = prog(t, c.a, c.b), s = c.freeze ?? srcAt(c, t);
  const sp = c.freeze !== undefined ? 0 : (srcAt(c, t + .02) - srcAt(c, t - .02)) / .04;

  g.save();
  if (c.mask) { g.beginPath(); c.mask(g, t); g.clip(); }
  const r = c.rect ? c.rect(t) : [0, 0, W, H]; if (c.rect) { g.beginPath(); g.rect(...r); g.clip(); }

  g.filter = 'none';
  for (const [op, col] of (c.grade || SP.grade || [])) { g.globalCompositeOperation = op; g.fillStyle = col; g.fillRect(r[0], r[1], r[2], r[3]); }
  g.restore(); c._r = res; c._s = s; return res;
}
function trackAt(name, s) { const tr = FOOT.track[name]; const f = s * 25; let best = tr[0]; for (const p of tr) if (Math.abs(p[0] - f) < Math.abs(best[0] - f)) best = p; return [best[1], best[2]]; }

// ---------------- brand devices: masks for transitions (p 0..1) + their drawn edges ----------------
function starPath(g, cx, cy, r, n = 5, inner = .42, rot = -Math.PI / 2) { g.moveTo(cx + Math.cos(rot) * r, cy + Math.sin(rot) * r); for (let i = 1; i < n * 2; i++) { const rr = i % 2 ? r * inner : r; const a = rot + i * Math.PI / n; g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } g.closePath(); }
const plusPath = (g, cx, cy, r, th, rot = 0) => { const c = Math.cos(rot), s = Math.sin(rot); [[-th, -r], [th, -r], [th, -th], [r, -th], [r, th], [th, th], [th, r], [-th, r], [-th, th], [-r, th], [-r, -th], [-th, -th]].forEach(([x, y], i) => { const X = cx + x * c - y * s, Y = cy + x * s + y * c; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.closePath(); };
const BIG = Math.hypot(W, H);
const DEV = {
  star: { mask: (g, p, t) => starPath(g, CX, CY, BIG * 1.5 * E.inQuart(p) + 1, 5, .42, -Math.PI / 2 + p * .8), edge: (p, t) => { if (p <= 0 || p >= 1) return; ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = U(7); ctx.beginPath(); starPath(ctx, CX, CY, BIG * 1.5 * E.inQuart(p) + 1, 5, .42, -Math.PI / 2 + p * .8); ctx.stroke(); ctx.restore(); } },
  wave: { mask: (g, p, t) => { const y = mix(H + U(160), -U(160), E.inOutCubic(p)); g.moveTo(0, H + 10); g.lineTo(0, y); for (let x = 0; x <= W; x += U(20)) g.lineTo(x, y + Math.sin(x / U(150) + t * 5) * U(44)); g.lineTo(W, H + 10); g.closePath(); },
    edge: (p, t) => { if (p <= 0 || p >= 1) return; const y = mix(H + U(160), -U(160), E.inOutCubic(p)); ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = U(16); ctx.beginPath(); for (let x = 0; x <= W; x += U(20)) { const yy = y + Math.sin(x / U(150) + t * 5) * U(44); x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke(); ctx.restore(); } },
  slash: { mask: (g, p) => { const e = E.inOutQuart(p), k = H * .45; const x = mix(-k - U(40), W + U(40), e); g.moveTo(-W, H + 10); g.lineTo(x, H + 10); g.lineTo(x + k, -10); g.lineTo(-W, -10); g.closePath(); },
    edge: (p) => { if (p <= 0 || p >= 1) return; const e = E.inOutQuart(p), k = H * .45, x = mix(-k - U(40), W + U(40), e); ctx.save(); ctx.fillStyle = '#D7191C'; ctx.beginPath(); ctx.moveTo(x, H + 10); ctx.lineTo(x + k, -10); ctx.lineTo(x + k + U(60), -10); ctx.lineTo(x + U(60), H + 10); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x + U(74), H + 10); ctx.lineTo(x + k + U(74), -10); ctx.lineTo(x + k + U(84), -10); ctx.lineTo(x + U(84), H + 10); ctx.fill(); ctx.restore(); } },
  ring: { mask: (g, p) => g.arc(CX, CY, BIG * .7 * E.inQuart(p) + 1, 0, 7), edge: (p) => { if (p <= 0 || p >= 1) return; const r = BIG * .7 * E.inQuart(p) + 1; ctx.save(); ctx.strokeStyle = '#E6C88F'; ctx.lineWidth = U(5); ctx.beginPath(); ctx.arc(CX, CY, r, 0, 7); ctx.stroke(); ctx.globalAlpha = .5; ctx.lineWidth = U(2); ctx.beginPath(); ctx.arc(CX, CY, r + U(16), 0, 7); ctx.stroke(); ctx.restore(); } },
  bars: { mask: (g, p) => { const n = 5, e = E.inOutQuart(p); for (let i = 0; i < n; i++) { const q = clamp(e * 1.6 - i * .12); const w = (W + H * .4) / n; const x0 = -H * .2 + i * w; g.moveTo(x0, H * q + 1); g.lineTo(x0 + w + 2, H * q + 1 - H * .2); g.lineTo(x0 + w + 2, -H); g.lineTo(x0, -H); g.closePath(); } },
    edge: (p) => { if (p <= 0 || p >= 1) return; ctx.save(); ctx.translate(CX, CY); ctx.rotate(.35); ctx.fillStyle = '#fff'; const e = E.inOutQuart(p); ctx.fillRect(mix(-W * 1.2, W * 1.2, e) - U(40), -H, U(80), H * 2); ctx.restore(); } },
  label: { mask: (g, p) => { const e = E.inOutCubic(p), fr = labelRect(); g.rect(mix(fr[0] + fr[2] / 2, fr[0], e), mix(fr[1] + fr[3] / 2, fr[1], e), fr[2] * e, fr[3] * e); }, edge: (p) => { if (p <= 0) return; labelFrame(labelRect(), clamp(p * 1.4), 1); } },
  doors: { mask: (g, p) => { const e = E.inOutCubic(p), w = W * e; g.rect(CX - w / 2, 0, w, H); }, edge: (p) => { if (p <= 0 || p >= 1) return; const e = E.inOutCubic(p), w = W * e; ctx.save(); ctx.fillStyle = 'rgba(216,184,120,.95)'; ctx.fillRect(CX - w / 2 - U(3), 0, U(4), H); ctx.fillRect(CX + w / 2 - U(1), 0, U(4), H); ctx.globalCompositeOperation = 'screen'; const gr = ctx.createLinearGradient(CX - w / 2 - U(150), 0, CX - w / 2, 0); gr.addColorStop(0, 'rgba(255,210,140,0)'); gr.addColorStop(1, 'rgba(255,210,140,.45)'); ctx.fillStyle = gr; ctx.fillRect(CX - w / 2 - U(150), 0, U(150), H); ctx.restore(); } },
  weave: { mask: (g, p) => { const n = 9, sw = W / n; for (let i = 0; i < n; i++) { const q = E.inOutCubic(clamp(p * 1.7 - i * .08)); const h = H * q; i % 2 ? g.rect(i * sw, 0, sw + 1, h) : g.rect(i * sw, H - h, sw + 1, h); } }, edge: () => {} },
  wing: { mask: (g, p) => g.rect(0, 0, W * E.inOutCubic(p), H), edge: (p) => { if (p <= 0 || p >= 1) return; const x = W * E.inOutCubic(p); const gr = ctx.createLinearGradient(x - U(220), 0, x, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,.9)'); ctx.fillStyle = gr; ctx.fillRect(x - U(220), 0, U(220), H); ctx.fillStyle = '#E40C0C'; ctx.fillRect(x - U(3), 0, U(7), H); } },
  plus: { mask: (g, p) => { const e = E.inQuart(p); plusPath(g, CX, CY, BIG * 1.4 * e + 1, BIG * .42 * e + 1, p * Math.PI / 4); }, edge: (p) => { if (p <= 0 || p >= 1) return; const e = E.inQuart(p); ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = U(6); ctx.beginPath(); plusPath(ctx, CX, CY, BIG * 1.4 * e + 1, BIG * .42 * e + 1, p * Math.PI / 4); ctx.stroke(); ctx.restore(); } },
  tiles: { mask: (g, p) => { const s = U(180), nx = Math.ceil(W / s), ny = Math.ceil(H / s); for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) { const q = clamp(p * 2.2 - ((i + j) % 2) * .3 - (i + j) / (nx + ny) * .9); if (q <= 0) continue; const k = s * E.outCubic(q); g.rect(i * s + (s - k) / 2, j * s + (s - k) / 2, k + 1, k + 1); } },
    edge: (p) => { if (p <= 0 || p >= 1) return; ctx.save(); ctx.strokeStyle = 'rgba(232,237,242,.7)'; ctx.lineWidth = U(1.5); const s = U(180); for (let x = 0; x < W; x += s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += s) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); } ctx.restore(); } },
  burst: { mask: (g, p) => starPath(g, CX, CY, BIG * 1.6 * E.inQuart(p) + 1, 8, .3, p), edge: (p, t) => { if (p <= 0 || p >= 1) return; burst(CX, CY, BIG * 1.2 * Math.sin(p * Math.PI), t * 2, .55); } },
  amber: { mask: (g, p, t) => { const y = mix(-U(80), H + U(80), E.inOutCubic(p)); g.moveTo(0, -10); g.lineTo(W, -10); for (let x = W; x >= 0; x -= U(20)) g.lineTo(x, y + Math.sin(x / U(110) + t * 6) * U(18)); g.closePath(); },
    edge: (p, t) => { if (p <= 0 || p >= 1) return; const y = mix(-U(80), H + U(80), E.inOutCubic(p)); ctx.save(); ctx.globalCompositeOperation = 'screen'; const gr = ctx.createLinearGradient(0, y - U(90), 0, y + U(30)); gr.addColorStop(0, 'rgba(255,170,70,0)'); gr.addColorStop(.8, 'rgba(255,180,90,.85)'); gr.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = gr; ctx.fillRect(0, y - U(90), W, U(120)); ctx.restore(); } },
};
const tr = (dev, a, d = .45) => ({ mask: (g, t) => DEV[dev].mask(g, prog(t, a, a + d), t), dev, a, d });
function labelRect() { const m = U(VERT ? 110 : 90); return VERT ? [m, L.y0 + U(120), W - 2 * m, L.sh * .62] : [L.x0 + U(40), L.y0 + U(30), L.sw - U(80), L.sh - U(60)]; }
function labelFrame([x, y, w, h], p, a) { if (p <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#F3E6D0'; const per = 2 * (w + h); ctx.lineWidth = U(4); ctx.setLineDash([per * p, per]); ctx.strokeRect(x, y, w, h); ctx.lineWidth = U(1.5); ctx.strokeRect(x + U(14), y + U(14), w - U(28), h - U(28)); ctx.setLineDash([]); ctx.fillStyle = '#E0453C'; const s = U(13) * p; for (const [cx, cy] of [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4); ctx.fillRect(-s / 2, -s / 2, s, s); ctx.restore(); } ctx.restore(); }

function weaveLines(a, t, gap = U(46)) { ctx.save(); ctx.globalAlpha = a; for (let x = (t * U(14)) % gap; x < W; x += gap) { ctx.fillStyle = 'rgba(60,180,84,.55)'; ctx.fillRect(x, 0, U(2), H); } for (let y = (t * U(10)) % gap; y < H; y += gap) { ctx.fillStyle = 'rgba(180,204,84,.4)'; ctx.fillRect(0, y, W, U(2)); } ctx.restore(); }
function blueprint(a, p = 1, s = U(72)) { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#8FA3B8'; ctx.lineWidth = U(1); for (let x = CX % s; x < W; x += s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H * p); ctx.stroke(); } for (let y = CY % s; y < H; y += s) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W * p, y); ctx.stroke(); } ctx.restore(); }
function guilloche(cx, cy, r, t, a) { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#E6C88F'; ctx.lineWidth = U(1); for (let k = 0; k < 7; k++) { ctx.beginPath(); for (let i = 0; i <= 360; i++) { const th = i / 180 * Math.PI; const rr = r * (.82 + .1 * Math.sin(th * 12 + k * .9 + t * .4) + k * .025); const X = cx + Math.cos(th) * rr, Y = cy + Math.sin(th) * rr; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } ctx.stroke(); } ctx.restore(); }

// ---------------- logos + type ----------------
const SLw = (maxW, maxH) => Math.min(maxW, maxH * IMG.sponsor.width / IMG.sponsor.height);
const SL = (cx, cy, maxW, maxH, o = {}) => { const w = SLw(maxW, maxH); drawImg(ctx, IMG.sponsor, cx, cy, w, o); return { w, h: w * IMG.sponsor.height / IMG.sponsor.width }; };
const wmH = w => w * IMG.wizkid.height / IMG.wizkid.width, lolH = w => w * IMG.lol.height / IMG.lol.width;
const fitW = (s, frac, o, cap) => Math.min(fitSize(ctx, s, L.sw * frac, o), cap);
function maskUp(x, y, w, h, p, fn) { if (p <= 0) return; ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.translate(0, (1 - E.outQuart(clamp(p))) * h); fn(); ctx.restore(); }
// type voice per brand
const dateStyle = () => SP.type.date, venueStyle = () => SP.type.venue;
function drawDate(x, y, size, o = {}) { const d = SP.type.date; text(ctx, BRAND.event.dateLong, x, y, { fam: d.fam, w: d.w, italic: d.italic, size, track: d.track ?? .02, color: o.color || d.color, align: o.align || 'center', alpha: o.alpha ?? 1, shadow: ['rgba(0,0,0,.45)', U(24)], chars: o.chars }); }
function drawVenue(x, y, size, o = {}) { const v = SP.type.venue; text(ctx, BRAND.event.venue, x, y, { fam: v.fam, w: v.w, size, track: v.track ?? .3, color: o.color || v.color, align: o.align || 'center', alpha: o.alpha ?? 1, shadow: ['rgba(0,0,0,.5)', U(18)] }); }
// the ticket CTA (brand-shaped). Returns height.
function cta(cx, cy, w, p, style) {
  if (p <= 0) return;
  const st = SP.cta, h = U(st.h || 116), x = cx - w / 2, y = cy - h / 2;
  const e = clamp(E.outBack(clamp(p), 1.4), 0, 1.06);
  ctx.save(); ctx.globalAlpha *= clamp(p * 2); ctx.translate(cx, cy); ctx.scale(mix(.9, 1, e), mix(.9, 1, e)); if (st.rot) ctx.rotate(st.rot); ctx.translate(-cx, -cy);

  else if (st.shape === 'hairline') { ctx.strokeStyle = st.line; ctx.lineWidth = U(2); ctx.strokeRect(x, y, w, h); ctx.strokeRect(x + U(8), y + U(8), w - U(16), h - U(16)); ctx.fillStyle = st.bg || 'rgba(0,0,0,.35)'; ctx.fillRect(x + U(8), y + U(8), w - U(16), h - U(16)); }
  else if (st.shape === 'sticker') { ctx.fillStyle = st.shadow; ctx.fillRect(x + U(14), y + U(14), w, h); ctx.fillStyle = st.bg; ctx.fillRect(x, y, w, h); }
  else if (st.shape === 'bar') { ctx.fillStyle = st.bg; ctx.beginPath(); ctx.moveTo(x - U(30), y + h); ctx.lineTo(x, y); ctx.lineTo(x + w + U(30), y); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill(); }
  else if (st.shape === 'plaque') { ctx.fillStyle = st.bg; ctx.fillRect(x, y, w, h); ctx.strokeStyle = st.line; ctx.lineWidth = U(2); ctx.strokeRect(x + U(7), y + U(7), w - U(14), h - U(14)); }

function festivalInfo(t) {

    ctx.save(); ctx.globalAlpha = oL; const e = st.lol === 'pop' ? clamp(E.outBack(pL, 1.8), 0, 1.15) : E.outQuart(pL);

    else lolLogo(ctx, CX, y, w, { chevL: { a: clamp(pL * 2), dx: -(1 - e) * .2 }, chevR: { a: clamp(pL * 2), dx: (1 - e) * .2 }, word: { a: clamp(pL * 3), s: st.lol === 'pop' ? e : mix(1.12, 1, e) }, mf: { a: E.outCubic(prog(t, bt(10), bt(10.8))) }, zig: { a: 1, reveal: E.outCubic(prog(t, bt(10.2), bt(11.2))) } });
    sweepImg(ctx, IMG.lolWord, CX, y, w, prog(t, bt(10.6), bt(12)), S.sheen);

    const w = L.sw * pick3(.96, .8, .72), h = wmH(w), y = S.pos?.wiz ? S.pos.wiz() : (VERT ? L.y0 + L.sh * .2 : L.y0 + L.sh * .22);
    const p = prog(t, bt(13), bt(14.2)), o = 1 - E.inCubic(prog(t, bt(16.6), bt(17)));

    if (st.wiz === 'slices') { const n = 7; for (let i = 0; i < n; i++) { ctx.save(); ctx.beginPath(); ctx.rect(0, y - h / 2 + h * i / n, W, h / n + 1); ctx.clip(); ctx.translate((i % 2 ? 1 : -1) * W * (1 - E.outQuint(clamp(p * 1.5 - i * .06))), 0); drawImg(ctx, IMG.wizkid, CX, y, w); ctx.restore(); } }

    else if (st.wiz === 'mask') maskUp(0, y - h / 2 - U(8), W, h + U(16), p, () => drawImg(ctx, IMG.wizkid, CX, y, w));
    else { const e = E.outCubic(p); drawImg(ctx, IMG.wizkid, CX, y + (1 - e) * U(30), w, { alpha: e, blur: (1 - e) * U(12) }); }
    sweepImg(ctx, IMG.wizkid, CX, y, w, prog(t, bt(14.2), bt(15.8)), S.sheen);

    const ds = fitW(BRAND.event.dateLong, pick3(.94, .74, .66), { fam: SP.type.date.fam, w: SP.type.date.w, italic: SP.type.date.italic }, U(170));

// lock-up with the ticket CTA (bt 21 → 15.0 s)
function lockupCTA(t) {

  const lt = t - bt(20), S = SP;
  const sc = E.outCubic(prog(lt, 0, .35)); ctx.save(); ctx.globalAlpha = .78 * sc; fill(S.scrim || 'rgba(0,0,0,1)'); ctx.restore();

  const wW = L.sw * pick3(.8, .62, .5) * (S.lockWizK || 1), wH = wmH(wW);
  const lW = pick3(L.sw * .44, L.sw * .3, L.sh * .3), lHh = lolH(lW);
  const ds = U(pick3(86, 70, 60)), vs = U(pick3(38, 32, 28)), cH = U(S.cta.h || 116), cW = Math.min(L.sw * pick3(.86, .66, .52), U(820));
  const gap = U(pick3(34, 22, 18));

    const blocks = [lHh, wH, ds * 1.05 + vs * 1.6, U(46) + cH];

    ctx.save(); ctx.globalAlpha = ap(0); lolLogo(ctx, CX, y0 + lHh / 2 + (1 - ap(0)) * U(20), lW); ctx.restore();
    ctx.save(); ctx.globalAlpha = ap(1); drawImg(ctx, IMG.wizkid, CX, y1 + wH / 2 + (1 - ap(1)) * U(20), wW); ctx.restore(); sweepImg(ctx, IMG.wizkid, CX, y1 + wH / 2, wW, prog(lt, .6, 1.6), S.sheen);
    drawDate(CX, y2 + ds * .86, ds, { alpha: ap(2) }); drawVenue(CX, y2 + ds * .86 + vs * 1.55, vs, { alpha: ap(2) });
    cta(CX, y3 + U(46) + cH / 2, cW, prog(lt, .2, .75));
  } else {
    const colL = L.x0 + L.sw * .17, colR = L.x0 + L.sw * .66;

    const dy = top + wmH(L.sw * .52) + U(80); drawDate(colR, dy, U(56), { alpha: ap(2) }); drawVenue(colR, dy + U(48), U(26), { alpha: ap(2) });
    cta(colR, dy + U(190), L.sw * .64, prog(lt, .2, .75));
  }
}

  trace: { logo: '11-trace', sheen: 'rgba(255,255,255,.9)', scrim: 'rgba(0,0,0,1)', filter: 'contrast(1.25) saturate(1.15) brightness(1.15)', grade: [],

  'square-meter': { logo: '12-square-meter', sheen: 'rgba(255,255,255,.8)', scrim: 'rgba(16,18,21,1)', filter: 'contrast(1.12) brightness(1.25) saturate(.85)', grade: [['soft-light', 'rgba(120,140,160,.2)']],
    type: { date: { fam: 'Montserrat', w: 800, color: '#FFFFFF', track: .02 }, venue: { fam: 'Montserrat', w: 600, color: '#C9D2DC' } },
    style: { lol: 'mask', wiz: 'mask', date: 'rise' }, cta: { shape: 'measure', fg: '#FFFFFF', lead: '#C9D2DC' },

                  ...[0, 1, 2].map(i => shot(T_(13), T_(17), 'walk', { from: 5.9 + i * .06, to: 7.6, z: [1.1, 1.0], rect: () => panel(i, prog(_t, T_(13), T_(14))) })),

  'nova-flair': { logo: '13-nova-flair', sheen: 'rgba(255,220,160,.9)', scrim: 'rgba(16,4,16,1)', filter: 'contrast(1.14) saturate(1.3) brightness(1.18)', grade: [['soft-light', 'rgba(252,84,60,.26)'], ['soft-light', 'rgba(204,60,108,.18)']],
    type: { date: { fam: 'Archivo', w: 400, color: '#FFFFFF', track: .01 }, venue: { fam: 'Montserrat', w: 800, color: '#FCB424' } },

    shots: () => [shot(T1 - .6, T_(13), 'stage', { from: .1, to: 1.4, z: [1.14, 1.0], mask: tr('burst', T1 - .6, .6).mask }),

function panel(i, p) { const e = E.outCubic(p), g = U(18); if (VERT) { const h = (L.sh - 2 * g) / 3; return [L.x0 + (1 - e) * (i % 2 ? W : -W) * .3, L.y0 + i * (h + g), L.sw, h]; } const w = (L.sw - 2 * g) / 3; return [L.x0 + i * (w + g), L.y0 + (1 - e) * (i % 2 ? H : -H) * .3, w, L.sh]; }

const SID = Q.get('s') || 'hennessy', SP = SPONS[SID];
let _t = 0;
SP._shots = SP.shots();
// the outgoing shot keeps playing underneath the incoming shot's brand transition
for (const [, a, d] of SP.trans) { const inc = SP._shots.find(c => Math.abs(c.a - a) < .02); if (!inc) continue; for (const c of SP._shots) if (c !== inc && Math.abs(c.b - a) < .02) c.b = Math.max(c.b, a + d + .02); }
// transitions get real sub-frame motion blur
const blurWins = SP.trans.map(([, a, d]) => [a, a + d]);
const needsBlur = t => blurWins.some(([a, b]) => t > a && t < b);

async function drawFrame(t) {
  _t = t; window.__t = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  fill('#000');
  if (t < T2) {
    // camera shake on hits
    const sh = SP.hits.reduce((s, h) => s + (t >= h ? Math.exp(-(t - h) * 9) : 0), 0);
    ctx.save(); if (sh > .01) ctx.translate(Math.sin(t * 61) * U(14) * sh, Math.cos(t * 53) * U(12) * sh);
    if (t < T1 + .02) SP.opening(t);
    for (const c of SP._shots) if (t >= c.a && t < c.b) await drawShot(c, t);
    if (SP._shots.some(c => t >= c.a)) SP.fx?.call(SP, t);
    ctx.restore();
    if (t >= T1 - .05) { festivalInfo(t); lockupCTA(t); }
    bug(t);
    vignette(ctx, L, .36);
    for (const h of SP.hits) if (t >= h) flash(ctx, L, (1 - prog(t, h, h + .12)) * .18, '#ffffff');
  } else {
    SP.closing(t - T2);                       // 00:15-00:20: sponsor logo only
    flash(ctx, L, E.inQuad(prog(t, 19.8, 20)) * .3, '#000');
  }
}
async function renderAt(frame) {
  window.__log = { texts: [], imgs: [] };
  const t = frame / FPS;
  if (!needsBlur(t)) { await drawFrame(t); }
  else {
    const K = 6, [acc, ax] = off(9);
    for (let i = 0; i < K; i++) { await drawFrame(t + (i / (K - 1) - .5) * (.85 / FPS)); ax.globalAlpha = 1 / (i + 1); ax.drawImage(cv, 0, 0); }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.drawImage(acc, 0, 0);
  }
  grain(ctx, L, frame, .045);
}
// SFX cue sheet from the edit (layered under the supplied track)
function cueList() {
  const c = [];
  for (const [, a, d] of SP.trans) { c.push({ t: a + d * .5 - .3, k: 'whoosh', g: .5 }); }
  for (const h of SP.hits) c.push({ t: h, k: 'hit', g: .45 });
  c.push({ t: bt(9.2), k: 'impact', g: .5 }, { t: bt(13), k: 'hit', g: .5 }, { t: bt(20), k: 'impact', g: .5 }, { t: T2 - .3, k: 'whoosh', g: .45 }, { t: T2, k: 'boom', g: .55 }, { t: T2 + 1.0, k: 'shimmer', g: .35 });
  return c;
}
window.cues = () => ({ bpm: BPM, dur: DUR, cues: cueList(), name: 'sp-lux', sponsor: SID, sfxOnly: true });
window.grab = async (f) => { await renderAt(f); return cv.toDataURL('image/jpeg', .93).slice(23); };
window.audit = async (f) => { await renderAt(f); return window.__log; };
window.meta = { FPS, DUR, END: T2, W, H, sponsorLogo: SP.logo + '.png', ctaFrom: bt(20) };
window.ready = (async () => { await loadFonts(); await Promise.all([loadBrand(), loadFootageMeta()]); IMG.sponsor = IMG[SP.logo]; makeGrain(); })();
