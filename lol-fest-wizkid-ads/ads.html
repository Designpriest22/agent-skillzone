<html><head><meta charset="utf-8"><title>LOL FEST x WIZKID cinematic ads</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}#ui{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace}</style>
</head><body><canvas id="c"></canvas><div id="ui"></div>
<script src="lib.js"></script>
<script src="endcard.js"></script>
<script>
'use strict';
// ?c=c1|c2|c3  &f=story|reels|feed|square|land|bbL|bbP|bb4k|master   (open without ?render=1 for a live preview)
const Q = new URLSearchParams(location.search);
const L = layout(Q.get('f') || 'story');
const FPS = 25, DUR = 20, END = 15;           // 00:00-00:15 story, 00:15-00:20 sponsor + event card
const cv = document.getElementById('c'); cv.width = L.W * L.dpr; cv.height = L.H * L.dpr;
cv.style.aspectRatio = `${L.W}/${L.H}`;
const ctx = cv.getContext('2d');
const U = n => n * L.u;                        // size in 1080-short-side units
const pick = (o) => (o && typeof o === 'object' && !Array.isArray(o) && ('v' in o || 'w' in o || 's' in o || 'd' in o))
  ? (L.vert ? o.v ?? o.d : L.wide ? o.w ?? o.d : o.s ?? o.d) : o;
const val = (v, u) => { v = pick(v); return typeof v === 'function' ? v(u) : Array.isArray(v) ? mix(v[0], v[1], E.inOutQuad(u)) : v; };
const OFF = [];
function off(i) { // offscreen layer at full resolution, same transform as the main ctx
  if (!OFF[i]) { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; OFF[i] = c; }
  const x = OFF[i].getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height); x.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; x.filter = 'none'; return [OFF[i], x];
}
function blit(c, a = 1, op = 'source-over') { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a; ctx.globalCompositeOperation = op; ctx.drawImage(c, 0, 0); ctx.restore(); }

// ---- clip engine: timeline -> source time remap (speed ramps), reframing, grade, masks ----
function srcAt(c, t) {
  const k = c.keys; if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) return mix(k[i - 1][1], k[i][1], (k[i][2] || E.lin)(prog(t, k[i - 1][0], k[i][0])));
  return k[k.length - 1][1];
}
async function drawClip(c, t, g = ctx) {
  const u = prog(t, c.a, c.b);
  const s = c.freeze ?? srcAt(c, t);
  const speed = c.freeze !== undefined ? 0 : (srcAt(c, t + .02) - srcAt(c, t - .02)) / .04;
  const img = await srcFrame(s, c.freeze !== undefined || speed < .93);
  g.save();
  if (c.mask) { g.beginPath(); c.mask(g, t); g.clip(); }
  const f = val(c.filter, u); if (f) g.filter = f;
  const shake = c.shake ? [Math.sin(t * 37) * c.shake(t) * .004, Math.cos(t * 29) * c.shake(t) * .004] : [0, 0];
  const r = drawCover(g, img, 0, 0, L.W, L.H, val(c.fx, u), val(c.fy, u), val(c.z, u) || 1, ...shake);
  g.filter = 'none';
  if (c.look) grade(g, L, val(c.look, u), val(c.lookK, u) ?? 1);
  g.restore();
  c._r = r; c._s = s;
  return r;
}
function trackAt(name, s) { // source time -> tracked point (normalised)
  const tr = FOOT.track[name]; const f = s * 25; let best = tr[0];
  for (const p of tr) if (Math.abs(p[0] - f) < Math.abs(best[0] - f)) best = p;
  // sub-frame interpolation
  const i = tr.indexOf(best), j = clamp(f > best[0] ? i + 1 : i - 1, 0, tr.length - 1);
  const q = tr[j]; const k = q[0] === best[0] ? 0 : (f - best[0]) / (q[0] - best[0]);
  return [mix(best[1], q[1], clamp(k)), mix(best[2], q[2], clamp(k))];
}

// ---------- event-info blocks shared by every concept ----------
// billboard brand bug: always-on festival / date identification during the footage section
// billboard brand bug: festival mark + date + venue held on screen through the footage section
function bbBug(t, a = 1) {
  if (!L.bb) return;
  const p = E.outCubic(prog(t, .4, 1.1)) * a;
  if (p <= 0) return;
  const w = U(L.wide ? 250 : 300);
  const h = w * IMG.lol.height / IMG.lol.width;
  ctx.save(); ctx.globalAlpha = p;
  lolLogo(ctx, L.x0 + w / 2, L.y0 + h / 2, w);
  const ds = U(L.wide ? 64 : 70);
  text(ctx, BRAND.event.dateLong, L.x1, L.y0 + ds * .9, { fam: 'Anton', size: ds, track: .02, align: 'right', color: BRAND.white, shadow: ['rgba(0,0,0,.6)', U(20)] });
  text(ctx, BRAND.event.venue, L.x1, L.y0 + ds * .9 + U(54), { fam: 'Oswald', w: 700, size: U(36), track: .26, align: 'right', color: BRAND.cream, shadow: ['rgba(0,0,0,.7)', U(16)] });
  ctx.restore();
}
// fit helper: size so `str` fills `frac` of the safe width, capped
const fitW = (str, frac, o, cap) => Math.min(fitSize(ctx, str, L.sw * frac, o), cap);

// ============================================================================================
// CONCEPT 1 - THE SUPERSTAR EXPERIENCE   (96 BPM · gold-noir grade · 2.39 letterbox · slow ramps · thin flyer type)
// Copy: LIVE OUT LOUD MUSIC FESTIVAL / WIZKID / DECEMBER 13, 2026 / EAGLE SQUARE, ABUJA / LIVE ABUJA (flyer lock-up)
// ============================================================================================
const C1 = (() => {
  const b = 60 / 96;
  const T = { a: 0, shadow: 4 * b, arrival: 6 * b, walk: 8 * b, profile: 12 * b, aerial: 15 * b, stage: 17 * b, lock: 20.5 * b };
  const clips = [
    { a: 0, b: T.shadow, keys: [[0, 10.86], [T.shadow, 12.16]], fx: { v: [.56, .66], d: [.5, .56] }, fy: { d: .48, w: .42 }, z: [1.16, 1.0], look: 'gold', lookK: .8, filter: 'brightness(1.08) contrast(1.06)' },
    { a: T.shadow, b: T.arrival, keys: [[T.shadow, 9.74], [T.arrival, 10.8]], fx: .45, fy: .42, z: [1.12, 1.2], look: 'gold', filter: 'brightness(2.3) contrast(1.15) saturate(.9)' },
    { a: T.arrival, b: T.walk, keys: [[T.arrival, 4.3], [T.walk, 5.62]], fx: { v: [.24, .6], d: [.4, .5] }, fy: .56, z: [1.04, 1.1], look: 'gold', filter: 'brightness(1.25) contrast(1.08)' },
    { a: T.walk, b: T.profile, keys: [[T.walk, 5.76], [T.profile, 7.9]], fx: { v: .47, d: .5 }, fy: { d: .52, w: .45 }, z: [1.06, 1.0], look: 'gold', filter: 'brightness(1.32) contrast(1.06)' },
    { a: T.profile, b: T.aerial, keys: [[T.profile, 7.94], [T.aerial, 9.5]], fx: { v: [.38, .44], d: .45 }, fy: { d: .45, w: .4 }, z: [1.0, 1.08], look: 'gold', lookK: .7, filter: 'contrast(1.05)' },
    { a: T.aerial, b: T.stage, keys: [[T.aerial, 2.46], [T.stage, 3.7]], fx: .52, fy: { d: .5, w: .45 }, z: [1.12, 1.0], look: 'gold', filter: 'brightness(1.3) contrast(1.1)' },
    { a: T.stage, b: T.lock, keys: [[T.stage, .12], [T.stage + .9, .98, E.lin], [T.lock, 1.9, E.outQuad]], fx: .5, fy: { d: .44, w: .4, v: .46 }, z: [1.0, 1.1], look: 'gold', lookK: .55, filter: 'contrast(1.08) saturate(1.06)' },
    { a: T.lock, b: END, keys: [[T.lock, 1.9]], freeze: 1.9, fx: .5, fy: .45, z: [1.1, 1.18], look: 'gold', filter: 'blur(16px) brightness(.3) saturate(.8)' },
  ];
  const cues = [
    { t: 0, k: 'swell', d: T.shadow }, { t: T.shadow, k: 'hit', g: .7 }, { t: T.arrival, k: 'hit', g: .75 }, { t: T.walk, k: 'thump' },
    { t: T.walk - .35, k: 'whoosh', g: .5 }, { t: T.profile, k: 'chime' }, { t: T.aerial - .5, k: 'whoosh', g: .6 }, { t: T.aerial, k: 'sub' },
    { t: T.stage - 1.2, k: 'riser', d: 1.2 }, { t: T.stage, k: 'impact' }, { t: T.stage + 1.0, k: 'shimmer' }, { t: T.lock - .4, k: 'reverse', d: .4 },
    { t: T.lock, k: 'boom' }, { t: T.lock + .9, k: 'shimmer', g: .5 }, { t: END - .35, k: 'whoosh', g: .7 }, { t: END, k: 'impact', g: .8 },
  ];
  const soft = (t, t0, spd = .035, d = .5) => (i) => { const p = E.outCubic(prog(t, t0 + i * spd, t0 + i * spd + d)); return { a: p, dy: (1 - p) * U(22) }; };
  function overlay(t) {
    const bb = L.bb;
    const lbT = L.wide ? (1 - (L.W / 2.39) / L.H) / 2 : L.vert ? .085 : .07;
    const lb = lbT * (1 - E.inOutCubic(prog(t, T.stage - .05, T.stage + .5)));
    // the festival title, set small and spaced like the flyer's "MUSIC FESTIVAL" line, inside the scope frame
    if (t < T.shadow) {
      const a = 1 - E.inCubic(prog(t, T.shadow - .4, T.shadow));
      const s = bb ? U(52) : U(L.vert ? 34 : 32);
      const y = L.vert ? L.y0 + L.sh * .7 : L.H * (1 - lbT) - U(L.wide ? 60 : 80);
      text(ctx, BRAND.event.festival, L.cx, y, { fam: 'Montserrat', w: 500, size: s, track: .34, color: BRAND.cream, alpha: a, chars: soft(t, .45, .035, .6) });
    }
    // walk-out: motion-tracked marker with the official WIZKID wordmark as its label
    if (t > T.walk && t < T.profile) {
      const c = clips[3]; const [nx, ny] = trackAt('walk', c._s ?? 6);
      const [px, py] = c._r.map(nx, ny - .03);
      const out = 1 - E.inCubic(prog(t, T.profile - .3, T.profile));
      const p = E.outCubic(prog(t, T.walk + .35, T.walk + .9)) * out;
      const lx = px + U(L.vert ? 140 : 240), lyy = py - U(L.vert ? 240 : 200);
      const lw = U(bb ? 520 : L.vert ? 400 : 440), lh = lw * IMG.wizkid.height / IMG.wizkid.width;
      ctx.save(); ctx.globalAlpha = p; ctx.strokeStyle = BRAND.cream; ctx.lineWidth = U(2);
      ctx.beginPath(); ctx.arc(px, py, U(14), 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(px, py, U(3.5), 0, Math.PI * 2); ctx.fillStyle = BRAND.cream; ctx.fill();
      const q = E.outCubic(prog(t, T.walk + .5, T.walk + 1.05));
      ctx.beginPath(); ctx.moveTo(px + U(10), py - U(10)); ctx.lineTo(mix(px + U(10), lx, q), mix(py - U(10), lyy, q));
      ctx.lineTo(lx + lw * prog(t, T.walk + 1.0, T.walk + 1.35), lyy); ctx.stroke(); ctx.restore();
      const m = E.outQuart(prog(t, T.walk + 1.1, T.walk + 1.6)) * out;
      if (m > 0) withClip(ctx, c2 => c2.rect(lx, lyy - lh - U(14), lw, lh + U(6)), () => drawImg(ctx, IMG.wizkid, lx + lw / 2, lyy - lh / 2 - U(12) + (1 - m) * lh, lw));
    }
    // profile: the date, in the flyer's thin condensed voice, tracking breathes closed
    if (t > T.profile && t < T.aerial) {
      const a = env(t, T.profile + .1, T.aerial, .4, .25);
      const s = fitW(BRAND.event.dateLong, L.vert ? .92 : L.wide ? .6 : .8, { fam: 'Oswald', w: 200, track: .14 }, U(bb ? 170 : 150));
      const y = L.vert ? L.y0 + L.sh * .74 : L.wide ? L.H * .66 : L.y0 + L.sh * .74;
      text(ctx, BRAND.event.dateLong, L.cx, y, { fam: 'Oswald', w: 200, size: s, track: mix(.2, .14, E.outCubic(prog(t, T.profile, T.aerial))), color: BRAND.white, alpha: a, chars: soft(t, T.profile + .1, .03, .5) });
    }
    // aerial: the venue
    if (t > T.aerial && t < T.stage) {
      const a = env(t, T.aerial + .03, T.stage, .3, .2);
      const s = fitW('EAGLE SQUARE,', L.vert ? .9 : L.wide ? .5 : .74, { fam: 'Oswald', w: 200, track: .16 }, U(bb ? 200 : 180));
      const tr = mix(.24, .16, E.outCubic(prog(t, T.aerial, T.stage)));
      text(ctx, 'EAGLE SQUARE,', L.cx, L.cy - s * .08, { fam: 'Oswald', w: 200, size: s, track: tr, color: BRAND.white, alpha: a });
      text(ctx, 'ABUJA', L.cx, L.cy + s * .95, { fam: 'Bebas', size: s * 1.02, track: .06, color: BRAND.orange, alpha: a });
    }
    // stage: the flyer's WIZKID / LIVE / ABUJA lock-up over the pyro
    if (t > T.stage + .7 && t < T.lock + .05) {
      const p = E.outQuint(prog(t, T.stage + .8, T.stage + 1.6));
      const out = 1 - E.inCubic(prog(t, T.lock - .2, T.lock + .05));
      const w = L.sw * (L.vert ? .96 : L.wide ? .5 : .82) * (bb ? 1.04 : 1);
      const h = w * IMG.wizkid.height / IMG.wizkid.width;
      const y = L.vert ? L.y0 + L.sh * .2 : L.wide ? L.H * .13 + h / 2 : L.y0 + L.sh * .2;
      drawImg(ctx, IMG.wizkid, L.cx, y, w, { alpha: p * out, s: mix(1.12, 1, p), blur: (1 - p) * U(12) });
      sweepImg(ctx, IMG.wizkid, L.cx, y, w, prog(t, T.stage + 1.2, T.stage + 2.2));
      const p2 = E.outCubic(prog(t, T.stage + 1.25, T.stage + 1.8)) * out;
      const s = U(bb ? 78 : 64);
      const wL = measure(ctx, 'LIVE', { fam: 'Oswald', w: 200, size: s, track: .25 }), wA = measure(ctx, 'ABUJA', { fam: 'Bebas', size: s * 1.02, track: .02 });
      const gx = L.cx - (wL + U(30) + wA) / 2;
      text(ctx, 'LIVE', gx, y + h / 2 + s * 1.15, { fam: 'Oswald', w: 200, size: s, track: .25, align: 'left', color: BRAND.white, alpha: p2 });
      text(ctx, 'ABUJA', gx + wL + U(30), y + h / 2 + s * 1.15, { fam: 'Bebas', size: s * 1.02, track: .02, align: 'left', color: BRAND.orange, alpha: p2 });
    }
    letterbox(ctx, L, t < T.lock ? lb : 0);
    if (t >= T.lock) drawLockup(t - T.lock, { t0: .05, step: .16, ease: E.outCubic, rise: 24, sweep: .7,
      lolAnim: (lt0) => { const lt = lt0 - (LK.wide ? .05 : .21); return { chevL: { a: E.outCubic(prog(lt, 0, .4)), dx: -(1 - E.outCubic(prog(lt, 0, .5))) * .12 }, chevR: { a: E.outCubic(prog(lt, 0, .4)), dx: (1 - E.outCubic(prog(lt, 0, .5))) * .12 }, word: { a: 1, reveal: E.outQuart(prog(lt, 0, .55)) }, mf: { a: E.outCubic(prog(lt, .4, .75)) }, zig: { a: 1, reveal: E.outCubic(prog(lt, .5, .9)) } }; } });
    flash(ctx, L, (1 - prog(t, T.stage, T.stage + .28)) * (t >= T.stage ? .85 : 0), '#fff4e0');
    flash(ctx, L, (1 - prog(t, T.lock, T.lock + .35)) * (t >= T.lock ? .45 : 0), '#ffd9a0');
    if (t > END - .25) flash(ctx, L, E.inCubic(prog(t, END - .25, END)), '#000');
    bbBug(t, t < T.lock - .2 ? 1 : 0);
  }
  return { clips, cues, overlay, bpm: 96, name: 'superstar', sponsor: { mode: 'rise', delay: .15, stagger: .055, dur: .6 } };
})();

// ============================================================================================
// CONCEPT 2 - THE FESTIVAL IS CALLING   (120 BPM · heat grade · beat-cut montage · kinetic flyer type · zigzag wipes)
// Copy: 13 DEC / ABUJA (flyer) · festival logo · EAGLE SQUARE, ABUJA · DECEMBER 13, 2026 built word-by-word on the cuts · WIZKID / LIVE ABUJA
// ============================================================================================
const C2 = (() => {
  const b = .5;
  const T = { open: 0, aerial: 4 * b, stage: 7 * b, m1: 11 * b, m2: 12 * b, m3: 13 * b, m4: 14 * b, m5: 15 * b, walk: 16 * b, wiz: 20 * b, smoke: 24 * b, info: 26 * b };
  const zigMask = (t0, d = .42, dir = 1) => (g, t) => {
    const p = E.inOutCubic(prog(t, t0, t0 + d)); const W = L.W, H = L.H;
    const x = mix(dir > 0 ? -W * .25 : W * 1.25, dir > 0 ? W * 1.25 : -W * .25, p);
    const amp = U(70), seg = U(70);
    g.moveTo(dir > 0 ? -10 : W + 10, -10); g.lineTo(x, -10);
    for (let y = -10, i = 0; y < H + seg; y += seg, i++) g.lineTo(x + (i % 2 ? amp : 0) * dir, y);
    g.lineTo(dir > 0 ? -10 : W + 10, H + 10); g.closePath();
  };
  const zigEdge = (t, t0, d = .42, dir = 1) => {
    const p = E.inOutCubic(prog(t, t0, t0 + d)); if (p <= 0 || p >= 1) return;
    const x = mix(dir > 0 ? -L.W * .25 : L.W * 1.25, dir > 0 ? L.W * 1.25 : -L.W * .25, p);
    const amp = U(70), seg = U(70);
    ctx.save(); ctx.strokeStyle = BRAND.orange; ctx.lineWidth = U(34); ctx.lineJoin = 'miter'; ctx.beginPath();
    for (let y = -10, i = 0; y < L.H + seg; y += seg, i++) { const xx = x + (i % 2 ? amp : 0) * dir - U(10) * dir; i ? ctx.lineTo(xx, y) : ctx.moveTo(xx, y); }
    ctx.stroke(); ctx.strokeStyle = BRAND.cream; ctx.lineWidth = U(8); ctx.beginPath();
    for (let y = -10, i = 0; y < L.H + seg; y += seg, i++) { const xx = x + (i % 2 ? amp : 0) * dir - U(46) * dir; i ? ctx.lineTo(xx, y) : ctx.moveTo(xx, y); }
    ctx.stroke(); ctx.restore();
  };
  const clips = [
    { a: T.aerial - .25, b: T.stage + .45, keys: [[T.aerial - .25, 2.5], [T.stage + .45, 4.2]], fx: .52, fy: { d: .5, w: .44 }, z: [1.0, 1.18], look: 'heat', filter: 'brightness(1.35) contrast(1.15) saturate(1.2)' },
    { a: T.stage, b: T.m1, keys: [[T.stage, .0], [T.m1, 1.05]], fx: .5, fy: { d: .45, w: .4 }, z: [1.08, 1.0], look: 'heat', lookK: .6, filter: 'contrast(1.12) saturate(1.2)', mask: zigMask(T.stage, .42, 1) },
    { a: T.m1, b: T.m2, keys: [[T.m1, 4.5], [T.m2, 5.0]], fx: { v: .3, d: .4 }, fy: .6, z: [1.12, 1.2], look: 'heat', filter: 'brightness(1.4) contrast(1.15)' },
    { a: T.m2, b: T.m3, keys: [[T.m2, 7.94], [T.m3, 8.44]], fx: .4, fy: .4, z: [1.15, 1.1], look: 'heat', lookK: .6, filter: 'contrast(1.1) saturate(1.15)' },
    { a: T.m3, b: T.m4, keys: [[T.m3, 1.4], [T.m4, 1.9]], fx: .5, fy: .62, z: 1.5, look: 'heat', filter: 'contrast(1.15) saturate(1.2)' },
    { a: T.m4, b: T.m5, keys: [[T.m4, 11.6], [T.m5, 12.1]], fx: { v: .66, d: .6 }, fy: .55, z: [1.0, 1.1], look: 'heat', lookK: .7, filter: 'brightness(1.3) contrast(1.1)' },
    { a: T.m5, b: T.walk, keys: [[T.m5, 3.2], [T.walk, 3.7]], fx: .5, fy: .5, z: 1.25, look: 'heat', filter: 'brightness(1.4) contrast(1.15) saturate(1.2)' },
    { a: T.walk, b: T.wiz, keys: [[T.walk, 5.8], [T.wiz, 7.86]], fx: .47, fy: { d: .5, w: .44 }, z: [1.12, 1.0], look: 'heat', filter: 'brightness(1.38) contrast(1.1)' },
    { a: T.wiz, b: T.smoke + .45, keys: [[T.wiz, .5], [T.wiz + .9, 1.4], [T.smoke + .45, 2.2, E.outQuad]], fx: .5, fy: { d: .44, w: .4 }, z: [1.0, 1.12], look: 'heat', lookK: .55, filter: 'contrast(1.12) saturate(1.2)' },
    { a: T.smoke, b: T.info, keys: [[T.smoke, 10.9], [T.info, 11.9]], fx: { v: [.55, .64], d: .55 }, fy: .5, z: [1.1, 1.02], look: 'heat', lookK: .8, filter: 'brightness(1.2) contrast(1.1)', mask: zigMask(T.smoke, .42, -1) },
    { a: T.info, b: END, keys: [[T.info, 11.9]], freeze: 11.9, fx: .55, fy: .5, z: [1.05, 1.12], look: 'heat', filter: 'blur(16px) brightness(.3) saturate(1.1)' },
  ];
  const cues = [
    { t: 0, k: 'hit', g: .7 }, { t: .5, k: 'hit', g: .75 }, { t: 1.0, k: 'hit', g: .8 }, { t: 1.6, k: 'riser', d: .4 }, { t: T.aerial, k: 'impact', g: .8 },
    { t: T.stage - .1, k: 'whoosh' }, { t: T.stage + .25, k: 'thump' }, { t: T.stage + .75, k: 'thump' }, { t: T.stage + 1.25, k: 'thump' },
    ...[T.m1, T.m2, T.m3, T.m4, T.m5].map(t => ({ t, k: 'hit', g: .75 })),
    { t: T.walk, k: 'impact', g: .6 }, { t: T.wiz - .9, k: 'riser', d: .9 }, { t: T.wiz, k: 'impact' }, { t: T.smoke - .1, k: 'whoosh' },

    // 00:15-00:20  sponsor logos ONLY
    sponsorFrame(t - END, C.sponsor);
  }
}
window.cues = () => ({ bpm: C.bpm, dur: DUR, cues: C.cues, name: C.name });
window.grab = async (frame) => { await renderAt(frame); return cv.toDataURL('image/jpeg', .93).slice(23); };
window.audit = async (frame) => { await renderAt(frame); return window.__log; };
window.meta = { FPS, DUR, END, W: L.W * L.dpr, H: L.H * L.dpr };
window.ready = (async () => { await loadFonts(); await Promise.all([loadBrand(), loadFootageMeta()]); makeGrain(); sponsorLayout(); lockupLayout(); })();
if (!Q.has('render')) {
  window.ready.then(async () => {
    const ui = document.getElementById('ui'); let f = Number(Q.get('t') || 0) * FPS;
    const loop = async () => { await renderAt(Math.floor(f)); ui.textContent = (f / FPS).toFixed(2) + 's'; f = (f + 1) % (DUR * FPS); requestAnimationFrame(loop); };
    loop();
  });
}
</script></body></html>
