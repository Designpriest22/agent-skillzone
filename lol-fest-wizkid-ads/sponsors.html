<!doctype html>
<html><head><meta charset="utf-8"><title>LOL FEST x sponsor co-branded ads</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}#ui{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace}</style>
</head><body><canvas id="c"></canvas><div id="ui"></div>
<script src="lib.js"></script>
<script>
'use strict';
// Individual 15 s co-branded spots, one creative concept per sponsor.   ?s=<sponsor id>&f=reels|feed|square
//  00:00-00:04 sponsor introduction · 00:04-00:10 LOL FEST experience (Wizkid footage + event information) · 00:10-00:15 co-branded lock-up
// Only this sponsor's logo appears; on-screen words are limited to lib.js APPROVED.
const Q = new URLSearchParams(location.search);
const L = layout(Q.get('f') || 'reels');
const FPS = 25, DUR = 15, T1 = 4, T2 = 10;
const cv = document.getElementById('c'); cv.width = L.W * L.dpr; cv.height = L.H * L.dpr; cv.style.aspectRatio = `${L.W}/${L.H}`;
const ctx = cv.getContext('2d');
const U = n => n * L.u, W = L.W, H = L.H;
const pick = (o) => (o && typeof o === 'object' && !Array.isArray(o) && ('v' in o || 'w' in o || 's' in o || 'd' in o)) ? (L.vert ? o.v ?? o.d : L.sq ? o.s ?? o.d : o.d) : o;
const val = (v, u) => { v = pick(v); return typeof v === 'function' ? v(u) : Array.isArray(v) ? mix(v[0], v[1], E.inOutQuad(u)) : v; };
const OFF = [];
function off(i) { if (!OFF[i]) { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; OFF[i] = c; } const x = OFF[i].getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height); x.setTransform(L.dpr, 0, 0, L.dpr, 0, 0); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; x.filter = 'none'; return [OFF[i], x]; }
function blit(c, a = 1, op = 'source-over') { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a; ctx.globalCompositeOperation = op; ctx.drawImage(c, 0, 0); ctx.restore(); }
// ---- footage clip engine (time remap, reframing, sponsor grade, masks) ----
function srcAt(c, t) { const k = c.keys; if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) return mix(k[i - 1][1], k[i][1], (k[i][2] || E.lin)(prog(t, k[i - 1][0], k[i][0]))); return k[k.length - 1][1]; }
function gradeL(g, list, k = 1) { if (!list) return; g.save(); for (const [op, col] of list) { g.globalCompositeOperation = op; g.globalAlpha = k; g.fillStyle = col; g.fillRect(0, 0, W, H); } g.restore(); }
async function drawClip(c, t, g = ctx, rect) {
  const u = prog(t, c.a, c.b); const s = c.freeze ?? srcAt(c, t);
  const sp = c.freeze !== undefined ? 0 : (srcAt(c, t + .02) - srcAt(c, t - .02)) / .04;
  const img = await srcFrame(s, c.freeze !== undefined || sp < .93);
  g.save(); if (c.mask) { g.beginPath(); c.mask(g, t); g.clip(); }
  const r0 = rect || c.rect?.(t) || [0, 0, W, H];
  if (rect || c.rect) { g.beginPath(); g.rect(...r0); g.clip(); }
  const f = val(c.filter ?? SP.filter, u); if (f) g.filter = f;
  const r = drawCover(g, img, r0[0], r0[1], r0[2], r0[3], val(c.fx ?? .5, u), val(c.fy ?? .5, u), val(c.z ?? 1, u));
  g.filter = 'none'; gradeL(g, c.grade ?? SP.grade, c.gradeK ?? 1);
  g.restore(); c._r = r; c._s = s; return r;
}
function trackAt(name, s) { const tr = FOOT.track[name]; const f = s * 25; let best = tr[0]; for (const p of tr) if (Math.abs(p[0] - f) < Math.abs(best[0] - f)) best = p; return [best[1], best[2]]; }
// shot shorthands (source seconds)
const SH = { stage: [0, 2.4], aerial: [2.48, 4.24], arrival: [4.3, 5.7], walk: [5.76, 7.9], profile: [7.94, 9.6], shadow: [9.72, 10.8], smoke: [10.86, 12.18] };
const clip = (a, b, shot, o = {}) => { const [s0, s1] = SH[shot]; const from = o.from ?? s0, to = o.to ?? Math.min(s1, from + (b - a) * (o.speed ?? 1)); return { a, b, keys: o.keys || [[a, from], [b, to]], fx: o.fx ?? .5, fy: o.fy ?? .48, z: o.z ?? [1.08, 1], ...o }; };
const FX = { stage: { v: .5, d: .5 }, aerial: .52, arrival: { v: [.3, .55], d: .45 }, walk: { v: .47, d: .5 }, profile: { v: .38, d: .44 }, smoke: { v: [.56, .66], d: .55 } };

// ---- type + logo helpers ----
const SL = (cx, cy, w, o = {}) => drawImg(ctx, IMG.sponsor, cx, cy, w, o);                       // this sponsor's logo
const slH = w => w * IMG.sponsor.height / IMG.sponsor.width;
const slW = (maxW, maxH) => Math.min(maxW, maxH * IMG.sponsor.width / IMG.sponsor.height);      // fit logo in a box
const wzH = w => w * IMG.wizkid.height / IMG.wizkid.width, lolH = w => w * IMG.lol.height / IMG.lol.width;
const fitW = (str, frac, o, cap) => Math.min(fitSize(ctx, str, L.sw * frac, o), cap);
function maskUp(x, y, w, h, p, fn) { if (p <= 0) return; ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.translate(0, (1 - E.outQuart(p)) * h); fn(); ctx.restore(); }
// event-information beats over the footage (style per sponsor): k = 'lol' | 'wizkid' | 'date' | 'venue'
function beat(t, b) {
  const p = prog(t, b.a, b.a + (b.d || .5)), out = 1 - prog(t, b.b - .25, b.b);
  if (p <= 0 || out <= 0) return;
  const S = SP.type; const st = b.style || S.reveal;
  const x = b.x ?? L.cx, y = typeof b.y === 'function' ? b.y() : (b.y ?? L.cy);
  ctx.save(); ctx.globalAlpha *= out;
  const ep = st === 'pop' ? clamp(E.outBack(p, 1.8), 0, 1.15) : E.outCubic(p);
  const draw = (dy = 0, sc = 1) => {
    ctx.save(); ctx.translate(x, y + dy); ctx.scale(sc, sc);
    if (b.k === 'lol') lolLogo(ctx, 0, 0, b.w || L.sw * (L.vert ? .62 : .42));
    if (b.k === 'wizkid') drawImg(ctx, IMG.wizkid, 0, 0, b.w || L.sw * (L.vert ? .9 : .66));
    if (b.k === 'date') text(ctx, BRAND.event.dateLong, 0, 0, { fam: 'Anton', size: b.size || fitW(BRAND.event.dateLong, L.vert ? .86 : .62, { fam: 'Anton' }, U(140)), track: .02, color: b.color || S.date, shadow: ['rgba(0,0,0,.45)', U(24)] });
    if (b.k === 'venue') text(ctx, BRAND.event.venue, 0, 0, { fam: 'Oswald', w: 700, size: b.size || fitW(BRAND.event.venue, L.vert ? .86 : .6, { fam: 'Oswald', w: 700, track: .24 }, U(64)), track: .24, color: b.color || S.venue, shadow: ['rgba(0,0,0,.5)', U(20)] });
    ctx.restore();
  };
  if (st === 'mask') { const hh = b.k === 'lol' ? U(500) : b.k === 'wizkid' ? U(260) : U(170); maskUp(-W, y - hh * .62, W * 3, hh, p, () => draw()); }
  else if (st === 'pop') { ctx.globalAlpha *= clamp(p * 3); draw(0, ep); }
  else if (st === 'slide') { ctx.globalAlpha *= ep; ctx.translate((1 - ep) * U(b.dir ?? 120), 0); draw(); }
  else if (st === 'track') { ctx.globalAlpha *= ep; ctx.filter = `blur(${(1 - ep) * U(10)}px)`; draw(0, mix(1.08, 1, ep)); }
  else { ctx.globalAlpha *= ep; draw((1 - ep) * U(28)); }
  ctx.restore();
}
// sponsor logo bug held through the festival section
function bug(t) {
  const p = E.outCubic(prog(t, T1 + .2, T1 + .7)) * (1 - E.inCubic(prog(t, T2 - .3, T2)));
  if (p <= 0 || SP.noBug) return;
  const w = slW(U(L.vert ? 250 : 210), U(L.vert ? 110 : 90)); const h = slH(w);
  ctx.save(); ctx.globalAlpha = p * .95; ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = U(18);
  SL(L.x0 + w / 2, L.y0 + h / 2, w); ctx.restore();
}

// ---- co-branded lock-up (00:10-00:15) ----
// sponsor logo leads; divider; festival logo; WIZKID; DECEMBER 13, 2026; EAGLE SQUARE, ABUJA
let LKS;
function lockLayout() {
  const pair = L.sq || SP.lock.pair;   // square: sponsor + festival logo side by side
  let k = 1;
  for (let it = 0; it < 8; it++) {
    const wideLogo = IMG.sponsor.width / IMG.sponsor.height > 4.5;
    const sW = slW(L.sw * (pair ? (wideLogo ? .56 : .46) : L.vert ? (wideLogo ? .86 : .7) : (wideLogo ? .7 : .52)) * k, U(pair ? 280 : L.vert ? 290 : 220) * k * (SP.lock.logoK || 1)), sH = slH(sW);
    const lW = (pair ? L.sw * .27 : L.vert ? L.sw * .5 : L.sw * .34) * k, lH = lolH(lW);
    const wW = L.sw * (L.vert ? .8 : pair ? .5 : .58) * k, wH = wzH(wW);
    const ds = U(L.vert ? 96 : 76) * k, vs = U(L.vert ? 40 : 34) * k, gap = U(L.vert ? 48 : 30) * k;
    const blocks = pair ? [Math.max(sH, lH), wH, ds * .9 + vs * 1.7] : [sH, U(10), lH, wH, ds * .9 + vs * 1.7];
    const total = blocks.reduce((a, b) => a + b, 0) + gap * (blocks.length - 1);
    if (total <= L.sh * .95 || it === 7) { let y = L.y0 + (L.sh - total) / 2; const ys = blocks.map(h => { const c = y; y += h + gap; return c; }); return LKS = { pair, sW, sH, lW, lH, wW, wH, ds, vs, gap, ys, rowH: blocks[0] }; }
    k *= L.sh * .95 / total;
  }
}
function lockup(lt) {
  const c = LKS, st = SP.lock, ty = { ...SP.type, ...(SP.lock.colors || {}) };
  const ap = (i, d = .55) => (st.ease || E.outCubic)(prog(lt, (st.t0 ?? .1) + i * (st.step ?? .13), (st.t0 ?? .1) + i * (st.step ?? .13) + d));
  const rise = p => (1 - p) * U(st.rise ?? 26);
  const reveal = (i, cy, h, fn) => { const p = ap(i); if (p <= 0) return; if (st.reveal === 'mask') maskUp(-W, cy - h / 2 - U(6), W * 3, h + U(12), clamp(p), fn); else { ctx.save(); ctx.globalAlpha *= clamp(p); ctx.translate(0, rise(p)); fn(); ctx.restore(); } };
  if (c.pair) {
    const [y0, y1, y2] = c.ys; const rc = y0 + c.rowH / 2;
    const gx = U(st.pairGap ?? 46); const totalW = c.sW + gx * 2 + c.lW; const x0 = L.cx - totalW / 2;
    reveal(0, rc, c.rowH, () => SL(x0 + c.sW / 2, rc, c.sW));
    const dp = ap(1); if (st.divider !== 'none' && dp > 0) { ctx.save(); ctx.globalAlpha = dp; ctx.fillStyle = st.divColor || ty.venue; const dh = c.rowH * .8 * dp; ctx.fillRect(x0 + c.sW + gx - U(1), rc - dh / 2, U(2), dh); ctx.restore(); }
    reveal(1, rc, c.rowH, () => lolLogo(ctx, x0 + c.sW + gx * 2 + c.lW / 2, rc, c.lW));
    reveal(2, y1 + c.wH / 2, c.wH, () => drawImg(ctx, IMG.wizkid, L.cx, y1 + c.wH / 2, c.wW));
    if (st.sweep) sweepImg(ctx, IMG.wizkid, L.cx, y1 + c.wH / 2, c.wW, prog(lt, st.sweep, st.sweep + 1.1), st.sweepCol);
    reveal(3, y2 + c.ds * .45, c.ds, () => text(ctx, BRAND.event.dateLong, L.cx, y2 + c.ds * .86, { fam: 'Anton', size: c.ds, track: .02, color: ty.date }));
    reveal(4, y2 + c.ds + c.vs, c.vs * 1.4, () => text(ctx, BRAND.event.venue, L.cx, y2 + c.ds * .86 + c.vs * 1.55, { fam: 'Oswald', w: 700, size: c.vs, track: .3, color: ty.venue }));
  } else {
    const [y0, yd, y1, y2, y3] = c.ys;
    reveal(0, y0 + c.sH / 2, c.sH, () => SL(L.cx, y0 + c.sH / 2, c.sW));
    const dp = ap(1); if (st.divider !== 'none' && dp > 0) { ctx.save(); ctx.globalAlpha = dp; ctx.fillStyle = st.divColor || ty.venue; const dw = L.sw * .34 * dp; ctx.fillRect(L.cx - dw / 2, yd + U(4), dw, U(2)); ctx.restore(); }
    reveal(2, y1 + c.lH / 2, c.lH, () => lolLogo(ctx, L.cx, y1 + c.lH / 2, c.lW));
    reveal(3, y2 + c.wH / 2, c.wH, () => drawImg(ctx, IMG.wizkid, L.cx, y2 + c.wH / 2, c.wW));
    if (st.sweep) sweepImg(ctx, IMG.wizkid, L.cx, y2 + c.wH / 2, c.wW, prog(lt, st.sweep, st.sweep + 1.1), st.sweepCol);
    reveal(4, y3 + c.ds * .45, c.ds, () => text(ctx, BRAND.event.dateLong, L.cx, y3 + c.ds * .86, { fam: 'Anton', size: c.ds, track: .02, color: ty.date }));
    reveal(5, y3 + c.ds + c.vs, c.vs * 1.4, () => text(ctx, BRAND.event.venue, L.cx, y3 + c.ds * .86 + c.vs * 1.55, { fam: 'Oswald', w: 700, size: c.vs, track: .3, color: ty.venue }));
  }
}
const radial = (c0, c1, cx = W / 2, cy = H * .45) => { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(W, H) * .62); g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
const lin = (stops, x0 = 0, y0 = 0, x1 = 0, y1 = H) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
// star polygon path (generic geometric star motif)
function starPath(g, cx, cy, r, n = 5, inner = .42, rot = -Math.PI / 2) { g.moveTo(cx + Math.cos(rot) * r, cy + Math.sin(rot) * r); for (let i = 1; i < n * 2; i++) { const rr = i % 2 ? r * inner : r; const a = rot + i * Math.PI / n; g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } g.closePath(); }
const plusPath = (g, cx, cy, r, th, rot = 0) => { const c = Math.cos(rot), s = Math.sin(rot); const pts = [[-th, -r], [th, -r], [th, -th], [r, -th], [r, th], [th, th], [th, r], [-th, r], [-th, th], [-r, th], [-r, -th], [-th, -th]]; pts.forEach(([x, y], i) => { const X = cx + x * c - y * s, Y = cy + x * s + y * c; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.closePath(); };

// =====================================================================================================
// THE 13 SPONSOR CONCEPTS
// each: logo, pal, grade, filter, type{date,venue,reveal}, intro(t), clips[], beats[], fx(t) (transitions/overlays in 4-10),
//       lock{...}, lockBg(lt), bpm, music, cues
// =====================================================================================================
const SPONSORS_CFG = {
  // 1 ── HENNESSY · Amber Pour ─────────────────────────────────────────────────────────────────────
  hennessy: { logo: '01-hennessy', name: 'Hennessy', bpm: 90, music: 'sp-lux',
    grade: [['soft-light', 'rgba(255,160,60,.38)'], ['multiply', 'rgba(30,18,8,.22)']], filter: 'contrast(1.08) saturate(1.05)',
    type: { date: '#F4E3C3', venue: '#D9A55B', reveal: 'track' },
    intro(t) {
      ctx.fillStyle = '#050403'; ctx.fillRect(0, 0, W, H);
      // a thin amber stream pours from the top of frame to the wordmark, then blooms into a warm pool of light
      const pour = E.inOutCubic(prog(t, .1, 1.0)), bloom = E.outCubic(prog(t, .85, 2.0)), thin = 1 - E.inCubic(prog(t, 1.1, 1.8));
      if (thin > 0) { const sg = ctx.createLinearGradient(0, 0, 0, L.cy); sg.addColorStop(0, 'rgba(255,190,90,0)'); sg.addColorStop(1, 'rgba(255,170,70,.95)');
        ctx.save(); ctx.globalAlpha = thin; ctx.fillStyle = sg; const sw = U(5) + Math.sin(t * 30) * U(.8); ctx.fillRect(L.cx - sw / 2, 0, sw, L.cy * pour); ctx.restore(); }
      if (bloom > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(L.cx, L.cy); ctx.scale(1, .22);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, L.sw * .9 * bloom); g.addColorStop(0, `rgba(255,180,80,${.7 * (1 - .5 * prog(t, 2, 3.4))})`); g.addColorStop(.5, 'rgba(200,110,30,.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(-W, -H * 5, W * 2, H * 10); ctx.restore(); }
      const w = slW(L.sw * (L.vert ? .8 : .6), U(240)); const p = E.inOutCubic(prog(t, 1.1, 2.3));
      ctx.save(); ctx.beginPath(); ctx.rect(L.cx - w / 2 * p - U(4), 0, w * p + U(8), H); ctx.clip(); SL(L.cx, L.cy, w); ctx.restore();
      sweepImg(ctx, IMG.sponsor, L.cx, L.cy, w, prog(t, 2.2, 3.3), 'rgba(255,214,150,.95)');
      if (t > 3.4) flash(ctx, L, Math.sin(prog(t, 3.4, 4.0) * Math.PI) * .38, '#ffb860');
    },
    clips: [() => clip(4, 6.6, 'profile', { from: 7.94, to: 9.2, fx: FX.profile, fy: .42, z: [1.12, 1.02] }),
            () => clip(6.6, 10, 'stage', { keys: [[6.6, .2], [7.6, 1.05], [10, 2.2, E.outQuad]], fx: .5, fy: { d: .44, v: .46 }, z: [1.0, 1.1] })],
    beats: [{ k: 'lol', a: 4.3, b: 6.5, y: () => L.y0 + L.sh * (L.vert ? .66 : .68) },
            { k: 'wizkid', a: 6.8, b: 8.4, y: () => L.y0 + L.sh * .2 },
            { k: 'date', a: 8.4, b: 10, y: () => L.y0 + L.sh * .2 }, { k: 'venue', a: 8.7, b: 10, y: () => L.y0 + L.sh * .2 + U(100) }],
    fx(t) { letterbox(ctx, L, L.vert ? .07 : .06); if (t > 6.45 && t < 6.85) flash(ctx, L, Math.sin(prog(t, 6.45, 6.85) * Math.PI) * .55, '#ffb860'); },
    lock: { divider: 'line', divColor: '#C9974F', reveal: 'fade', ease: E.outCubic, step: .16, sweep: 1.0, sweepCol: 'rgba(255,214,150,.9)', logoK: 1.1 },
    lockBg(lt) { ctx.fillStyle = '#060504'; ctx.fillRect(0, 0, W, H); radial('rgba(150,84,26,.32)', 'rgba(0,0,0,0)', W / 2, H * .35); ctx.save(); ctx.fillStyle = '#C9974F'; ctx.globalAlpha = .5 * E.outCubic(prog(lt, .2, 1)); ctx.fillRect(L.x0, L.y0 - U(20), L.sw, U(1.5)); ctx.fillRect(L.x0, L.y1 + U(20), L.sw, U(1.5)); ctx.restore(); },
    cues: [{ t: 0, k: 'swell', d: 1.5 }, { t: 1.2, k: 'chime' }, { t: 2.2, k: 'shimmer', g: .6 }, { t: 3.7, k: 'whoosh', g: .6 }, { t: 4, k: 'hit', g: .6 }, { t: 6.6, k: 'impact', g: .7 }, { t: 8.4, k: 'shimmer', g: .5 }, { t: 9.7, k: 'reverse', d: .3 }, { t: 10, k: 'boom' }, { t: 11, k: 'shimmer', g: .5 }] },

  // 2 ── HEINEKEN · Green Star ─────────────────────────────────────────────────────────────────────
  heineken: { logo: '02-heineken', name: 'Heineken', bpm: 118, music: 'sp-groove',
    grade: [['soft-light', 'rgba(0,140,70,.30)'], ['multiply', 'rgba(5,40,22,.18)']], filter: 'contrast(1.1) saturate(1.08) brightness(1.15)',
    type: { date: '#FFFFFF', venue: '#8FE0A8', reveal: 'pop' },
    intro(t) {
      radial('#0f7a42', '#03200f', W / 2, H * .45);
      // light rays turning slowly behind the mark
      ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(L.cx, L.cy); ctx.rotate(t * .25);
      for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.fillStyle = `rgba(160,255,190,${.05 * E.outCubic(prog(t, .3, 1.2))})`; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-U(70), -H); ctx.lineTo(U(70), -H); ctx.fill(); }
      ctx.restore();
      // star outline draws, then becomes the iris the logo appears in
      const p = E.inOutCubic(prog(t, .1, .9)); const R = U(L.vert ? 330 : 260) * mix(.4, 1, E.outBack(prog(t, .1, 1.1), 1.2));
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = U(5); ctx.setLineDash([R * 7.2 * p, R * 8]); ctx.beginPath(); starPath(ctx, L.cx, L.cy, R); ctx.globalAlpha = 1 - prog(t, 1.3, 1.8); ctx.stroke(); ctx.restore();
      const w = slW(L.sw * (L.vert ? .74 : .56), U(320)); const lp = E.outBack(prog(t, .9, 1.5), 1.6);
      SL(L.cx, L.cy, w, { alpha: clamp(lp), s: mix(.7, 1, clamp(lp)) });
      sweepImg(ctx, IMG.sponsor, L.cx, L.cy, w, prog(t, 1.8, 2.8));
    },

      for (let x = 0; x <= L.sw * p; x += U(8)) { const X = L.x0 + x, Y = L.cy + U(L.vert ? 330 : 250) + Math.sin(x / U(70)) * U(22); x ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } ctx.globalAlpha = 1 - prog(t, 2.2, 2.8); ctx.stroke(); ctx.restore();
      const w = slW(L.sw * (L.vert ? .9 : .7), U(L.vert ? 360 : 290)); SL(L.cx, L.cy, w, { alpha: E.outCubic(prog(t, 1.2, 1.9)), s: mix(.9, 1, E.outBack(prog(t, 1.2, 2.0), 1.4)) });
      if (t > 3.3) burst(L.cx, L.cy, Math.max(W, H) * 1.6 * E.inQuart(prog(t, 3.3, 4.0)), t * .3, 1);
    },
    clips: [() => clip(3.9, 6.0, 'stage', { from: .1, to: 1.5, fx: .5, fy: .45, z: [1.12, 1.0] }),
            () => clip(6.0, 8.0, 'profile', { from: 7.96, to: 9.2, fx: FX.profile, fy: .42, z: [1.1, 1.0] }),
            () => clip(8.0, 10, 'smoke', { from: 10.9, to: 12.15, fx: FX.smoke, z: [1.12, 1.0] })],
    beats: [{ k: 'lol', a: 4.3, b: 6.0, y: () => L.y0 + L.sh * .74 }, { k: 'wizkid', a: 6.4, b: 8.0, y: () => L.y0 + L.sh * .8 },
            { k: 'date', a: 8.4, b: 10, y: () => L.y0 + L.sh * .22 }, { k: 'venue', a: 8.65, b: 10, y: () => L.y0 + L.sh * .22 + U(100) }],
    fx(t) { for (const t0 of [6.0, 8.0]) if (t > t0 - .3 && t < t0 + .3) burst(L.cx, L.cy, Math.max(W, H) * 1.4 * Math.sin(prog(t, t0 - .3, t0 + .3) * Math.PI), t, .9); },
    lock: { divider: 'line', divColor: '#FC543C', reveal: 'fade', ease: (p) => clamp(E.outBack(p, 1.5), 0, 1.1), step: .11, logoK: 1.1 },
    lockBg(lt) { radial('#3a1236', '#0b030b', W / 2, H * .38); ctx.save(); ctx.globalAlpha = .14; burst(L.cx, LKS.ys[0] + LKS.sH / 2, Math.max(W, H) * .7, lt * .1, 1); ctx.restore(); },
    cues: [{ t: .05, k: 'impact', g: .6 }, { t: .5, k: 'whoosh', g: .5 }, { t: 1.2, k: 'chime' }, { t: 1.9, k: 'shimmer', g: .6 }, { t: 3.3, k: 'riser', d: .7 }, { t: 4, k: 'impact', g: .8 }, { t: 5.75, k: 'whoosh', g: .6 }, { t: 6.0, k: 'hit', g: .7 }, { t: 7.75, k: 'whoosh', g: .6 }, { t: 8.0, k: 'hit', g: .7 }, { t: 10, k: 'impact', g: .8 }] },
};

// ---- sponsor-specific devices ----
function waveMask(g, t, t0, t1) { const p = E.inOutCubic(prog(t, t0, t1)); const y = mix(H + U(120), -U(140), p); g.moveTo(0, H + 10); g.lineTo(0, y); for (let x = 0; x <= W; x += U(20)) g.lineTo(x, y + Math.sin(x / U(140) + t * 4) * U(40)); g.lineTo(W, H + 10); g.closePath(); }
function waveRed(t, t0, t1, thin) {
  const p = E.inOutCubic(prog(t, t0, t1)); if (p <= 0 || p >= 1) return;
  const y = mix(H + U(120), -U(140), p);
  ctx.save(); ctx.fillStyle = '#E41E2B'; ctx.beginPath(); ctx.moveTo(0, H + 10); ctx.lineTo(0, y); for (let x = 0; x <= W; x += U(20)) ctx.lineTo(x, y + Math.sin(x / U(140) + t * 4) * U(40)); ctx.lineTo(W, H + 10); ctx.closePath();
  if (!thin) { ctx.fill(); ctx.save(); ctx.clip(); for (let i = 0; i < 26; i++) { const bx = hash(i) * W, by = H - ((t - t0) * U(500) * (.6 + hash(i + 5)) + hash(i + 9) * H) % (H + U(100)); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = U(2); ctx.beginPath(); ctx.arc(bx, by, U(4 + hash(i + 3) * 10), 0, 7); ctx.stroke(); } ctx.restore(); }
  else { ctx.translate(0, U(30)); ctx.fill(); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = U(thin ? 10 : 14); ctx.beginPath(); for (let x = 0; x <= W; x += U(20)) { const yy = y + Math.sin(x / U(140) + t * 4) * U(40) + (thin ? 0 : U(22)); x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke();
  ctx.restore();
}
function frameRect() { const m = U(L.vert ? 90 : 70); return L.vert ? [m, H * .2, W - 2 * m, H * .56] : [L.x0 + U(20), L.y0 + U(10), L.sw - U(40), L.sh - U(20)]; }
function labelFrame([x, y, w, h], p, a) {
  if (p <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#F3E6D0'; const per = 2 * (w + h);
  ctx.lineWidth = U(4); ctx.setLineDash([per * p, per]); ctx.strokeRect(x, y, w, h);
  ctx.lineWidth = U(1.5); ctx.setLineDash([per * p, per]); ctx.strokeRect(x + U(14), y + U(14), w - U(28), h - U(28));
  ctx.setLineDash([]); ctx.fillStyle = '#E0453C'; const s = U(12) * p; for (const [cx, cy] of [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4); ctx.fillRect(-s / 2, -s / 2, s, s); ctx.restore(); }
  ctx.restore();
}
function doors(open, a) { // two panels with a warm seam; open 0 = closed
  if (open >= 1 || a <= 0) return; const half = W / 2 * (1 - open);
  ctx.save(); ctx.globalAlpha = a; const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#0b1730'); g.addColorStop(.5, '#13244a'); g.addColorStop(1, '#0b1730');
  ctx.fillStyle = g; ctx.fillRect(0, 0, half, H); ctx.fillRect(W - half, 0, half, H);
  ctx.fillStyle = 'rgba(216,184,120,.9)'; ctx.fillRect(half - U(2), 0, U(3), H); ctx.fillRect(W - half - U(1), 0, U(3), H);
  ctx.globalCompositeOperation = 'screen'; const lg = ctx.createLinearGradient(half - U(120), 0, W - half + U(120), 0); lg.addColorStop(0, 'rgba(255,210,140,0)'); lg.addColorStop(.5, `rgba(255,210,140,${.35 * (1 - open)})`); lg.addColorStop(1, 'rgba(255,210,140,0)'); ctx.fillStyle = lg; ctx.fillRect(half - U(120), 0, W - 2 * half + U(240), H);
  ctx.restore();
}
function weave(t, t0, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; const n = 14, gap = W / n; for (let i = 0; i < n * 2; i++) { const p = E.inOutCubic(prog(t, t0 + i * .03, t0 + .8 + i * .03)); const vert = i % 2; ctx.fillStyle = i % 4 < 2 ? 'rgba(60,180,84,.55)' : 'rgba(180,204,84,.45)'; const k = Math.floor(i / 2); if (vert) ctx.fillRect(k * gap + gap * .3, 0, U(3), H * p); else ctx.fillRect(0, (k / n) * H + H / n * .3, W * p, U(3)); } ctx.restore(); }
function stripesMask(g, p) { const n = 9, sw = W / n; for (let i = 0; i < n; i++) { const q = clamp(p * 1.6 - i * .07); const h = H * E.inOutCubic(q); if (i % 2) g.rect(i * sw, 0, sw + 1, h); else g.rect(i * sw, H - h, sw + 1, h); } }
function stripes(p, _) { ctx.save(); ctx.fillStyle = '#123a1e'; ctx.beginPath(); stripesMask(ctx, p); ctx.fill(); ctx.restore(); }
function blueprint(p, a) { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#8FA3B8'; ctx.lineWidth = U(1); const s = U(90); for (let x = (L.cx % s); x < W; x += s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H * p); ctx.stroke(); } for (let y = (L.cy % s); y < H; y += s) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W * p, y); ctx.stroke(); } ctx.restore(); }
function tilesMask(g, p) { const s = U(180); const nx = Math.ceil(W / s), ny = Math.ceil(H / s); for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) { const q = clamp(p * 2 - ((i + j) % 2) * .35 - (i + j) / (nx + ny) * .6); if (q <= 0) continue; const k = s * E.outCubic(q); g.rect(i * s + (s - k) / 2, j * s + (s - k) / 2, k + 1, k + 1); } }
function tiles(p, col) { ctx.save(); ctx.fillStyle = col; ctx.beginPath(); tilesMask(ctx, p); ctx.fill(); ctx.restore(); }
let _t = 0;
function panelRect(i, p) { const e = E.outCubic(p); const g = U(18); if (L.vert) { const h = (L.sh - 2 * g) / 3; return [L.x0 + (1 - e) * (i % 2 ? W : -W) * .3, L.y0 + i * (h + g), L.sw, h]; } const w = (L.sw - 2 * g) / 3; return [L.x0 + i * (w + g), L.y0 + (1 - e) * (i % 2 ? H : -H) * .3, w, L.sh]; }
function burst(cx, cy, r, rot, a) { if (r <= 0) return; const cols = ['#FCB424', '#FC543C', '#CC3C6C', '#FCD27A']; ctx.save(); ctx.globalAlpha *= a; ctx.translate(cx, cy); ctx.rotate(rot); for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.fillStyle = cols[i % 4]; ctx.beginPath(); ctx.moveTo(-r * .06, 0); ctx.lineTo(0, -r); ctx.lineTo(r * .06, 0); ctx.closePath(); ctx.fill(); } ctx.fillStyle = '#CC3C6C'; ctx.beginPath(); ctx.arc(0, 0, r * .06, 0, 7); ctx.fill(); ctx.restore(); }

const SID = Q.get('s') || 'hennessy';
const SP = SPONSORS_CFG[SID];
SP._clips = SP.clips.map(f => f());

async function renderAt(frame) {
  const t = frame / FPS; _t = t;
  window.__log = { texts: [], imgs: [] };
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t < T2) {
    // footage clips may begin under the intro's own transition (their masks open them)
    let introDone = t >= T1;
    if (!introDone) SP.intro(t);
    for (const c of SP._clips) { const a0 = c.a; if (t >= a0 && t < c.b) await drawClip(c, t); }
    if (t >= T1) { SP.fx?.(t); for (const b of SP.beats) beat(t, b); bug(t); vignette(ctx, L, .38); }
    else if (SP._clips.some(c => t >= c.a)) { SP.fx?.(t); }
  } else {
    SP.lockBg(t - T2); vignette(ctx, L, .35);
    lockup(t - T2);
    flash(ctx, L, (1 - prog(t, T2, T2 + .22)) * .6, SP.lock.light ? '#ffffff' : '#000');
    flash(ctx, L, E.inQuad(prog(t, 14.8, 15)) * .3, '#000');
  }
  grain(ctx, L, frame, .045);
}
window.cues = () => ({ bpm: SP.bpm, dur: DUR, cues: SP.cues, name: SP.music, sponsor: SID });
window.grab = async (frame) => { await renderAt(frame); return cv.toDataURL('image/jpeg', .93).slice(23); };
window.audit = async (frame) => { await renderAt(frame); return window.__log; };
window.meta = { FPS, DUR, END: DUR, W: L.W * L.dpr, H: L.H * L.dpr, sponsorLogo: SP.logo + '.png' };
window.ready = (async () => { await loadFonts(); await Promise.all([loadBrand(), loadFootageMeta()]); IMG.sponsor = IMG[SP.logo]; makeGrain(); lockLayout(); })();
if (!Q.has('render')) window.ready.then(() => { const ui = document.getElementById('ui'); let f = Number(Q.get('t') || 0) * FPS; const loop = async () => { await renderAt(Math.floor(f)); ui.textContent = SID + ' ' + (f / FPS).toFixed(2) + 's'; f = (f + 1) % (DUR * FPS); requestAnimationFrame(loop); }; loop(); });
</script></body></html>
