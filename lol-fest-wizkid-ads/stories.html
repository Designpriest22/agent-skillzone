<!doctype html>
<html><head><meta charset="utf-8"><title>LOL FEST x WIZKID story animations</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}#ui{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace}</style>
</head><body><canvas id="c"></canvas><div id="ui"></div>
<script src="lib.js"></script>
<script src="endcard.js"></script>
<script>
'use strict';
// Graphic-led story ads built only from the completed flyer: its WIZKID wordmark, festival logo (split into its own
// layers), portrait, aerial-crowd backdrop, typography and zigzag/chevron devices. No footage, no new copy.
// ?s=s1..s5  &f=reels (default: UI-safe for Stories, Reels and TikTok)
const Q = new URLSearchParams(location.search);
const L = layout(Q.get('f') || 'reels');
const FPS = 30;
const cv = document.getElementById('c'); cv.width = L.W * L.dpr; cv.height = L.H * L.dpr; cv.style.aspectRatio = `${L.W}/${L.H}`;
const ctx = cv.getContext('2d');
const U = n => n * L.u;
const W = L.W, H = L.H;
const A = (s, x, y, size, o = {}) => text(ctx, s, x, y, { fam: 'Anton', size, color: BRAND.white, ...o });
const wzH = w => w * IMG.wizkid.height / IMG.wizkid.width;
const fitW = (str, frac, o, cap) => Math.min(fitSize(ctx, str, L.sw * frac, o), cap);
// the flyer's "WIZKID / LIVE ABUJA" lock-up line
function liveAbuja(cx, y, s, a = 1, slide = 0) {
  text(ctx, 'LIVE', cx - U(16) - slide, y, { fam: 'Oswald', w: 200, size: s, track: .2, align: 'right', alpha: a });
  text(ctx, 'ABUJA', cx + U(16) + slide, y, { fam: 'Bebas', size: s * 1.04, align: 'left', alpha: a, color: BRAND.orange });
}

// flyer backdrop #1: charcoal with stadium-light bokeh arcs (rebuilt as vector so it can move)
let BOKEH;
function makeBokeh() {
  const c = document.createElement('canvas'); c.width = W * L.dpr; c.height = H * L.dpr; const x = c.getContext('2d'); x.scale(L.dpr, L.dpr);
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#202020'); g.addColorStop(.45, '#121212'); g.addColorStop(1, '#070707');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const r = rng(5);
  x.filter = `blur(${U(5)}px)`;
  for (const side of [-1, 1]) for (let i = 0; i < 26; i++) {
    const u = i / 25; const px = side < 0 ? mix(-W * .05, W * .32, u) : mix(W * 1.05, W * .68, u);
    const py = H * (.42 - .14 * Math.sin(u * Math.PI * .9)) + (r() - .5) * U(30);
    x.fillStyle = `rgba(255,255,255,${.18 + r() * .35})`; x.beginPath(); x.arc(px, py, U(4 + r() * 9) * (1.3 - u * .6), 0, 7); x.fill();
  }
  x.filter = `blur(${U(22)}px)`;
  for (let i = 0; i < 9; i++) { x.fillStyle = `rgba(255,255,255,${.04 + r() * .05})`; x.beginPath(); x.arc(r() * W, H * (.25 + r() * .4), U(40 + r() * 80), 0, 7); x.fill(); }
  BOKEH = c;
}
function bokehBg(t, z = 1, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H * .42); ctx.scale(z, z); ctx.translate(-W / 2, -H * .42); ctx.drawImage(BOKEH, 0, 0, W, H); ctx.restore(); }
// flyer backdrop #2: the aerial crowd photograph
function aerialBg(t, z = 1, a = 1, fy = .45) { ctx.save(); ctx.globalAlpha = a; drawCover(ctx, IMG.aerial, 0, 0, W, H, .5, fy, z); ctx.restore(); }
function sliced(n, y0, h, dx, fn) {
  for (let i = 0; i < n; i++) { ctx.save(); ctx.beginPath(); ctx.rect(-W, y0 + h * i / n, W * 3, h / n + 1); ctx.clip(); ctx.translate(dx(i), 0); fn(); ctx.restore(); }
}
const pill = (x, y, w, h, r) => c => { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };

// =========================== S1 · THE TYPOGRAPHIC EXPLOSION (15 s) ===========================
// the flyer's own type (LIVE / ABUJA / 13 DEC) multiplies into a kinetic wall, collapses into the festival logo,
// then WIZKID, the date and the venue are rebuilt one by one
const S1 = {
  dur: 15, name: 'typographic-explosion', bpm: 124,
  cues: [{ t: 0, k: 'tick' }, { t: .3, k: 'hit', g: .7 }, { t: .95, k: 'hit', g: .9 }, { t: 1.55, k: 'whoosh' }, { t: 3.4, k: 'riser', d: .9 },
    { t: 4.3, k: 'impact' }, { t: 5.5, k: 'whoosh', g: .5 }, { t: 6.0, k: 'hit', g: .8 }, { t: 7.6, k: 'hit', g: .8 }, { t: 7.9, k: 'hit', g: .8 }, { t: 8.2, k: 'boom' }, { t: 9.1, k: 'shimmer' }, { t: 9.75, k: 'whoosh', g: .7 }, { t: 10, k: 'impact', g: .8 }],
  draw(t) {
    ctx.fillStyle = BRAND.black; ctx.fillRect(0, 0, W, H);
    const cx = L.cx, cy = L.cy;
    // A: LIVE stretches open over an orange rule, ABUJA lands beneath it (flyer type, flyer colours)
    if (t < 1.75) {
      const ln = E.outCubic(prog(t, 0, .2));
      ctx.fillStyle = BRAND.orange; ctx.fillRect(cx - L.sw * .4 * ln, cy - U(10), L.sw * .8 * ln, U(4));
      const s = fitSize(ctx, 'LIVE', L.sw * .82, { fam: 'Oswald', w: 200, track: .08 });
      text(ctx, 'LIVE', cx, cy - U(40), { fam: 'Oswald', w: 200, size: s, track: .08, chars: i => { const p = E.outExpo(prog(t, .04 + i * .05, .45 + i * .05)); return { a: p > 0 ? 1 : 0, s: 1, sx: 1, ...{ s: p, sx: 1 } }; } });
      const p2 = prog(t, .95, 1.15);
      if (p2 > 0) text(ctx, 'ABUJA', cx, cy + U(250), { fam: 'Bebas', size: U(300) * mix(1.8, 1, E.outCubic(p2)), color: BRAND.orange, alpha: E.outQuad(p2), track: .04 });
    }
    // B: the type multiplies into a moving wall of alternating rows
    if (t >= 1.55 && t < 4.6) {
      const k = prog(t, 1.55, 4.6);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-.07 * E.inOutCubic(k)); const z = mix(1.0, 1.5, E.inCubic(k)); ctx.scale(z, z); ctx.translate(-cx, -cy);
      const rows = 11, rh = U(200);
      const STY = [
        { w: 'LIVE', o: { fam: 'Oswald', w: 200, size: U(190), track: .1, color: BRAND.white } },
        { w: 'ABUJA', o: { fam: 'Bebas', size: U(200), track: .04, color: null, stroke: [BRAND.orange, U(2.5)] } },
        { w: '13 DEC', o: { fam: 'Anton', size: U(180), color: null, stroke: [BRAND.cream, U(2.5)] } },
      ];
      for (let r = 0; r < rows; r++) {
        const d = Math.abs(r - 5); const ap = E.outCubic(prog(t, 1.55 + d * .07, 1.9 + d * .07)); if (ap <= 0) continue;
        const y = cy + (r - 5) * rh + rh * .36; const dir = r % 2 ? 1 : -1;
        const sp = U(260 + d * 40) * (1 + E.inExpo(prog(t, 3.9, 4.6)) * 8);
        const st = r === 5 ? { w: 'ABUJA', o: { fam: 'Bebas', size: U(200), track: .04, color: BRAND.orange } } : STY[(r + 3) % 3];
        const pw = measure(ctx, st.w, st.o) + U(90);
        const x = ((t * sp * dir) % pw) - pw * 2;
        ctx.save(); ctx.globalAlpha = ap * (r === 5 ? 1 : 1 - prog(t, 3.8, 4.3)); ctx.translate(0, (1 - ap) * U(40) * Math.sign(r - 5));
        for (let i = 0; i < 7; i++) text(ctx, st.w, x + i * pw, y, { ...st.o, align: 'left' });
        ctx.restore();
      }
      ctx.restore();
    }
    // C: the official festival logo resolves out of the type
    if (t >= 4.25) {
      const lt = t - 4.25; const mv = E.inOutCubic(prog(t, 5.5, 6.1));
      const w = mix(L.sw * .86, L.sw * .52, mv); const y = mix(cy - U(40), L.y0 + U(240), mv);
      lolLogo(ctx, cx, y, w, { chevL: { a: E.outCubic(prog(lt, .15, .5)), dx: -(1 - E.outCubic(prog(lt, .15, .6))) * .25 }, chevR: { a: E.outCubic(prog(lt, .15, .5)), dx: (1 - E.outCubic(prog(lt, .15, .6))) * .25 },
        word: { a: E.outQuad(prog(lt, 0, .2)), s: mix(1.35, 1, E.outExpo(prog(lt, 0, .6))) }, mf: { a: E.outCubic(prog(lt, .45, .8)) }, zig: { a: 1, reveal: E.outCubic(prog(lt, .5, .9)) } });
      sweepImg(ctx, IMG.lolWord, cx, y, w, prog(lt, .3, 1.2));
    }
    // D: WIZKID assembled from sliding bands + LIVE ABUJA
    if (t >= 6.0) {
      const w = L.sw * .96; const h = wzH(w); const y = L.y0 + U(560);
      const p = prog(t, 6.0, 6.9);
      ctx.save(); ctx.translate(cx, y);
      sliced(7, -h / 2, h, i => (i % 2 ? 1 : -1) * W * 1.1 * (1 - E.outQuint(clamp(p * 1.4 - i * .06))), () => drawImg(ctx, IMG.wizkid, 0, 0, w));
      ctx.restore();
      sweepImg(ctx, IMG.wizkid, cx, y, w, prog(t, 7.0, 7.9));
      const q = E.outCubic(prog(t, 6.9, 7.4));
      liveAbuja(cx, y + h / 2 + U(106), U(92), q, (1 - q) * U(200));
    }
    // E: DECEMBER 13, 2026 drops in letter by letter, then the venue types on beneath it
    if (t >= 7.55) {
      const y = L.y0 + U(1010); const s = fitW(BRAND.event.dateLong, .9, { fam: 'Anton', track: .02 }, U(130));
      A(BRAND.event.dateLong, cx, y, s, { track: .02, chars: (i, n) => { const q = E.outExpo(prog(t, 7.6 + i * .035, 8.0 + i * .035)); return { a: clamp(q * 2), dy: (1 - q) * -U(160), s: mix(2.2, 1, q) }; } });
      const v = BRAND.event.venue; const n = Math.floor(prog(t, 8.4, 9.1) * v.length);
      const vs = U(46); const vw = measure(ctx, v, { fam: 'Oswald', w: 700, size: vs, track: .3 });
      if (n > 0) text(ctx, v.slice(0, n), cx - vw / 2, y + U(90), { fam: 'Oswald', w: 700, size: vs, track: .3, align: 'left', color: BRAND.tan });
      zigzag(ctx, cx - U(170), y + U(135), U(340), U(22), 6, { draw: E.outCubic(prog(t, 9.0, 9.4)), lw: U(9) });
    }
    if (t > 9.75) flash(ctx, L, E.inCubic(prog(t, 9.75, 10)), BRAND.black);
  },
  sponsor: { mode: 'rise', delay: .15, stagger: .05, dur: .55 },
};

// =========================== S2 · THE FESTIVAL COUNTDOWN (15 s) ===========================
// 4-3-2-1: each number hands over to one piece of the official information, then the full lock-up lands
const S2 = {
  dur: 15, name: 'festival-countdown', bpm: 120,
  get cues() { const c = []; for (let i = 0; i < 4; i++) { const t0 = .3 + i * 1.6; c.push({ t: t0, k: 'hit', g: .72 + i * .07 }, { t: t0 + .5, k: 'tick' }, { t: t0 + 1.0, k: 'tick' }); } c.push({ t: 6.3, k: 'riser', d: .6 }, { t: 6.9, k: 'impact' }, { t: 8.0, k: 'shimmer' }, { t: 9.75, k: 'whoosh', g: .7 }, { t: 10, k: 'impact', g: .8 }); return c; },
  draw(t) {
    bokehBg(t, 1 + t * .01);
    const cx = L.cx, cy = L.cy - U(150);
    for (let i = 0; i < 4; i++) {
      const t0 = .3 + i * 1.6; if (t < t0 || t >= t0 + 1.65) continue;
      const lt = t - t0; const num = String(4 - i);
      const inP = E.outBack(prog(lt, 0, .32), 1.4); const outP = E.inCubic(prog(lt, 1.38, 1.6));
      const R = U(320);
      ctx.save(); ctx.lineWidth = U(3); ctx.strokeStyle = 'rgba(234,215,183,.25)'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
      ctx.strokeStyle = BRAND.orange; ctx.lineWidth = U(9); ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * E.inOutQuad(prog(lt, .1, 1.5))); ctx.stroke(); ctx.restore();
      for (let k = 0; k < 60; k++) { const a = k / 60 * Math.PI * 2; const on = k / 60 < prog(lt, .1, 1.5); ctx.save(); ctx.globalAlpha = (on ? .9 : .25) * (1 - outP); ctx.strokeStyle = on ? BRAND.cream : '#777'; ctx.lineWidth = U(k % 5 ? 2 : 4); ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (R + U(22)), cy + Math.sin(a) * (R + U(22))); ctx.lineTo(cx + Math.cos(a) * (R + U(k % 5 ? 34 : 46)), cy + Math.sin(a) * (R + U(k % 5 ? 34 : 46))); ctx.stroke(); ctx.restore(); }
      const s = U(500);
      for (let g = 3; g >= 1; g--) A(num, cx + g * U(14) * inP, cy + s * .36 + g * U(14) * inP, s, { color: null, stroke: [g === 1 ? BRAND.orange : 'rgba(234,215,183,.35)', U(3)], alpha: clamp(inP) * (1 - outP) });
      ctx.save(); ctx.globalAlpha = clamp(inP);
      withClip(ctx, c => c.rect(0, 0, W, cy), () => { ctx.translate(0, -outP * U(260)); ctx.save(); ctx.translate(cx, cy); ctx.scale(clamp(inP, 0, 1.2), clamp(inP, 0, 1.2)); A(num, 0, s * .36, s); ctx.restore(); });
      withClip(ctx, c => c.rect(0, cy, W, H), () => { ctx.translate(0, outP * U(260)); ctx.save(); ctx.translate(cx, cy); ctx.scale(clamp(inP, 0, 1.2), clamp(inP, 0, 1.2)); A(num, 0, s * .36, s); ctx.restore(); });
      ctx.restore();
      // the information this number unlocks
      const fp = E.outCubic(prog(lt, .3, .7)) * (1 - outP); const fy = cy + R + U(150);
      if (fp <= 0) continue;
      ctx.save(); ctx.globalAlpha = fp; ctx.translate(0, (1 - fp) * U(30));
      if (i === 0) lolLogo(ctx, cx, fy + U(40), U(400));
      if (i === 1) { text(ctx, 'EAGLE SQUARE,', cx, fy + U(10), { fam: 'Oswald', w: 700, size: U(74), track: .2, color: BRAND.tan }); text(ctx, 'ABUJA', cx, fy + U(110), { fam: 'Oswald', w: 700, size: U(74), track: .2, color: BRAND.tan }); }
      if (i === 2) A(BRAND.event.dateLong, cx, fy + U(60), U(108), { track: .02 });
      if (i === 3) drawImg(ctx, IMG.wizkid, cx, fy + U(40), U(640));
      ctx.restore();
    }
    // reveal: the full event lock-up
    if (t >= 6.85) {
      flash(ctx, L, (1 - prog(t, 6.85, 7.15)) * .9, '#fff2e0');
      drawLockup(t - 6.85, { t0: .05, step: .12, ease: (p) => clamp(E.outBack(p, 1.6), 0, 1.1), rise: 34, sweep: .8 });
    }
    if (t > 9.75) flash(ctx, L, E.inCubic(prog(t, 9.75, 10)), BRAND.black);
  },
  sponsor: { mode: 'pop', delay: .12, stagger: .045, dur: .45 },
};

// =========================== S3 · THE VISUAL EXPERIENCE (15 s) ===========================
// a 2.5D camera travels through the flyer's information suspended in depth over its aerial crowd photograph
const S3 = {
  dur: 15, name: 'visual-experience', bpm: 100,
  cues: [{ t: 0, k: 'swell', d: 2.5 }, { t: 1.6, k: 'whoosh', g: .5 }, { t: 3.4, k: 'whoosh', g: .55 }, { t: 5.2, k: 'whoosh', g: .6 }, { t: 6.9, k: 'riser', d: 1.0 },
    { t: 7.9, k: 'impact' }, { t: 8.6, k: 'shimmer' }, { t: 9.75, k: 'whoosh', g: .7 }, { t: 10, k: 'impact', g: .8 }],
  draw(t) {
    const camZ = kf(t, [[0, 0], [1.6, 1.5, E.inOutCubic], [3.4, 3.4, E.inOutCubic], [5.2, 5.4, E.inOutCubic], [7.9, 8.6, E.inOutQuint], [10, 8.75, E.outCubic]]);
    const roll = Math.sin(t * .45) * .03;
    aerialBg(t, 1.05 + camZ * .045, 1, .48);
    const hz = ctx.createLinearGradient(0, 0, 0, H); hz.addColorStop(0, 'rgba(8,6,5,.7)'); hz.addColorStop(.45, 'rgba(8,6,5,.1)'); hz.addColorStop(1, 'rgba(8,6,5,.65)');
    ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 5; i++) {
      const a = Math.sin(t * .5 + i * 1.3) * .22 + (i - 2) * .16; const bx = W * (.15 + i * .18), by = H * 1.02;
      const g = ctx.createLinearGradient(bx, by, bx + Math.sin(a) * H, by - Math.cos(a) * H);
      g.addColorStop(0, i % 2 ? 'rgba(255,150,70,.20)' : 'rgba(255,235,210,.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(bx - U(10), by); ctx.lineTo(bx + Math.sin(a - .07) * H * 1.1, by - Math.cos(a - .07) * H * 1.1); ctx.lineTo(bx + Math.sin(a + .07) * H * 1.1, by - Math.cos(a + .07) * H * 1.1); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.save(); ctx.translate(L.cx, L.cy); ctx.rotate(roll); ctx.translate(-L.cx, -L.cy);
    const F = 1.6;
    const layers = [
      { z: 10.35, x: 0, y: -.04, draw: (s) => lolLogo(ctx, 0, 0, L.sw * .72 * s) },
      { z: 7.2, x: 0, y: -.02, draw: (s) => drawImg(ctx, IMG.wizkid, 0, 0, L.sw * .9 * s) },
      { z: 5.6, x: .02, y: .1, draw: (s) => A('13 DEC', 0, U(60) * s, U(300) * s) },
      { z: 3.9, x: -.02, y: -.06, draw: (s) => text(ctx, BRAND.event.dateLong, 0, U(40) * s, { fam: 'Oswald', w: 200, size: U(120) * s, track: .12, color: BRAND.white }) },
      { z: 2.1, x: .03, y: .12, draw: (s) => text(ctx, BRAND.event.venue, 0, 0, { fam: 'Oswald', w: 700, size: U(66) * s, track: .3, color: BRAND.tan }) },
    ];
    for (const ly of layers) {
      const d = ly.z - camZ; if (d <= .12) continue;
      const s = F / d; const a = clamp(1 - (s - 1.15) / 1.0) * E.inOutQuad(clamp((s - .42) / .38));
      if (a <= 0.01) continue;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(L.cx + ly.x * W * s, L.cy + ly.y * H * s * .6);
      if (s > 1.25) ctx.filter = `blur(${(s - 1.25) * U(14)}px)`;
      ly.draw(s); ctx.restore();
    }
    if (t > 8.2) {
      const lw = L.sw * .72 * (F / (10.35 - camZ)); const ly = L.cy - .04 * H * (F / (10.35 - camZ)) * .6;
      sweepImg(ctx, IMG.lolWord, L.cx, ly, lw, prog(t, 8.3, 9.3));
      const p1 = E.outCubic(prog(t, 8.4, 8.9)), p2 = E.outCubic(prog(t, 8.6, 9.1));
      const yb = ly + lw * IMG.lol.height / IMG.lol.width / 2 + U(110);
      A(BRAND.event.dateLong, L.cx, yb + (1 - p1) * U(20), U(84), { alpha: p1, track: .02 });
      text(ctx, BRAND.event.venue, L.cx, yb + U(70) + (1 - p2) * U(20), { fam: 'Oswald', w: 700, size: U(40), track: .3, color: BRAND.tan, alpha: p2 });
    }
    ctx.restore();
    if (t > 9.75) flash(ctx, L, E.inCubic(prog(t, 9.75, 10)), BRAND.black);
  },
  sponsor: { mode: 'rise', delay: .2, stagger: .06, dur: .7 },
};

// =========================== S4 · WIZKID TAKEOVER (10 s) ===========================
// the flyer, assembled layer by layer in its own stacking order
const S4 = {
  dur: 10, name: 'wizkid-takeover', bpm: 128,
  cues: [{ t: 0, k: 'reverse', d: .4 }, { t: .4, k: 'impact', g: .8 }, { t: .9, k: 'glitch' }, { t: 1.4, k: 'whoosh' }, { t: 1.7, k: 'boom' }, { t: 2.9, k: 'hit', g: .7 }, { t: 3.2, k: 'hit', g: .7 }, { t: 3.9, k: 'impact', g: .8 }, { t: 4.6, k: 'shimmer' }, { t: 4.75, k: 'whoosh', g: .7 }, { t: 5, k: 'impact', g: .8 }],
  draw(t) {
    bokehBg(t, 1.08 - t * .01, .9);
    const cx = L.cx;
    if (t < 1.75) {
      const w = (L.H - U(80)) * .78; const h = wzH(w);
      const out = E.inExpo(prog(t, 1.35, 1.75));
      ctx.save(); ctx.translate(cx - out * W * 1.3, L.H / 2); ctx.rotate(-Math.PI / 2);
      const rev = E.outCubic(prog(t, .05, .6));
      withClip(ctx, c => c.rect(-w / 2, -h / 2, w * rev, h), () => {
        const tear = (1 - prog(t, .85, 1.15)) * (t > .85 ? 1 : 0);   // one short tear on the hit, then clean
        sliced(9, -h / 2, h, i => tear * Math.sin(i * 12.9 + Math.floor(t * 24) * 7.1) * U(70), () => drawImg(ctx, IMG.wizkid, 0, 0, w));
      });
      ctx.restore();
      ctx.save(); ctx.translate(cx - out * W * 1.3, L.H / 2); ctx.rotate(-Math.PI / 2); sweepImg(ctx, IMG.wizkid, 0, 0, w, prog(t, .1, .8), 'rgba(255,255,255,.95)', .1); ctx.restore();
      flash(ctx, L, t > .4 ? (1 - prog(t, .4, .6)) * .7 : 0);
    }
    if (t >= 1.6) {
      const lt = t - 1.6;
      const ww = L.sw * 1.0, wh = wzH(ww), wy = L.y0 + wh / 2 + U(10);
      const wp = E.outExpo(prog(lt, 0, .45));
      drawImg(ctx, IMG.wizkid, cx, wy, ww, { s: mix(1.5, 1, wp), alpha: clamp(wp * 2) });
      const pw = L.sw * 1.08, ph = pw * IMG.cutout.height / IMG.cutout.width; const py = L.y0 + U(170) + ph / 2;
      const pp = E.outCubic(prog(lt, .15, 1.3));
      ctx.save(); ctx.globalAlpha = pp; ctx.filter = `brightness(${mix(.2, 1.05, pp)})`;
      drawImg(ctx, IMG.cutout, cx, py + (1 - pp) * U(80), pw * mix(1.06, 1, pp)); ctx.restore();
      const g = ctx.createLinearGradient(0, L.H * .62, 0, L.H * .9); g.addColorStop(0, 'rgba(10,10,10,0)'); g.addColorStop(1, 'rgba(10,10,10,1)'); ctx.fillStyle = g; ctx.fillRect(0, L.H * .62, W, L.H * .4);
      sweepImg(ctx, IMG.wizkid, cx, wy, ww, prog(lt, 2.4, 3.3), 'rgba(255,225,180,.9)');
      const q1 = E.outQuart(prog(lt, 1.3, 1.75)), q2 = E.outQuart(prog(lt, 1.6, 2.05));
      const ly = wy + wh / 2 + U(260);
      text(ctx, 'LIVE', L.x0 + U(10) - (1 - q1) * U(400), ly, { fam: 'Oswald', w: 200, size: U(200), track: .02, align: 'left', alpha: q1 });
      text(ctx, 'ABUJA', L.x0 + U(10) - (1 - q1) * U(400), ly + U(110), { fam: 'Bebas', size: U(120), align: 'left', alpha: q1, color: BRAND.orange });
      A('13', L.x1 - U(10) + (1 - q2) * U(400), ly - U(20), U(200), { align: 'right', alpha: q2 });
      A('DEC', L.x1 - U(10) + (1 - q2) * U(400), ly + U(200), U(200), { align: 'right', alpha: q2 });
      const lp = clamp(E.outBack(prog(lt, 2.2, 2.6), 2), 0, 1.15);
      const lgY = L.y1 - U(300);
      lolLogo(ctx, cx, lgY, L.sw * .5 * lp, { word: { a: clamp(lp) }, chev: { a: clamp(lp) }, mf: { a: clamp(lp) }, zig: { a: 1, reveal: E.outCubic(prog(lt, 2.5, 2.9)) } });
      const vp = E.outCubic(prog(lt, 2.7, 3.1));
      text(ctx, BRAND.event.venue, cx, lgY + L.sw * .5 * IMG.lol.height / IMG.lol.width / 2 + U(70), { fam: 'Oswald', w: 700, size: U(44), track: .3, color: BRAND.tan, alpha: vp });
      flash(ctx, L, lt > 2.3 ? (1 - prog(lt, 2.3, 2.5)) * .45 : 0, '#ffe8cf');
    }
    if (t > 4.75) flash(ctx, L, E.inCubic(prog(t, 4.75, 5)), BRAND.black);
  },
  sponsor: { mode: 'wipe', delay: .1, stagger: .04, dur: .45 },
};

// =========================== S5 · THE ULTIMATE FESTIVAL ANNOUNCEMENT (15 s) ===========================
// the festival logo assembles from its chevrons, hands the stage to WIZKID, then the flyer's information
// is laid out piece by piece into a final poster over the aerial crowd
const S5 = {
  dur: 15, name: 'ultimate-announcement', bpm: 92,
  cues: [{ t: 0, k: 'swell', d: 1.6 }, { t: 1.2, k: 'chime' }, { t: 2.3, k: 'whoosh', g: .6 }, { t: 2.6, k: 'impact' }, { t: 2.65, k: 'boom' }, { t: 3.6, k: 'whoosh' }, { t: 4.1, k: 'hit', g: .8 },
    { t: 5.4, k: 'whoosh', g: .6 }, { t: 5.6, k: 'sub' }, { t: 7.3, k: 'chime' }, { t: 9.75, k: 'whoosh', g: .7 }, { t: 10, k: 'impact', g: .8 }],
  draw(t) {
    ctx.fillStyle = BRAND.black; ctx.fillRect(0, 0, W, H);
    const cx = L.cx, cy = L.cy;
    const ab = E.inOutCubic(prog(t, 5.4, 6.6));
    if (ab > 0) { aerialBg(t, 1.2 - ab * .1, ab); ctx.fillStyle = 'rgba(6,5,4,.58)'; ctx.fillRect(0, 0, W, H); }
    // festival logo: chevrons travel in from the frame edges, the wordmark rises between them
    const mv = E.inOutCubic(prog(t, 2.3, 2.95));
    const lw = mix(L.sw * .86, L.sw * .36, mv), ly = mix(cy - U(40), L.y0 + U(885), mv);
    const ci = E.outQuart(prog(t, 0, .9));
    lolLogo(ctx, cx, ly, lw, { chevL: { a: clamp(ci * 3), dx: -(1 - ci) * .55 }, chevR: { a: clamp(ci * 3), dx: (1 - ci) * .55 },
      word: { a: 1, reveal: E.outQuart(prog(t, .35, 1.2)) }, mf: { a: E.outCubic(prog(t, 1.1, 1.5)) }, zig: { a: 1, reveal: E.outCubic(prog(t, 1.5, 2.0)) } });
    sweepImg(ctx, IMG.lolWord, cx, ly, lw, prog(t, 1.6, 2.5), 'rgba(255,214,150,.9)');
    if (t > 6.2) sweepImg(ctx, IMG.lolWord, cx, ly, lw, prog(t, 6.3, 7.3));
    flash(ctx, L, t > 2.6 ? (1 - prog(t, 2.6, 2.95)) * .75 : 0, '#fff0dc');
    // WIZKID
    if (t > 2.6) {
      const w = L.sw * .8, h = wzH(w); const y = L.y0 + U(60) + h / 2;
      const p = E.outExpo(prog(t, 2.6, 3.4));
      drawImg(ctx, IMG.wizkid, cx, y, w, { s: mix(.88, 1, p), alpha: clamp(p * 1.4) });
      sweepImg(ctx, IMG.wizkid, cx, y, w, prog(t, 3.0, 4.0), 'rgba(255,214,150,.95)');
      const q = E.outCubic(prog(t, 3.5, 4.0)); liveAbuja(cx, y + h / 2 + U(115), U(96), q);
    }
    // zigzag rule + information grid: 13 DEC | EAGLE SQUARE, ABUJA
    if (t > 3.6) {
      const zy = L.y0 + U(400);
      zigzag(ctx, L.x0, zy, L.sw, U(26), 14, { draw: E.inOutCubic(prog(t, 3.6, 4.2)), lw: U(10) });
      const p = E.outQuart(prog(t, 4.1, 4.6)), p2 = E.outQuart(prog(t, 4.35, 4.85));
      const gy = zy + U(235);
      const dW = measure(ctx, '13 DEC', { fam: 'Anton', size: U(210) });
      const gx = cx - (dW + U(60) + U(340)) / 2;
      withClip(ctx, c => c.rect(0, gy - U(200), W, U(230)), () => A('13 DEC', gx, gy + (1 - p) * U(220), U(210), { align: 'left' }));
      ctx.save(); ctx.globalAlpha = p; ctx.fillStyle = BRAND.orange; ctx.fillRect(gx + dW + U(28), gy - U(170) * p, U(5), U(170) * p); ctx.restore();
      text(ctx, 'EAGLE', gx + dW + U(60), gy - U(108), { fam: 'Oswald', w: 700, size: U(62), track: .18, align: 'left', color: BRAND.tan, alpha: p2 });
      text(ctx, 'SQUARE,', gx + dW + U(60), gy - U(40), { fam: 'Oswald', w: 700, size: U(62), track: .18, align: 'left', color: BRAND.tan, alpha: p2 });
      text(ctx, 'ABUJA', gx + dW + U(60), gy + U(20), { fam: 'Oswald', w: 700, size: U(62), track: .18, align: 'left', color: BRAND.tan, alpha: E.outQuart(prog(t, 4.5, 5.0)) });
      // full date + venue set as one line beneath the grid for clarity
      const fp = E.outCubic(prog(t, 5.0, 5.5));
      text(ctx, BRAND.event.dateLong, cx, gy + U(84), { fam: 'Oswald', w: 500, size: U(38), track: .3, color: BRAND.white, alpha: fp * .9 });
    }
    // the flyer's ticket line, in a glowing pill
    if (t > 7.3) {
      const p = E.outCubic(prog(t, 7.3, 7.8)); const by = L.y1 - U(64);
      const bw = U(720), bh = U(120); const pulse = .5 + .5 * Math.sin((t - 7.3) * 6);
      ctx.save(); ctx.globalAlpha = p; ctx.shadowColor = `rgba(230,83,26,${.6 + .3 * pulse})`; ctx.shadowBlur = U(30 + 20 * pulse);
      ctx.strokeStyle = BRAND.orange; ctx.lineWidth = U(4); ctx.beginPath(); pill(cx - bw / 2, by - bh / 2, bw, bh, bh / 2)(ctx); ctx.stroke(); ctx.restore();
      text(ctx, BRAND.event.ticketsLead, cx, by - bh / 2 - U(26), { fam: 'Montserrat', w: 400, size: U(28), track: .2, alpha: p });
      text(ctx, BRAND.event.url, cx, by + U(18), { fam: 'Montserrat', w: 700, size: U(52), track: .02, alpha: p });
    }
    if (t > 9.75) flash(ctx, L, E.inCubic(prog(t, 9.75, 10)), BRAND.black);
  },
  sponsor: { mode: 'rise', delay: .25, stagger: .06, dur: .7 },
};

const STORIES = { s1: S1, s2: S2, s3: S3, s4: S4, s5: S5 };
const S = STORIES[Q.get('s') || 's1'];
const DUR = S.dur, END = DUR - 5;

async function renderAt(frame) {
  const t = frame / FPS;
  window.__log = { texts: [], imgs: [] };
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  if (t < END) { S.draw(t); vignette(ctx, L, .35); grain(ctx, L, frame, .05); }
  else sponsorFrame(t - END, S.sponsor);          // final five seconds: sponsor logos ONLY
}
window.cues = () => ({ bpm: S.bpm, dur: DUR, cues: S.cues, name: S.name });
window.grab = async (frame) => { await renderAt(frame); return cv.toDataURL('image/jpeg', .93).slice(23); };
window.audit = async (frame) => { await renderAt(frame); return window.__log; };
window.meta = { FPS, DUR, END, W: L.W * L.dpr, H: L.H * L.dpr };
window.ready = (async () => {
  await loadFonts(); await loadBrand();
  IMG.aerial = await loadImg('assets/flyer/aerial-crowd.jpg'); IMG.cutout = await loadImg('assets/flyer/wizkid-cutout.png');
  makeGrain(); makeBokeh(); sponsorLayout(); lockupLayout();
})();
if (!Q.has('render')) window.ready.then(() => { const ui = document.getElementById('ui'); let f = Number(Q.get('t') || 0) * FPS; const loop = async () => { await renderAt(Math.floor(f)); ui.textContent = (f / FPS).toFixed(2) + 's'; f = (f + 1) % (DUR * FPS); requestAnimationFrame(loop); }; loop(); });
</script></body></html>
