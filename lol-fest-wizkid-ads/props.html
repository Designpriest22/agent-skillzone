// silhouette with keyline (die-cut follows the portrait + offset)
const CUT = .66;

  x.globalCompositeOperation = 'destination-in'; x.setTransform(g.getTransform()); x.fillStyle = '#000'; x.fillRect(cx - w, top - off * 2, w * 2, h * CUT + off * 2);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(c, 0, 0); g.restore(); return h; }
function keylined(g, cx, top, w, off) { const h = silhouette(g, cx, top, w, off, '#ffffff'); const im = IM.portrait; const [c, x] = offC(g, 1); x.setTransform(g.getTransform()); x.drawImage(im, cx - w / 2, top, w, h); x.globalCompositeOperation = 'destination-in'; x.fillStyle = '#000'; x.fillRect(cx - w, top - 10, w * 2, h * CUT + 10 - off); g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(c, 0, 0); g.restore(); if (window.__log) window.__log.imgs.push('wizkid-portrait-color.png'); }
const OFF = []; function offC(g, i = 0) { const W = g.canvas.width, H = g.canvas.height; if (!OFF[i] || OFF[i].width !== W || OFF[i].height !== H) { OFF[i] = document.createElement('canvas'); OFF[i].width = W; OFF[i].height = H; } const x = OFF[i].getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, W, H); return [OFF[i], x]; }

// draw a piece into a canvas at dpi
function renderArt(p, side, dpi, canvas) { const b = p.bleed, k = dpi / 25.4; canvas.width = Math.round((p.w + 2 * b) * k); canvas.height = Math.round((p.h + 2 * b) * k);

function dieOverlay(g, p) { const W = p.w, H = p.h, b = p.bleed; g.save(); g.lineWidth = .35;
  const dash = (col, d) => { g.strokeStyle = col; g.setLineDash(d); };
