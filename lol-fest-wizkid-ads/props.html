<!doctype html>
<html><head><meta charset="utf-8"><title>LOL FEST hand props and flags</title>

</head><body><canvas id="c"></canvas>
<script src="lib.js"></script>
<script>
'use strict';
// LOL FEST x WIZKID: crowd hand props and flags.
//   ?p=<id>&side=front|back&mode=art   print artwork at production size, drawn in millimetres (trim origin, bleed around)
//   ?p=<id>&mode=die                   the same artwork with trim / bleed / safe lines and dimension notes
//   ?p=<id>&mode=mock                  product mockup, 2400 x 1600
// Copy: approved festival information only (LIVE OUT LOUD MUSIC FESTIVAL, WIZKID, DECEMBER 13, 2026, EAGLE SQUARE, ABUJA, LIVE, ABUJA, 13 DEC).
const Q = new URLSearchParams(location.search);
const PID = Q.get('p') || 'fan', MODE = Q.get('mode') || 'art', SIDE = Q.get('side') || 'front';
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');
const IM = {};
const C = { maroon: '#5a0f1e', deep: '#2a0709', ink: '#140405', peach: '#FDB97A', white: '#FFF4EE', orange: '#F7791F', flame: '#E6531A', tan: '#C39C80', cream: '#F4E6D6', gold: '#F6C26B' };
// festival-only palette (props and flags): white / black / brown
const K = { white: '#F7F4EF', black: '#0E0C0B', brown: '#6B4226', dbrown: '#3A2416', lbrown: '#A9764C' };
// paper megaphone sector: apex x/y, inner and outer radius, half-angle (rolls to a 300 mm cone, 50 / 180 mm ends)
const MEG = [280, -80, 115, 415, .68];
function megPath(g, e) { const [ax, ay, R1, R2, A] = MEG, a0 = Math.PI / 2 - A - e / R2, a1 = Math.PI / 2 + A + e / R2; g.beginPath(); g.arc(ax, ay, R2 + e, a0, a1); g.arc(ax, ay, R1 - e, a1, a0, true); g.closePath(); }
function tabPath(g) { const [ax, ay, R1, R2, A] = MEG, a0 = Math.PI / 2 + A, Pt = (r, a) => [ax + Math.cos(a) * r, ay + Math.sin(a) * r]; g.beginPath(); [Pt(R1 + 6, a0), Pt(R2 - 6, a0), Pt(R2 - 16, a0 + 15 / R2), Pt(R1 + 16, a0 + 15 / R1)].forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
// draw only the content box of a full-size LOL logo layer (layers share the logo canvas)
const LAYER_BOX = { chevL: [0, 167, 118, 483], chevR: [947, 167, 1065, 483], lolZig: [158, 893, 907, 984] };
function layer(g, key, cx, cy, w) { const [x0, y0, x1, y1] = LAYER_BOX[key], im = IMG[key], sw = x1 - x0, sh = y1 - y0, h = w * sh / sw; g.drawImage(im, x0, y0, sw, sh, cx - w / 2, cy - h / 2, w, h); if (window.__log) window.__log.imgs.push('lol-logo-layer'); }
// keyline silhouette of any transparent image (logo die-cut)
function imgSil(g, img, cx, cy, w, off, col) { const h = w * img.height / img.width; const [c, x] = offC(g, 2); x.setTransform(g.getTransform()); for (let a = 0; a < 36; a++) { const th = a / 36 * Math.PI * 2; for (const f of [1, .5]) x.drawImage(img, cx - w / 2 + Math.cos(th) * off * f, cy - h / 2 + Math.sin(th) * off * f, w, h); }
  x.setTransform(1, 0, 0, 1, 0, 0); const d = x.getImageData(0, 0, c.width, c.height), a = d.data; const n = parseInt(col.slice(1), 16), cr = n >> 16, cg = (n >> 8) & 255, cb = n & 255; for (let i = 0; i < a.length; i += 4) { const on = a[i + 3] > 70; a[i] = cr; a[i + 1] = cg; a[i + 2] = cb; a[i + 3] = on ? 255 : 0; } x.putImageData(d, 0, 0); g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(c, 0, 0); g.restore(); }
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const capK = {}; function capOf(fam, w) { const k = fam + w; if (!capK[k]) { const c = document.createElement('canvas').getContext('2d'); setFont(c, fam, 100, w); capK[k] = c.measureText('H').actualBoundingBoxAscent / 100; } return capK[k]; }
// type set by cap height (mm); optional tracking to a target width
function T(g, str, x, base, cap, o = {}) { let size = cap / capOf(o.fam || 'Oswald', o.w ?? 200); let track = o.track || 0;
  if (o.width) { let nat = measure(g, str, { fam: o.fam || 'Oswald', w: o.w ?? 200, size }); if (nat > o.width) { size *= o.width / nat; nat = o.width; } track = Math.max(0, (o.width - nat) / ((str.length - 1) * size)); }
  text(g, str, x, base, { fam: o.fam || 'Oswald', w: o.w ?? 200, size, track, color: o.color || C.white, align: o.align || 'center', alpha: o.alpha ?? 1 }); return size; }
const LOL = (g, cx, cy, w) => lolLogo(g, cx, cy, w);
const lolH = w => w * IMG.lol.height / IMG.lol.width;
// the flyer's dry-brush field, scaled to the piece
function brush(g, x0, y0, w, h, seed, col, a = .5, n = 60) {
  const r = rng(seed), S = Math.max(w, h) / 1000; g.save(); g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = x0 + r() * w, y = y0 + r() * h, ang = [-1.05, 1.0, -.35, .5, -1.25][Math.floor(r() * 5)] + (r() - .5) * .3;
    const len = (220 + r() * 620) * S, wid = (34 + r() * 80) * S, br = 12 + Math.floor(r() * 8), dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
    for (let k = 0; k < br; k++) { const off = (k / (br - 1) - .5) * wid; g.strokeStyle = col; g.globalAlpha = a * (.35 + r() * .65); g.lineWidth = wid / br * (.7 + r() * 1.3);
      g.setLineDash([len * (.2 + r() * .6), len * r() * .08]); const sx = x + nx * off, sy = y + ny * off, l0 = len * r() * .15, l1 = len * (.75 + r() * .25), bend = (r() - .5) * 30 * S;
      g.beginPath(); g.moveTo(sx + dx * l0, sy + dy * l0); g.quadraticCurveTo(sx + dx * len * .5 + nx * bend, sy + dy * len * .5 + ny * bend, sx + dx * l1, sy + dy * l1); g.stroke(); }
  }
  g.setLineDash([]);
  for (let c = 0; c < 12; c++) { const cx = x0 + r() * w, cy = y0 + r() * h; for (let i = 0; i < 24; i++) { const d = Math.pow(r(), 2) * 120 * S, th = r() * 7; g.globalAlpha = a * (.4 + r() * .6); g.fillStyle = col; g.beginPath(); g.arc(cx + Math.cos(th) * d, cy + Math.sin(th) * d, (.8 + r() * 5) * S * (1 - d / (130 * S)), 0, 7); g.fill(); } }
  g.restore();
}
function field(g, x0, y0, w, h, seed, o = {}) { const gr = g.createRadialGradient(x0 + w / 2, y0 + h * .4, 0, x0 + w / 2, y0 + h * .4, Math.hypot(w, h) * .65); gr.addColorStop(0, o.c0 || '#6a1424'); gr.addColorStop(1, o.c1 || C.deep); g.fillStyle = gr; g.fillRect(x0, y0, w, h); brush(g, x0, y0, w, h, seed, o.stroke || '#1c0306', o.a ?? .5, o.n ?? 60); }
function zig(g, cx, y, w, amp, n, col = C.flame) { zigzag(g, cx - w / 2, y, w, amp, n, { color: col, lw: amp * .55 }); }
// repeated LOL zigzag pattern (bandana / backs)
function zigRows(g, x0, y0, w, h, gap, amp, col, a) { g.save(); g.globalAlpha = a; for (let y = y0 + gap / 2; y < y0 + h; y += gap) zigzag(g, x0 - gap, y, w + gap * 2, amp, Math.round((w + gap * 2) / (amp * 2.2)), { color: col, lw: amp * .45 }); g.restore(); }
function portraitImg(g, cx, top, w) { const im = IM.portrait, h = w * im.height / im.width; drawImg(g, im, cx, top + h / 2, w); return h; }

// ---------------- the pieces (mm) ----------------
// shape: rect | circle | swallow | band ; dpi: print resolution ; sides drawn by draw(g, side, W, H)
const P = {

      else { field(g, -3, -3, W + 6, H + 6, 23, { c0: '#E6531A', c1: '#9c2a0c', stroke: '#7a1d07', a: .45 });
        T(g, 'WIZKID', cx, 92, 42, { color: C.white, width: 150 }); T(g, '13 DEC', cx, 128, 22, { color: C.ink, w: 300 });
        T(g, 'LIVE', cx - 4, 160, 20, { color: C.white, align: 'right', w: 200 }); T(g, 'ABUJA', cx + 4, 160, 20, { color: C.ink, fam: 'Bebas', w: 400, align: 'left' });
        T(g, 'EAGLE SQUARE, ABUJA', cx, 176, 6, { color: C.white, w: 700, track: .26 }); } } },
  clapper: { name: 'Paper hand clapper', w: 270, h: 180, bleed: 3, dpi: 300, shape: 'rect', sides: ['front', 'back'], folds: [90, 180],
    spec: 'Three-panel folding paper clapper, 270 x 180 mm flat (90 mm panels), 250 gsm FSC card, 4/4 colour, accordion-folded at 90 and 180 mm.',
    draw(g, side, W, H) {

        LOL(g, 45, 82, 72); zig(g, 45, 140, 44, 5, 4);
        T(g, 'WIZKID', 135, 104, 46, { color: C.peach, width: 76 }); T(g, 'LIVE OUT LOUD MUSIC FESTIVAL', 135, 132, 3.2, { color: C.white, w: 700, fam: 'Montserrat', track: .05, width: 74 });
        T(g, '13 DEC', 225, 66, 22, { color: C.white, w: 300 }); T(g, 'LIVE', 225, 122, 40, { color: C.white }); T(g, 'ABUJA', 225, 150, 18, { color: C.orange, fam: 'Bebas', w: 400 }); }
      else { g.fillStyle = C.flame; g.fillRect(-3, -3, W + 6, H + 6); zigRows(g, -3, -3, W + 6, H + 6, 22, 6, '#9c2a0c', .55);
        for (const x of [45, 135, 225]) { g.fillStyle = C.deep; g.beginPath(); g.roundRect(x - 38, 60, 76, 60, 6); g.fill(); LOL(g, x, 90, 52); } } } },
  bandana: { name: 'Harmattan bandana', w: 550, h: 550, bleed: 5, dpi: 150, shape: 'rect', sides: ['front'],
    spec: '550 x 550 mm, 100% cotton voile, sublimation or screen print, hemmed edges. It works as a dust and face cover in the harmattan haze, a neck scarf or a wristband.',
    draw(g, side, W, H) { g.fillStyle = C.flame; g.fillRect(-5, -5, W + 10, H + 10);
      zigRows(g, -5, -5, W + 10, H + 10, 34, 8, '#b83a0e', .7);
      g.strokeStyle = C.deep; g.lineWidth = 26; g.strokeRect(13, 13, W - 26, H - 26); g.strokeStyle = C.white; g.lineWidth = 1.6; g.strokeRect(32, 32, W - 64, H - 64);
      // border text on all four sides
      for (let k = 0; k < 4; k++) { g.save(); g.translate(W / 2, H / 2); g.rotate(k * Math.PI / 2); for (const dx of [-140, 140]) T(g, 'LIVE OUT LOUD MUSIC FESTIVAL', dx, -H / 2 + 18, 6.5, { color: C.peach, w: 700, fam: 'Montserrat', track: .18 }); g.restore(); }
      // centre medallion
      g.fillStyle = C.deep; g.beginPath(); g.arc(W / 2, H / 2, 150, 0, 7); g.fill(); g.strokeStyle = C.peach; g.lineWidth = 2; g.beginPath(); g.arc(W / 2, H / 2, 140, 0, 7); g.stroke();
      LOL(g, W / 2, H / 2 - 8, 190); T(g, 'WIZKID', W / 2, H / 2 + 112, 22, { color: C.peach, width: 120 });
      // corners: date / city
      for (const [x, y, r] of [[80, 80, -Math.PI / 4], [W - 80, 80, Math.PI / 4], [W - 80, H - 80, 3 * Math.PI / 4], [80, H - 80, -3 * Math.PI / 4]]) { g.save(); g.translate(x, y); g.rotate(r); T(g, '13 DEC', 0, 8, 16, { color: C.white, w: 300 }); g.restore(); } } },
  bighead: { name: 'Wizkid big-head fan board', w: 300, h: 250, bleed: 0, dpi: 300, shape: 'cutout', sides: ['front', 'back'],
    spec: 'Die-cut fan board following the portrait silhouette with an 8 mm white keyline, 3 mm corrugated PP or 1.5 mm board, on a 400 mm paper-tube handle. The back shows the festival logo. The supplied portrait is 1080 px wide, so ask for the original high-resolution photo before print.',

  // ---- festival-only LOL props (no artist) : white / black / brown ----
  towel: { name: 'LOL rally towel', w: 400, h: 600, bleed: 5, dpi: 150, shape: 'rect', sides: ['front'],
    spec: '400 x 600 mm microfibre rally / sweat towel, full-colour sublimation one side, overlocked white edge. Swung overhead in the drops, then used against heat and dust.',
    draw(g, side, W, H) { g.fillStyle = K.black; g.fillRect(-5, -5, W + 10, H + 10); zigRows(g, -5, -5, W + 10, H + 10, 44, 9, K.brown, .55);
      g.fillStyle = K.black; g.fillRect(60, 80, W - 120, 330); LOL(g, W / 2, 245, 300);
      g.fillStyle = K.brown; g.fillRect(-5, 470, W + 10, 76); T(g, 'LIVE OUT LOUD MUSIC FESTIVAL', W / 2, 515, 10, { color: K.white, w: 700, fam: 'Montserrat', width: 320 });
      g.strokeStyle = K.white; g.lineWidth = 2; g.strokeRect(16, 16, W - 32, H - 32); } },
  hat: { name: 'LOL bucket hat', w: 700, h: 460, bleed: 0, dpi: 200, shape: 'sheet', sides: ['front'],
    spec: 'Cotton-twill bucket hat, 58 cm. Printed panels nested on one 700 x 460 mm sheet: 180 mm crown top (white), 560 x 75 mm side band (black, logo repeat) and a 320 mm brim ring (brown, white zigzag). Cut lines include 3 mm bleed and 10 mm seam allowance inside.',
    draw(g, side, W, H) { if (!window.NOBG) { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); }
      // crown
      g.fillStyle = K.white; g.beginPath(); g.arc(110, 150, 93, 0, 7); g.fill(); g.strokeStyle = K.brown; g.lineWidth = 2; g.beginPath(); g.arc(110, 150, 78, 0, 7); g.stroke(); LOL(g, 110, 150, 120);
      // brim ring

      g.strokeStyle = K.white; g.lineWidth = 4; g.lineJoin = 'round'; for (const r0 of [120, 140]) { g.beginPath(); for (let i = 0; i <= 96; i++) { const th = i / 96 * Math.PI * 2, r = r0 + (i % 2 ? 7 : -7); const X = 480 + Math.cos(th) * r, Y = 175 + Math.sin(th) * r; i ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.stroke(); } g.restore();
      // side band
      g.save(); g.beginPath(); g.rect(17, 357, 566, 81); g.clip(); g.fillStyle = K.black; g.fillRect(17, 357, 566, 81); for (let x = 60; x < 583; x += 120) LOL(g, x, 397, 62); zigzag(g, 17, 432, 566, 4, 60, { color: K.brown, lw: 2 }); g.restore(); },
    cuts(g) { g.beginPath(); g.arc(110, 150, 93, 0, 7); g.moveTo(643, 175); g.arc(480, 175, 163, 0, 7); g.moveTo(572, 175); g.arc(480, 175, 92, 0, 7); g.rect(17, 357, 566, 81); g.stroke(); } },
  megaphone: { name: 'LOL paper megaphone', w: 560, h: 340, bleed: 0, dpi: 300, shape: 'sheet', sides: ['front'],
    spec: 'Paper cheer megaphone for the LOUD in Live Out Loud. Die-cut 300 gsm card sector rolled into a 300 mm cone (50 mm mouthpiece, 180 mm bell), with a 15 mm glue tab. Ships flat; fans roll it on entry.',
    draw(g, side, W, H) { if (!window.NOBG) { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); } const [ax, ay, R1, R2, A] = MEG;
      g.save(); megPath(g, 3); g.clip(); g.fillStyle = K.brown; g.fillRect(0, 0, W, H); brush(g, 0, 0, W, H, 131, K.dbrown, .45, 30);
      g.fillStyle = K.black; g.beginPath(); g.arc(ax, ay, R2 + 3, 0, 7); g.arc(ax, ay, R2 - 34, 0, 7, true); g.fill('evenodd');
      g.strokeStyle = K.white; g.lineWidth = 3; g.beginPath(); g.arc(ax, ay, R2 - 44, 0, 7); g.stroke(); g.beginPath(); g.arc(ax, ay, R1 + 14, 0, 7); g.stroke();
      g.fillStyle = K.black; g.beginPath(); g.arc(ax, ay, R1 + 8, 0, 7); g.arc(ax, ay, R1 - 3, 0, 7, true); g.fill('evenodd');

      g.save(); g.fillStyle = K.white; tabPath(g); g.fill(); g.restore(); },

    draw(g, side, W, H) { const w = 400, cy = H / 2; if (side === 'front') { imgSil(g, IMG.lol, W / 2, cy, w, 14, K.white); imgSil(g, IMG.lol, W / 2, cy, w, 10, K.black); LOL(g, W / 2, cy, w); }
      else { imgSil(g, IMG.lol, W / 2, cy, w, 14, K.white); imgSil(g, IMG.lol, W / 2, cy, w, 10, K.brown); LOL(g, W / 2, cy, w); } } },
  tattoo: { name: 'LOL temporary tattoo sheet', w: 148, h: 210, bleed: 3, dpi: 300, shape: 'rect', sides: ['front'],

      box(14, 12, 120, 92); LOL(g, 74, 58, 92);
      for (let i = 0; i < 3; i++) { box(14 + i * 41, 112, 38, 36); LOL(g, 33 + i * 41, 130, 30); }
      box(14, 154, 56, 22); layer(g, 'chevL', 34, 165, 6); layer(g, 'chevR', 50, 165, 6);
      box(76, 154, 58, 22); layer(g, 'lolZig', 105, 165, 46);

      LOL(g, W / 2, 200, 250); zigzag(g, W / 2 - 70, 316, 140, 9, 6, { color: K.white, lw: 4 });

  // ---- flags: white / black / brown ----
  flag1: { name: 'Flag 01: LOL stick hand flag (white)', w: 450, h: 300, bleed: 10, dpi: 150, shape: 'rect', sides: ['front'], sleeve: 'left',

      g.strokeStyle = K.brown; g.lineWidth = 2; g.strokeRect(56, 16, W - 72, H - 32);

    draw(g, side, W, H) { g.fillStyle = K.black; g.fillRect(-10, -10, W + 20, H + 20);
      g.save(); g.translate(W * .62, H / 2); g.rotate(-.5); g.fillStyle = K.brown; g.fillRect(-60, -H, 120, H * 2); g.fillStyle = K.white; g.fillRect(70, -H, 10, H * 2); g.restore();
      brush(g, -10, -10, W + 20, H + 20, 167, '#1f1a17', .5, 30); LOL(g, 215, H / 2, 250); } },
  flag3: { name: 'Flag 03: LOL x WIZKID crowd flag (brown)', w: 1500, h: 900, bleed: 15, dpi: 100, shape: 'rect', sides: ['front'], sleeve: 'hem',
    spec: '1500 x 900 mm, 110 g knitted polyester, single-sided dye-sublimation, hemmed edges with 4 black corner hand loops and no pole. LOL FEST logo and WIZKID.',

    text(ctx, p.name.toUpperCase(), 80, MH - 70, { fam: 'Montserrat', w: 700, size: 34, track: .2, color: PID === 'wristband' || PID === 'shades' ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.6)', align: 'left' }); }
  else { const g = renderArt(p, SIDE, Number(Q.get('dpi') || p.dpi), cv); if (MODE === 'die') dieOverlay(g, p); }
  window.meta = { name: p.name, spec: p.spec, w: p.w, h: p.h, bleed: p.bleed, dpi: p.dpi, sides: p.sides, W: cv.width, H: cv.height };
}
window.PIECES = Object.fromEntries(Object.entries(P).map(([k, p]) => [k, { name: p.name, spec: p.spec, w: p.w, h: p.h, bleed: p.bleed, dpi: p.dpi, sides: p.sides }]));
