<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Iconiq Fest × Fola — velvet</title>
<style>
@font-face { font-family: Anton; src: url(assets/fonts/anton.woff2); }
@font-face { font-family: Arch; src: url(assets/fonts/archivo-black.woff2); }
@font-face { font-family: Marker; src: url(assets/fonts/marker.woff2); }
@font-face { font-family: Play; src: url(assets/fonts/playfair-black-italic.woff2); }
html { font-size: min(1vw, .75vh); }
:root { --velvet:#5E0B12; --red:#E3322B; --gold:#D9B25A; --cream:#F3EFE6; --ink:#141416; --blue:#1F4BFF; --lime:#C6F59B; }
html, body { margin: 0; background: #000; overflow: hidden; }
#r { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--ink); }
#stage { position: absolute; inset: -3%; }
#stage > .sc { position: absolute; inset: 3%; overflow: hidden; display: none; }
.a { position: absolute; }
.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.an { font-family: Anton, sans-serif; line-height: .9; white-space: nowrap; text-transform: uppercase; }
.ar { font-family: Arch, sans-serif; line-height: .95; white-space: nowrap; text-transform: uppercase; }
.pl { font-family: Play, serif; line-height: .9; white-space: nowrap; }
.pp { isolation: isolate; filter: drop-shadow(.5rem .6rem 0 rgba(0,0,0,.45)); padding: 1.6rem 2.4rem 1.2rem; }
.bgk { position: absolute; inset: 0; z-index: -1; background-image: url(assets/paper.png); background-blend-mode: multiply; background-size: 40rem; }
.tape { position: absolute; width: 20rem; height: 5.5rem; z-index: 3; }
.photo { filter: grayscale(1) contrast(1.5) brightness(1.05); }
.velvetbg { background: radial-gradient(ellipse at 50% 40%, #7a1119, #3a060b 75%); }
.ov { position: absolute; inset: 0; pointer-events: none; }
#paperOv { background: url(assets/paper.png); background-size: 60rem; mix-blend-mode: multiply; opacity: .38; }
#grain { inset: -512px; background: url(assets/grain.png); mix-blend-mode: overlay; opacity: .14; }
#vig { background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.5)); }
#flash { display: none; }
#tear { position: absolute; left: -5%; width: 110%; height: 125%; top: 0; display: none; z-index: 50; }
#tear > div { position: absolute; inset: 0; }
.pol { position: absolute; width: 40rem; height: 50rem; filter: drop-shadow(.7rem .9rem 0 rgba(0,0,0,.5)); }
.pol > .ph { position: absolute; inset: 0; overflow: hidden; background: var(--cream); }
.pol img.fill { inset: 1.6rem 1.6rem 6rem; width: calc(100% - 3.2rem); height: calc(100% - 7.6rem); }
svg { overflow: visible; }
/* 4:5 feed: the end card is compacted so every line stays inside the frame */
@media (min-aspect-ratio: 3/4) {
  #emark { top: 6vh !important; }
  #ecl { top: calc(6vh + 17rem) !important; }
  #epW { width: 46rem !important; height: 46rem !important; margin-left: -23rem !important; top: calc(6vh + 31rem) !important; }
  #einfo { top: calc(6vh + 74rem) !important; }
  #edate { top: calc(6vh + 70rem) !important; }
  #elogo { top: calc(6vh + 110rem) !important; }
}
</style></head>

</div>

<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, d) => cl((t - a) / d);
const eo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const ebk = (x, c = 1.9) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const step = (x, n) => Math.floor(x * n) / n;
const q = x => Math.floor(x * 12 + 1e-6) / 12;
const h = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const nz = (t, k) => { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return lerp(h(i + k * 57), h(i + 1 + k * 57), u) * 2 - 1; };
const boil = (t, k, a = .5) => (h(Math.floor(t * 6) + k * 31) * 2 - 1) * a;
const BT = .625;                                                  // 96 bpm: a beat; a bar is 2.5 s, the reel is ten bars

function tornPoly(seed, amp = 7, n = 36) {
  let s = seed * 1000; const r = () => h(s++);
  const pts = [], j = () => (r() * amp).toFixed(1) + 'px', m = n / 3;
  for (let i = 0; i <= n; i++) pts.push(`${(i / n * 100).toFixed(2)}% ${j()}`);
  for (let i = 1; i <= m; i++) pts.push(`calc(100% - ${j()}) ${(i / m * 100).toFixed(2)}%`);
  for (let i = n - 1; i >= 0; i--) pts.push(`${(i / n * 100).toFixed(2)}% calc(100% - ${j()})`);
  for (let i = m - 1; i >= 1; i--) pts.push(`${j()} ${(i / m * 100).toFixed(2)}%`);
  return `polygon(${pts.join(',')})`;
}
let seed = 101;
for (const el of document.querySelectorAll('.pp')) {
  const b = document.createElement('div'); b.className = 'bgk'; b.style.backgroundColor = el.dataset.c;
  b.style.clipPath = tornPoly(seed++, +(el.dataset.amp || 7)); el.prepend(b);
}
document.querySelectorAll('.pol .ph').forEach((p, i) => p.style.clipPath = tornPoly(150 + i, 9));
$('epC').style.clipPath = tornPoly(160, 11);
const sheet = (s, amp, n = 60) => { let k = s * 1000; const r = () => h(k++); const p = [];
  for (let i = 0; i <= n; i++) p.push(`${i / n * 100}% ${(r() * amp + (i % 7 === 3 ? amp * .8 : 0)).toFixed(1)}px`);
  for (let i = n; i >= 0; i--) p.push(`${i / n * 100}% calc(100% - ${(r() * amp + (i % 5 === 2 ? amp * .8 : 0)).toFixed(1)}px)`);
  return `polygon(${p.join(',')})`; };
$('tearW').style.clipPath = sheet(17, 46); $('tearC').style.clipPath = sheet(18, 30); $('tearC').style.inset = '14px 0';

const SC = [['s1', 0, 2.5], ['s2', 2.5, 5], ['s3', 5, 7.5], ['s4', 7.5, 10], ['s5', 10, 12.5], ['s6', 12.5, 15], ['s7', 15, 17.5], ['s8', 17.5, 20], ['s9', 20, 22.5], ['s10', 22.5, 25]];
const HITS = [[0, .6], [.625, .5], [2.5, 1], [3.125, .8], [5, .9], [5.625, .6], [6.25, 1], [7.5, .8], [8.125, .5], [8.75, .5], [9.375, 1.2], [10, 1], [10.625, .9], [11.25, .6],
  [12.5, 1], [13.125, .6], [13.75, .7], [15, .8], [16.25, 1.2], [17.5, .8], [19.375, .9], [20, 1], [22.5, 1.2], [23.1, .4]];
const FL = { 2.5: '#F3EFE6', 5: '#D9B25A', 12.5: '#141416', 16.25: '#ffffff', 20: '#E3322B' };
const TEARS = [[10, '#5E0B12'], [17.5, '#F3EFE6'], [22.5, '#E3322B']];

const frame = (dir, n, t) => `clips/v/${dir}/${String(Math.min(n, Math.floor(t * 30) + 1)).padStart(3, '0')}.jpg`;
const setSrc = (el, src) => { if (el.getAttribute('src') !== src) el.setAttribute('src', src); };
const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize);
const T = (el, s) => { (typeof el === 'string' ? $(el) : el).style.transform = s; };
const O = (el, o) => { (typeof el === 'string' ? $(el) : el).style.opacity = o; };
const draw = (path, x) => { const L = path.getTotalLength(); path.style.strokeDasharray = L; path.style.strokeDashoffset = L * (1 - x); };
const slap = (id, t, a, rot, k, base = '') => {
  const x = t - a; O(id, x >= 0 ? 1 : 0); if (x < 0) return;
  const f = Math.floor(x * 12); const s = f === 0 ? 1.07 : f === 1 ? .98 : 1;
  T(id, `${base} rotate(${rot + (f === 0 ? rot * 2.5 + 3 : 0) + boil(t, k, .4)}deg) scale(${s})`);
};
const foot = (id, dir, n, lt, z0 = 1.08, z1 = 1.0, dur = 2.5) => { setSrc($(id), frame(dir, n, lt)); T(id, `scale(${lerp(z0, z1, cl(lt / dur))})`); };

function renderAt(t) {
  const R = rem();
  for (const [id, a, b] of SC) $(id).style.display = t >= a && t < b ? 'block' : 'none';
  let k = 0; for (const [ht, s] of HITS) if (t >= ht) k += s * Math.exp(-(t - ht) * 8);
  const dx = nz(t * 1.1, 1) * 4 + nz(t * 22, 2) * k * 14, dy = nz(t * .9, 3) * 4 + nz(t * 22, 4) * k * 14, rot = nz(t * .7, 5) * .2 + nz(t * 18, 6) * k * .45;
  T('stage', `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${1 + k * .01})`);
  const F = Math.floor(t * 30);
  $('grain').style.transform = `translate(${Math.floor(h(F) * 512)}px,${Math.floor(h(F + 9) * 512)}px)`;
  setSrc($('grunge'), `assets/grunge${Math.floor(t * 8) % 3}.png`);
  $('paperOv').style.backgroundPosition = `${Math.floor(h(Math.floor(t * 4)) * 300)}px ${Math.floor(h(Math.floor(t * 4) + 3) * 300)}px`;
  const fk = Object.keys(FL).find(c => t >= +c && t < +c + 1 / 30 + 1e-6);
  $('flash').style.display = fk ? 'block' : 'none'; if (fk) $('flash').style.background = FL[fk];
  const tr = TEARS.find(([c]) => t >= c - .22 && t < c + .22);
