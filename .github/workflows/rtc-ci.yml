name: Run The Capital CI
on:
  push: { paths: ["rtc/**", ".github/workflows/rtc-ci.yml"] }
  pull_request: { paths: ["rtc/**"] }
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rtc } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rtc, POSTGRES_PASSWORD: rtc, POSTGRES_DB: rtc }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rtc" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://rtc:rtc@localhost:5432/rtc
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rtc/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          npx next start -p 3000 &
          npx wait-on -t 60000 http://localhost:3000/api/health
          npx tsx scripts/smoke.ts
