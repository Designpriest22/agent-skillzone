button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
body.render { padding: 0; background: #000; }
body.render .wrap { max-width: none; }
body.render .stagebox { width: 1080px; height: 1920px; border-radius: 0; }
body.render .transport, body.render .bigplay { display: none !important; }

<script>
(() => {
const DUR = 54.1;
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const win = (t, a, b) => t >= a && t < b;
// keyframe track: [[time reached, value, transition seconds?]]; values: number or {k: number | [numbers]}
function track(keys, dur = .3) {
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [ti, vi, d0] = keys[i];
      if (t < ti) {
        const vp = keys[i - 1][1], d = d0 ?? dur, start = Math.max(keys[i - 1][0], ti - d);
        if (t < start) return vp;
        const k = ease(clamp((t - start) / (ti - start || 1)));
        if (typeof vi === 'number') return lerp(vp, vi, k);
        const o = {}; for (const key in vi) o[key] = Array.isArray(vi[key]) ? vi[key].map((v, j) => lerp(vp[key][j], v, k)) : lerp(vp[key], vi[key], k); return o;
      }
    }
    return keys[keys.length - 1][1];
  };
}
const stepAt = keys => t => { let v = keys[0][1]; for (const [ti, vi] of keys) if (t >= ti) v = vi; return v; };
// visible ranges -> 0..1 with slide in/out
const ranges = (list, d = .3) => t => { let v = 0; for (const [a, b] of list) v = Math.max(v, clamp((t - a + d) / d) * clamp((b - t) / d)); return ease(v); };

/* ---------- 2-bone IK arms ---------- */
function buildArm(g, o) {
  const sh = el('g', {}, g), ink = o.ink, sw = 6;
  el('rect', { x: -o.w / 2, y: -6, width: o.w, height: o.L1 + 12, rx: o.w / 2, fill: o.long ? o.sleeve : o.skin, stroke: ink, 'stroke-width': sw }, sh);
  if (o.sleeve && !o.long) el('path', { d: `M${-o.w / 2 - 9} -14 h${o.w + 18} v${o.L1 * .45} h${-(o.w + 18)}z`, fill: o.sleeve, stroke: ink, 'stroke-width': sw, 'stroke-linejoin': 'round' }, sh);
  const elg = el('g', {}, sh);
  el('rect', { x: -o.w / 2 + 2, y: -8, width: o.w - 4, height: o.L2 + 8, rx: o.w / 2, fill: o.long ? o.sleeve : o.skin, stroke: ink, 'stroke-width': sw }, elg);
  const hand = el('g', { transform: `translate(0 ${o.L2})` }, elg);

  $('p-torso').setAttribute('transform', `rotate(${(pb + (laughing ? Math.sin(t * 9) * 3 : 0)).toFixed(2)})`);
  const pa = pinkArms(t), fan = win(t, 22.9, 26) || win(t, 40.8, 45) ? Math.sin(t * 11) * 34 : 0;

/* =================== PLAYER (audio clock is master) =================== */
let actx = null, buf = null, src = null, playing = false, startAt = 0, offset = 0, rafId = 0, clock0 = 0;
const now = () => playing ? (actx && buf ? actx.currentTime - startAt : (performance.now() - clock0) / 1000) : offset;
async function loadAudio() { if (actx) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); const r = await fetch('audio.mp3'); buf = await actx.decodeAudioData(await r.arrayBuffer()); } catch (e) { buf = null; } }
function startSource(at) { if (actx && buf) { src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination); startAt = actx.currentTime - at; src.start(0, at); } else clock0 = performance.now() - at * 1000; }
async function play() { await loadAudio(); if (actx && actx.state === 'suspended') await actx.resume(); playing = true; startSource(offset); $('play').textContent = 'Pause'; $('bigplay').hidden = true; loop(); }
function pause() { offset = now(); playing = false; if (src) { try { src.stop(); } catch (e) {} src = null; } $('play').textContent = 'Play'; cancelAnimationFrame(rafId); renderAt(offset); }
function seek(t) { const was = playing; if (playing) pause(); offset = clamp(t, 0, DUR - .01); renderAt(offset); if (was) play(); }
function loop() { let t = now(); if (t >= DUR) { if (src) { try { src.stop(); } catch (e) {} } offset = 0; startSource(0); t = 0; } renderAt(t); rafId = requestAnimationFrame(loop); }
$('play').onclick = () => playing ? pause() : play();
$('bigplay').onclick = () => play();
$('scrub').oninput = e => seek(+e.target.value);
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });

const params = new URLSearchParams(location.search);
if (params.has('render')) document.body.classList.add('render');
window.renderAt = renderAt; window.DURATION = DUR; window.ready = Promise.resolve();
renderAt(params.has('t') ? +params.get('t') : 2.5);
})();
