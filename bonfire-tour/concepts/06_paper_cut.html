<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.p{background:#ff5a1f}
.tile{position:absolute;overflow:hidden}
.tile img{position:absolute;width:1100px}
.big{left:30px;top:34px;font:400 250px/0.85 Anton;color:#141112;letter-spacing:-2px}
.side{right:40px;top:330px;width:300px;text-align:right;font:400 72px/0.92 Anton;color:#141112}
.side span{color:#f6efe4}
.box{right:40px;top:860px;width:330px;padding:24px 26px;background:#141112;color:#f6efe4;transform:rotate(-2deg)}
.box .c{font:400 76px/0.9 Anton} .box .d{font:600 24px Oswald;letter-spacing:.2em;margin-top:10px;color:#ff5a1f}
.sticker{position:absolute;background:#f6efe4;padding:10px;box-shadow:8px 10px 0 rgba(0,0,0,.35)}
.ft{left:30px;right:30px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font:600 18px Oswald;letter-spacing:.16em;color:#141112}
</style></head><body><div class="p">
<div class="a big">BONFIRE</div>
<div id="tiles"></div>
<div class="a side">THE<br><span>EXPERIENCE</span></div>
<div class="a box"><div class="c">ABUJA</div><div class="d">FRI · 4TH DEC</div><img src="../logos/victony_wordmark.png" style="width:210px;margin-top:14px"></div>
<div class="a" style="left:30px;top:1206px;font:600 15px Oswald;letter-spacing:.5em;color:#141112">CAPITAL BLOCK PARTY PRESENTS</div>
<div class="a ft"><span>TICKETS · WWW.OUTLAWVILLE.WORLD · MAINLANDBLOCKPARTY.COM</span><span style="display:flex;gap:16px;align-items:center"><img src="../logos/the_plug.png" style="height:30px;filter:brightness(0)"><img src="../logos/capital_block_party.png" style="height:40px;filter:brightness(.1)"><img src="../logos/outlawville.png" style="height:24px"></span></div>
<div class="grain" style="opacity:.16"></div></div>
<script>
// cut the portrait into a grid of tiles with gaps + jitter; pop the eyes tile out as a sticker
const IMG='assets/t6_bw.png',X0=-40,Y0=-140,S=1100/1334; // image placement
const cols=[0,250,500,720],rows=[290,560,820,1080,1200];let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
let h='';for(let i=0;i<rows.length-1;i++)for(let j=0;j<cols.length-1;j++){
 const x=cols[j]+8,y=rows[i]+8,w=cols[j+1]-cols[j]-16,hh=rows[i+1]-rows[i]-16,dx=(r()-.5)*18,dy=(r()-.5)*14,rot=(r()-.5)*2.4;
 h+='<div class="tile" style="left:'+(x+dx)+'px;top:'+(y+dy)+'px;width:'+w+'px;height:'+hh+'px;transform:rotate('+rot+'deg)"><img src="'+IMG+'" style="left:'+(X0-x)+'px;top:'+(Y0-y)+'px"></div>'}
// eyes sticker
const ex=150,ey=640,ew=470,eh=150;
h+='<div class="sticker" style="left:'+(ex-10)+'px;top:'+(ey-10)+'px;transform:rotate(-3deg)"><div class="tile" style="position:relative;width:'+ew+'px;height:'+eh+'px"><img src="'+IMG+'" style="left:'+(X0-ex-30)+'px;top:'+(Y0-ey-20)+'px;width:1160px"></div></div>';
document.getElementById('tiles').innerHTML=h;</script></body></html>
