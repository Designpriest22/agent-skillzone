<script>
"use strict";
/* FLATLINE — a 20s showreel for MEAT & GREET (Firstklaz Meating, Halloween BBQ Party).
   One blood-red line that never breaks. Camera language: the rotisserie — the flatline is the spit,
   the camera only ever turns on it, always the same way. Every frame is a pure function of t:
   window.seek(t) recomputes everything. 120 BPM, 40 beats, loops on the flatline. */
const GLYPHS = __GLYPHS__;
const LOGO_URI = "__LOGO__";

// ============================================================ math
const W = 1080, H = 1350, CX = 540, CY = 675, DUR = 20, FOCAL = 1300, D2R = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E10 = 1 - Math.pow(2, -10);

const expoIn = x => x <= 0 ? 0 : x >= 1 ? 1 : (Math.pow(2, 10 * x - 10) - Math.pow(2, -10)) / E10;
const lin = x => clamp(x);
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
// damped spring step response (zeta 0.92: settles without visible overshoot — no bounce)
function spring(s, w = 34, z = 0.92) { if (s <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + (z * w / wd) * Math.sin(wd * s)); }

function kf(t, keys) { // [[t, v, easeFn?], ...] easing applies to the segment ending at that key
  if (t <= keys[0][0]) return keys[0][1];

}
const decay = (t, t0, d = 0.15) => t < t0 ? 0 : Math.exp(-(t - t0) / d);
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function vn1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }

const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]];
// rotisserie projection: point on a card (canvas coords lx,ly) turned th degrees on the spit -> screen
function project(lx, ly, thDeg) {
  const v = CY - ly, u = lx - CX, th = thDeg * D2R, c = Math.cos(th), s = Math.sin(th);
  const vv = c < 0 ? -v : v; // back side content is drawn upright
  const y = vv * c, z = vv * s, k = FOCAL / (FOCAL + z);
  return [CX + u * k, CY - y * k, k];
}

// ============================================================ type (Archivo variable, outlines interpolated from 9 masters)
const AV = GLYPHS.avar.wght;
function nWght(wt) { let n = wt < 600 ? (wt - 600) / 500 : (wt - 600) / 300; n = clamp(n, -1, 1); for (let i = 0; i < AV.length - 1; i++) { const a = AV[i], b = AV[i + 1]; if (n >= a[0] && n <= b[0]) return a[1] + (b[1] - a[1]) * (n - a[0]) / (b[0] - a[0]); } return n; }
const nWdth = wd => clamp(wd < 100 ? (wd - 100) / 38 : (wd - 100) / 25, -1, 1);
function mwts(wd, wt) {
  const a = nWdth(wd), b = nWght(wt), i0 = a < 0 ? 0 : 1, j0 = b < 0 ? 0 : 1, fa = a < 0 ? a + 1 : a, fb = b < 0 ? b + 1 : b;
  return [[i0 * 3 + j0, (1 - fa) * (1 - fb)], [(i0 + 1) * 3 + j0, fa * (1 - fb)], [i0 * 3 + j0 + 1, (1 - fa) * fb], [(i0 + 1) * 3 + j0 + 1, fa * fb]];
}
const gcache = new Map();
function glyph(ch, wd, wt) {
  wd = Math.round(wd * 4) / 4; wt = Math.round(wt); const key = ch + '|' + wd + '|' + wt; let g = gcache.get(key); if (g) return g;
  const d = GLYPHS.chars[ch] || GLYPHS.chars[' ']; const n = d.m[0].length; const a = new Float32Array(n);
  for (const [mi, w] of mwts(wd, wt)) { if (!w) continue; const m = d.m[mi]; for (let i = 0; i < n; i++) a[i] += m[i] * w; }
  g = { adv: a[0], p: a, ops: d.ops }; gcache.set(key, g); return g;
}
function kernv(pair, wd, wt) { const k = GLYPHS.kern[pair]; if (!k) return 0; let s = 0; for (const [mi, w] of mwts(wd, wt)) s += k[mi] * w; return s; }
function shape(str, wd, wt, track = 0) { const gl = []; let x = 0; for (let i = 0; i < str.length; i++) { const ch = str[i]; if (i > 0) x += kernv(str[i - 1] + ch, wd, wt); const g = glyph(ch, wd, wt); gl.push({ ch, g, x }); x += g.adv + track; } return { gl, w: x - track }; }

  for (let i = 0; i < ops.length; i++) {
    const o = ops[i];
    if (o === 'M') { path.moveTo(m[0] * p[j] + m[2] * p[j + 1] + m[4], m[1] * p[j] + m[3] * p[j + 1] + m[5]); j += 2; }
    else if (o === 'L') { path.lineTo(m[0] * p[j] + m[2] * p[j + 1] + m[4], m[1] * p[j] + m[3] * p[j + 1] + m[5]); j += 2; }
    else if (o === 'Q') { path.quadraticCurveTo(m[0] * p[j] + m[2] * p[j + 1] + m[4], m[1] * p[j] + m[3] * p[j + 1] + m[5], m[0] * p[j + 2] + m[2] * p[j + 3] + m[4], m[1] * p[j + 2] + m[3] * p[j + 3] + m[5]); j += 4; }
    else if (o === 'C') { path.bezierCurveTo(m[0] * p[j] + m[2] * p[j + 1] + m[4], m[1] * p[j] + m[3] * p[j + 1] + m[5], m[0] * p[j + 2] + m[2] * p[j + 3] + m[4], m[1] * p[j + 2] + m[3] * p[j + 3] + m[5], m[0] * p[j + 4] + m[2] * p[j + 5] + m[4], m[1] * p[j + 4] + m[3] * p[j + 5] + m[5]); j += 6; }
    else if (o === 'Z') path.closePath();
  }
}
// o: {s, wd, wt, size|fit, x, y(baseline), align, track(em), per(i,n,e,gx,gw)->{sx,sy,dx,dy,ay}, bsx,bsy,bax,bay}
function textPath(o) {
  const tr = (o.track || 0) * 1000, sh = shape(o.s, o.wd, o.wt, tr);
  const size = o.fit ? o.fit * 1000 / sh.w : o.size, k = size / 1000, wpx = sh.w * k;
  const x0 = o.x - (o.align === 'left' ? 0 : o.align === 'right' ? wpx : wpx / 2);
  const bsx = o.bsx ?? 1, bsy = o.bsy ?? 1, bax = o.bax ?? o.x, bay = o.bay ?? o.y;
  const B = [bsx, 0, 0, bsy, bax - bsx * bax, bay - bsy * bay];
  const path = new Path2D(), boxes = [];
  sh.gl.forEach((e, i) => {
    const gx = x0 + e.x * k, gw = e.g.adv * k;
    const r = (o.per && o.per(i, sh.gl.length, e, gx, gw)) || {};
    const sx = r.sx ?? 1, sy = r.sy ?? 1, ax = gx + gw / 2, ay = r.ay ?? o.y;
    const Gs = [sx, 0, 0, sy, ax - sx * ax + (r.dx || 0), ay - sy * ay + (r.dy || 0)];
    gpath(path, e.g, mul(B, mul(Gs, [k, 0, 0, -k, gx, o.y])));
    boxes.push({ x: gx, w: gw, ch: e.ch });
  });

}
const fitSize = (s, wd, wt, w, track = 0) => w * 1000 / shape(s, wd, wt, track * 1000).w;

// ============================================================ canvases
function mk(alpha) { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d', { alpha })]; }
let cCol, cc;   // card colour layer (premultiplied)
let cMat, cm;   // card materials: R chrome/burnable, G blood ink, B gloss (sauce)
let cSil, cs;   // screen: R near silhouettes, G far silhouettes / logo mass, B fire fuel
let cTmp, ct;   // smear accumulator
const CH = (ch, v) => { const x = Math.round(255 * clamp(v)); return ch === 0 ? `rgb(${x},0,0)` : ch === 1 ? `rgb(0,${x},0)` : `rgb(0,0,${x})`; };
function clearAll() { // fresh surfaces every frame: nothing drawn for one frame can survive into the next
  [cCol, cc] = mk(true); [cMat, cm] = mk(false); [cSil, cs] = mk(false); [cTmp, ct] = mk(true);
  for (const c of [cm, cs]) { c.fillStyle = '#000'; c.fillRect(0, 0, W, H); }
}
function add(ctx, ch, v, path) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = CH(ch, v); ctx.fill(path); ctx.globalCompositeOperation = 'source-over'; }
function addRect(ctx, ch, v, x, y, w, h) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = CH(ch, v); ctx.fillRect(x, y, w, h); ctx.globalCompositeOperation = 'source-over'; }
function addStroke(ctx, ch, v, path, lw) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = CH(ch, v); ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(path); ctx.globalCompositeOperation = 'source-over'; }
const fuelRect = (x, y, w, h, v = 1) => addRect(cs, 2, v, x, y, w, h);
// directional motion blur on the canvas: evaluate an element at n sub-times across the shutter and average them
const SHUT = 1 / 360;
function smear(t, n, fn) {
  n = Math.max(1, Math.min(18, Math.round(n)));
  if (n === 1) { fn(cc, t, 1); return; }
  ct.setTransform(1, 0, 0, 1, 0, 0); ct.globalCompositeOperation = 'source-over'; ct.globalAlpha = 1; ct.clearRect(0, 0, W, H);
  for (let i = 0; i < n; i++) { ct.globalCompositeOperation = 'lighter'; ct.globalAlpha = 1 / n; fn(ct, t + SHUT * ((i + 0.5) / n - 0.5), 1 / n); }
  ct.globalCompositeOperation = 'source-over'; ct.globalAlpha = 1; cc.drawImage(cTmp, 0, 0);
}
const nBlur = px => Math.ceil(Math.abs(px) / 2.5);

// ============================================================ palette
const C = {
  red: '#cf1a12', blood: '#8c0807', bloodHi: '#a50d0b', orange: '#ff6a13', bone: '#eee5d8', boneDim: 'rgba(238,229,216,0.52)',
  iron: [26, 23, 22], char: '#120f0e'
};
function heatRGB(h) { // cast iron heating: charcoal -> blood -> orange -> yellow
  const st = [[0, 50, 44, 41], [0.3, 92, 8, 5], [0.55, 178, 30, 8], [0.8, 255, 96, 14], [1, 255, 170, 70]];
  h = clamp(h); for (let i = 1; i < st.length; i++) if (h <= st[i][0]) { const a = st[i - 1], b = st[i], k = (h - a[0]) / (b[0] - a[0]); return [lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)]; }
  return st[st.length - 1].slice(1);
}
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ============================================================ shapes: partygoer silhouettes
function figPath(x, base, h, type, tilt, hs = 1) {
  const P = new Path2D(), sw = 0.36 * h, shY = base - 0.5 * h, nkY = base - 0.6 * h;
  P.moveTo(x - sw * 1.1, base + h); P.lineTo(x - sw * 1.02, shY + 0.1 * h);
  P.quadraticCurveTo(x - sw * 0.96, shY, x - sw * 0.55, shY - 0.012 * h);
  P.quadraticCurveTo(x - 0.12 * h, shY - 0.03 * h, x - 0.072 * h, nkY);
  P.lineTo(x + 0.072 * h, nkY);
  P.quadraticCurveTo(x + 0.12 * h, shY - 0.03 * h, x + sw * 0.55, shY - 0.012 * h);
  P.quadraticCurveTo(x + sw * 0.96, shY, x + sw * 1.02, shY + 0.1 * h);
  P.lineTo(x + sw * 1.1, base + h); P.closePath();

  const R = (dx, dy) => [px + (dx * ca - dy * sa) * s, py + (dx * sa + dy * ca) * s];
  const poly = pts => { const q = new Path2D(); pts.forEach((p, i) => { const r = R(p[0], p[1]); i ? q.lineTo(r[0], r[1]) : q.moveTo(r[0], r[1]); }); q.closePath(); P.addPath(q); };
  const ell = (cx, cy, rx, ry, rot = 0) => { const q = new Path2D(); const c = R(cx, cy); q.ellipse(c[0], c[1], rx * s, ry * s, a + rot, 0, Math.PI * 2); P.addPath(q); };
  const curve = (pts) => { const q = new Path2D(); const r0 = R(pts[0][0], pts[0][1]); q.moveTo(r0[0], r0[1]); for (let i = 1; i < pts.length; i += 2) { const c1 = R(pts[i][0], pts[i][1]), e = R(pts[i + 1][0], pts[i + 1][1]); q.quadraticCurveTo(c1[0], c1[1], e[0], e[1]); } q.closePath(); P.addPath(q); };
  poly([[-0.065, 0.01], [0.065, 0.01], [0.06, -0.09], [-0.06, -0.09]]);
  if (type === 'pumpkin') { ell(0, -0.17, 0.165, 0.125); poly([[-0.012, -0.29], [0.016, -0.29], [0.05, -0.36], [0.03, -0.37]]); }
  else if (type !== 'hood') ell(0, -0.17, 0.112, 0.14);
  if (type === 'horns') {
    curve([[-0.06, -0.26], [-0.12, -0.36], [-0.2, -0.43], [-0.13, -0.33], [-0.09, -0.24]]);
    curve([[0.06, -0.26], [0.12, -0.36], [0.2, -0.43], [0.13, -0.33], [0.09, -0.24]]);

    ell(0, -0.27, 0.26, 0.032);
    curve([[-0.12, -0.27], [-0.06, -0.45], [0.09, -0.66], [0.03, -0.45], [0.12, -0.27]]);
  } else if (type === 'rabbit') {
    ell(-0.055, -0.4, 0.032, 0.15, -0.12); ell(0.07, -0.36, 0.032, 0.15, 0.55);
  } else if (type === 'antlers') {
    for (const sg of [-1, 1]) {
      poly([[sg * 0.045, -0.27], [sg * 0.085, -0.28], [sg * 0.23, -0.5], [sg * 0.19, -0.515]]);
      poly([[sg * 0.115, -0.355], [sg * 0.145, -0.375], [sg * 0.06, -0.5], [sg * 0.03, -0.49]]);
      poly([[sg * 0.165, -0.425], [sg * 0.19, -0.45], [sg * 0.29, -0.47], [sg * 0.28, -0.44]]);
      poly([[sg * 0.195, -0.485], [sg * 0.22, -0.5], [sg * 0.18, -0.61], [sg * 0.155, -0.6]]);
    }
  } else if (type === 'hood') {
    curve([[-0.2, 0.02], [-0.21, -0.2], [-0.02, -0.46], [0.13, -0.33], [0.2, 0.02]]);
  } else if (type === 'cleaver') {
    poly([[0.3, 0.02], [0.37, 0.0], [0.33, -0.36], [0.27, -0.35]]);
    poly([[0.26, -0.34], [0.34, -0.34], [0.36, -0.43], [0.24, -0.44]]);
    poly([[0.29, -0.44], [0.31, -0.44], [0.42, -0.7], [0.24, -0.76], [0.2, -0.58]]);

}

// full-body partygoer standing on the coal floor (feet at base, h = height to the crown)
function figBody(x, base, h, type, tilt, sway = 0) {
  const P = new Path2D();
  const T = (px, py) => [x + px * h + sway * (py + 1) * (-py) * 0.04 * h, base + py * h];
  const poly = (pts, sym) => { for (const sg of sym ? [-1, 1] : [1]) { const q = new Path2D(); pts.forEach((p, i) => { const r = T(p[0] * sg, p[1]); i ? q.lineTo(r[0], r[1]) : q.moveTo(r[0], r[1]); }); q.closePath(); P.addPath(q); } };

  poly([[-0.125, -0.80], [0.125, -0.80], [0.106, -0.70], [0.084, -0.56], [0.1, -0.46], [-0.1, -0.46], [-0.084, -0.56], [-0.106, -0.70]]);
  poly([[-0.03, -0.85], [0.03, -0.85], [0.032, -0.79], [-0.032, -0.79]]);
  // arms (the butcher raises one)
  poly([[0.118, -0.80], [0.145, -0.77], [0.158, -0.6], [0.15, -0.43], [0.14, -0.39], [0.115, -0.41], [0.122, -0.6], [0.104, -0.72]], type !== 'cleaver');
  if (type === 'cleaver') {
    poly([[-0.118, -0.80], [-0.145, -0.77], [-0.158, -0.6], [-0.15, -0.43], [-0.14, -0.39], [-0.115, -0.41], [-0.122, -0.6], [-0.104, -0.72]]);
    poly([[0.11, -0.8], [0.15, -0.79], [0.25, -0.96], [0.22, -0.99]]);
    poly([[0.2, -0.985], [0.27, -0.96], [0.34, -1.12], [0.22, -1.17], [0.17, -1.05]]);
  }
  // legs or a long dress / cloak
  if (type === 'witch' || type === 'hood') poly([[-0.09, -0.56], [0.09, -0.56], [0.2, 0.0], [-0.2, 0.0]]);
  else poly([[0.1, -0.47], [0.082, -0.25], [0.062, -0.03], [0.085, 0.0], [0.02, 0.0], [0.022, -0.03], [0.018, -0.25], [0.0, -0.43]], true);
  // head on a neck pivot
  const a = tilt * D2R, ca = Math.cos(a), sa = Math.sin(a), pv = T(0, -0.83);
  const R = (dx, dy) => [pv[0] + (dx * ca - dy * sa) * h, pv[1] + (dx * sa + dy * ca) * h];

  const he = (cx, cy, rx, ry, rot = 0) => { const q = new Path2D(); const c = R(cx, cy); q.ellipse(c[0], c[1], rx * h, ry * h, a + rot, 0, Math.PI * 2); P.addPath(q); };
  if (type === 'pumpkin') { he(0, -0.07, 0.085, 0.064); hp([[-0.006, -0.13], [0.01, -0.13], [0.03, -0.17], [0.016, -0.175]]); }
  else he(0, -0.075, 0.056, 0.07);
  if (type === 'horns') { for (const sg of [-1, 1]) hp([[sg * 0.03, -0.125], [sg * 0.06, -0.17], [sg * 0.105, -0.205], [sg * 0.075, -0.15], [sg * 0.05, -0.11]]); }
  if (type === 'witch') { he(0, -0.125, 0.125, 0.016); hp([[-0.058, -0.13], [0.058, -0.13], [0.03, -0.24], [0.06, -0.33], [0.0, -0.24]]); }
  if (type === 'rabbit') { he(-0.026, -0.2, 0.017, 0.078, -0.12); he(0.04, -0.18, 0.017, 0.078, 0.6); }
  if (type === 'antlers') for (const sg of [-1, 1]) {
    hp([[sg * 0.02, -0.13], [sg * 0.042, -0.135], [sg * 0.11, -0.25], [sg * 0.09, -0.258]]);
    hp([[sg * 0.06, -0.18], [sg * 0.075, -0.19], [sg * 0.03, -0.255], [sg * 0.017, -0.25]]);
    hp([[sg * 0.082, -0.21], [sg * 0.095, -0.226], [sg * 0.145, -0.235], [sg * 0.14, -0.218]]);
  }
  if (type === 'hood') hp([[-0.075, -0.01], [-0.08, -0.1], [0.0, -0.2], [0.06, -0.15], [0.078, -0.01]]);
  if (type === 'tophat') { he(0, -0.135, 0.1, 0.014); hp([[-0.052, -0.135], [0.052, -0.135], [0.048, -0.25], [-0.048, -0.25]]); }
  return P;
}

// ============================================================ logo
const logoImg = new Image();
let logoMask = null; // logo alpha painted into the green channel (silhouette morph target)
const LOGO_W = 760;
function drawLogo(ctx, cx, cy, scale, alpha = 1) {
  const w = LOGO_W * scale, h = w * logoImg.height / logoImg.width;
  ctx.globalAlpha *= alpha; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(logoImg, cx - w / 2, cy - h / 2, w, h); ctx.globalAlpha = 1;
  return [cx - w / 2, cy - h / 2, w, h];
}

// ============================================================ timeline helpers
// main card angle on the spit (degrees). always increasing; resets happen only edge-on or under a swap.
function thCard(t) {
