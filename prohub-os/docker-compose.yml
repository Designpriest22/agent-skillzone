# Local development stack: PostgreSQL 16 (Supabase-compatible).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: prohub
      POSTGRES_PASSWORD: prohub
      POSTGRES_DB: prohub
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
