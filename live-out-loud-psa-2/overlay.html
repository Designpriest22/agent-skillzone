<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>PSA Overlay</title>
<script src="config.js"></script>
<style>
@font-face { font-family: "Anton"; src: url(assets/fonts/anton-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
@font-face { font-family: "Oswald"; src: url(assets/fonts/oswald-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
:root { --ink: #0B0806; --cream: #F4ECE1; --orange: #E8561B; --gold: #EBC791; --tan: #D2A983; }
html, body { margin: 0; background: transparent; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
/* browser preview only: the source clip behind the overlay (render.mjs composites the real footage with ffmpeg) */
#preview { position: absolute; left: -67px; top: -260px; width: 1214px; height: 2180px; object-fit: cover; object-position: 50% 100%; display: none; }
.abs { position: absolute; }
.c { left: 0; right: 0; text-align: center; white-space: nowrap; }

#title { position: absolute; inset: 0; }
#dim { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 48%, rgba(11,8,6,.62), rgba(11,8,6,.86)); }
.stripes { position: absolute; left: -60px; right: -60px; height: 44px;
  background: repeating-linear-gradient(-45deg, var(--orange) 0 26px, var(--ink) 26px 52px);
  box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
#stTop { top: 418px; } #stBot { top: 1352px; }
#l1, #l2 { font: 400 168px/1 Anton; color: var(--cream); letter-spacing: 2px; }
#l1 { top: 500px; } #l2 { top: 672px; }
#stampWrap { top: 862px; }
#stamp { display: inline-block; font: 400 112px/1 Anton; color: var(--ink); background: var(--orange); padding: 10px 34px 14px; border-radius: 10px; letter-spacing: 4px; }
#s1, #s3 { font: 800 42px/1 Montserrat; color: var(--cream); letter-spacing: 3px; }
#s1 { top: 1048px; } #s3 { top: 1262px; }
#s2 { top: 1110px; font: 400 128px/1 Anton; color: var(--gold); letter-spacing: 4px; }
.caret { display: inline-block; width: 6px; height: 40px; margin-left: 6px; vertical-align: -4px; background: var(--orange); }

#tag { position: absolute; top: 1476px; left: 0; right: 0; text-align: center; }
#tag span { display: inline-block; font: 800 30px/1 Montserrat, "Noto Color Emoji"; letter-spacing: 3px; color: var(--cream);
  padding: 18px 30px; border-radius: 40px; background: rgba(11,8,6,.66); border: 3px solid var(--orange); }

#art { position: absolute; inset: 0; display: none; }
#glow { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 40%, rgba(232,86,27,.26), rgba(0,0,0,0) 70%), linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.45)); }
#flyer { position: absolute; left: 110px; top: 262px; width: 860px; height: 1075px; border-radius: 28px; overflow: hidden;
  box-shadow: 0 40px 110px rgba(0,0,0,.75), 0 0 0 2px rgba(255,236,210,.16), 0 0 140px rgba(240,120,40,.25); }
#flyer img { width: 100%; height: 100%; display: block; }
#sheen { position: absolute; inset: 0; mix-blend-mode: screen; background-size: 300% 100%;
  background-image: linear-gradient(115deg, rgba(255,255,255,0) 40%, rgba(255,240,220,.3) 50%, rgba(255,255,255,0) 60%); }
#details { top: 1372px; font: 600 44px/1 Oswald; letter-spacing: 7px; color: var(--tan); text-shadow: 0 2px 14px rgba(0,0,0,.6); }
#ctaLabel { top: 1440px; font: 700 28px/1 Montserrat; letter-spacing: 9px; color: rgba(244,236,225,.9); text-shadow: 0 2px 12px rgba(0,0,0,.6); }
#cta { position: absolute; left: 90px; width: 900px; top: 1482px; height: 128px; border-radius: 64px; overflow: hidden;
  background: linear-gradient(100deg, #F58A2F, #E2531C 55%, #C9401A); display: flex; align-items: center; justify-content: center; }
#cta span { position: relative; z-index: 1; font: 800 64px/1 Montserrat; color: #FFF8EE; text-shadow: 0 2px 8px rgba(80,20,0,.35); }
#ctaSweep { position: absolute; inset: 0; background-size: 300% 100%;
  background-image: linear-gradient(110deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 60%); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <video id="preview" muted playsinline></video>
  <div id="title">
    <div id="dim"></div>
    <div class="stripes" id="stTop"></div>
    <div class="abs c" id="l1"></div>
    <div class="abs c" id="l2"></div>
    <div class="abs c" id="stampWrap"><span id="stamp"></span></div>
    <div class="abs c" id="s1"></div>
    <div class="abs c" id="s2"></div>
    <div class="abs c" id="s3"></div>
    <div class="stripes" id="stBot"></div>
  </div>
  <div id="tag"><span></span></div>
  <div id="art">
    <div id="glow"></div>
    <div id="flyer"><img id="flyerImg"><div id="sheen"></div></div>
    <div class="abs c" id="details"></div>
    <div class="abs c" id="ctaLabel"></div>
    <div id="cta"><span id="ctaTxt"></span><div id="ctaSweep"></div></div>
  </div>
  <div id="flash"></div>
</div>
<script>
(function () {
const C = window.CONFIG, T = C.title, G = C.tag, A = C.artwork;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const eOut = p => 1 - Math.pow(1 - p, 3);
const eExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const s = 1.5; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };

$('l1').textContent = T.line1; $('l2').textContent = T.line2; $('stamp').textContent = T.stamp;
$('s2').textContent = T.sub2; $('s3').textContent = T.sub3;
$('tag').firstElementChild.textContent = G.text;
$('flyerImg').src = A.flyer; $('details').textContent = A.details; $('ctaLabel').textContent = A.ctaLabel; $('ctaTxt').textContent = A.cta;

// shrink any line that would run past the safe width
function fit(id, max = 990) { const n = $(id); n.style.transform = ''; const w = n.firstChild && n.scrollWidth; return w > max ? max / w : 1; }
let fits = {};

function slam(id, t, at, from = 1.5, base = 1) {
  const p = eBack(P(t, at, 0.3));
  $(id).style.opacity = t >= at ? 1 : 0;
  $(id).style.transform = `scale(${lerp(from, 1, p) * base})`;
}

function renderAt(t) {
  // ---- title card ----
  const outP = eInOut(P(t, T.out, 0.35));
  $('title').style.display = t < T.out + 0.4 ? 'block' : 'none';
  $('dim').style.opacity = 1 - outP;
  $('stTop').style.transform = `translateX(${(1 - eExpo(P(t, T.in, 0.35))) * -1200 - outP * 1200}px)`;
  $('stBot').style.transform = `translateX(${(1 - eExpo(P(t, T.in + 0.1, 0.35))) * 1200 + outP * 1200}px)`;
  $('stTop').style.backgroundPosition = $('stBot').style.backgroundPosition = `${t * 60}px 0`;
  slam('l1', t, T.in + 0.12, 1.5, fits.l1);
  slam('l2', t, T.in + 0.42, 1.5, fits.l2);
  const sp = eBack(P(t, T.in + 0.75, 0.32));
  $('stampWrap').style.opacity = t >= T.in + 0.75 ? 1 : 0;
  $('stamp').style.transform = `rotate(${lerp(-14, -3, sp)}deg) scale(${lerp(1.8, 1, sp)})`;
  // typewriter subtitle
  const n = Math.round(T.sub1.length * P(t, T.in + 1.05, 0.7));
  $('s1').innerHTML = T.sub1.slice(0, n).replace(/&/g, '&amp;') + (n < T.sub1.length && t >= T.in + 1.05 ? '<span class="caret"></span>' : '');
  $('s1').style.transform = `scale(${fits.s1})`;
  slam('s2', t, T.in + 1.8, 1.4, fits.s2);
  const p3 = eOut(P(t, T.in + 2.1, 0.3));
  $('s3').style.opacity = p3; $('s3').style.transform = `translateY(${(1 - p3) * 20}px)`;
  ['l1', 'l2', 'stampWrap', 's1', 's2', 's3'].forEach((id, i) => {
    const o = eInOut(P(t, T.out + i * 0.02, 0.3));
    $(id).style.marginTop = (-60 * o) + 'px';
    if (o > 0) $(id).style.opacity = parseFloat($(id).style.opacity || 1) * (1 - o);
  });

  // ---- persistent PSA tag over the clip ----
  const tin = eOut(P(t, G.in, 0.35)), tout = eInOut(P(t, G.out, 0.3));
  $('tag').style.opacity = tin * (1 - tout);
  $('tag').style.transform = `translateY(${(1 - tin) * 30 + tout * 30}px)`;

  // ---- event artwork ----
  $('art').style.display = t >= A.in - 0.05 ? 'block' : 'none';
  if (t >= A.in - 0.05) {
    const fp = eOut(P(t, A.in, 0.5));
    $('glow').style.opacity = eOut(P(t, A.in - 0.05, 0.3));
    $('flyer').style.opacity = clamp(P(t, A.in, 0.12));
    $('flyer').style.transform = `scale(${lerp(1.14, 1, fp) * (1 + 0.035 * P(t, A.in + 0.6, C.duration - A.in - 0.6))})`;
    const sweeps = [0.8, 6.5, 12.5].map(k => A.in + k);
    const sw = sweeps.map(s => P(t, s, 0.8)).find(p => p > 0 && p < 1) || 0;
    $('sheen').style.backgroundPosition = `${lerp(130, -30, eInOut(sw))}% 0`;
    const dp = eOut(P(t, A.in + 0.55, 0.4));
    $('details').style.opacity = dp; $('details').style.transform = `translateY(${(1 - dp) * 20}px)`;
    const lp = eOut(P(t, A.in + 0.8, 0.4));
    $('ctaLabel').style.opacity = lp; $('ctaLabel').style.transform = `translateY(${(1 - lp) * 16}px)`;
    const cp = eBack(P(t, A.in + 1.0, 0.45));
    const pulse = t > A.in + 2 ? 0.5 + 0.5 * Math.sin((t - A.in - 2) * 3.4) : 0;
    $('cta').style.opacity = clamp(P(t, A.in + 1.0, 0.15));
    $('cta').style.transform = `scale(${lerp(0.85, 1, cp) * (1 + 0.012 * pulse)})`;
    $('cta').style.boxShadow = `0 18px ${50 + 30 * pulse}px rgba(226,83,28,${0.45 + 0.25 * pulse})`;
    const cs = [2.0, 5.5, 9.0, 12.5].map(k => P(t, A.in + k, 0.75)).find(p => p > 0 && p < 1) || 0;
    $('ctaSweep').style.backgroundPosition = `${lerp(110, -10, eInOut(cs))}% 0`;
  }
  $('flash').style.opacity = t >= A.in - 0.02 ? 0.85 * (1 - eOut(P(t, A.in - 0.02, 0.28))) : 0;
}
window.renderAt = renderAt;

window.ready = (async () => {
  await Promise.all([document.fonts.load('100px Anton'), document.fonts.load('800 40px Montserrat'), document.fonts.load('700 40px Montserrat'),
    document.fonts.load('600 40px Oswald'), document.fonts.load('40px "Noto Color Emoji"', '⚠')]);
  await document.fonts.ready;
  const img = $('flyerImg'); if (!img.complete) await new Promise(r => { img.onload = r; img.onerror = r; });
  $('s1').textContent = T.sub1;
  fits = { l1: fit('l1'), l2: fit('l2'), s1: fit('s1'), s2: fit('s2') };
  renderAt(0);
  return true;
})();

if (!/render/.test(location.search)) {
  const v = $('preview'); v.src = C.source.file; v.style.display = 'block';
  window.ready.then(() => { v.play(); const loop = () => { renderAt(v.currentTime); requestAnimationFrame(loop); }; loop(); });
}
})();
</script>
</body>
</html>
