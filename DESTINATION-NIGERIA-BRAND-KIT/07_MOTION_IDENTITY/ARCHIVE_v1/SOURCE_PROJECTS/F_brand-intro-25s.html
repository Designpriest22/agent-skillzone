<!doctype html><html><head><meta charset="utf-8"><title>F — Brand intro (25 s)</title></head><body>
<script src="dn-logo-data.js"></script><script src="dn-intro-data.js"></script><script src="dn-motion.js"></script><script src="dn-illustration.js"></script>
<script>
// F — 25 s brand intro. ?w=&h= sets the format (1920x1080, 1080x1080, 1080x1350, 1080x1920). ?scrub&play to preview.
// Story: Dawn → EXPERIENCE (festival) → INVEST (waterfront) → EXPLORE (map → landscape) → logo + campaign line.
// All timings come from dn-intro-data.js, shared with the soundtrack (16_SOURCE_FILES/build/intro.py).
const { P, E, seg, lerp, clamp, stage, logo, campaign } = DNM;
const { el, g, path, id, tf, lin, rad, blur, drummer, dancer, traveller, professional, palm, acacia, bird, elephant, inselberg, stringLights, waterfall, sm } = DNIL;
const T = DNI.T, C = DN.C;
window.DURATION = T.dur; window.FPS = 30;
const { svg, defs } = stage();
const W = P.w, H = P.h, u = Math.min(W, H) / 1080, land = W / H > 1.3, tall = H / W > 1.5;
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const mix = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const vis = (n, a, b, t) => n.setAttribute('display', t >= a && t <= b ? 'inline' : 'none');
function ridgeD(w, base, amp, freq, seed, h = H) { let d = `M-20,${h + 20} L-20,${base}`; for (let x = -20; x <= w + 20; x += 12) { const y = base - amp * (Math.sin(x / w * Math.PI * 2 * freq + seed) * .6 + Math.sin(x / w * Math.PI * 2 * freq * 2.3 + seed * 1.7) * .3 + Math.sin(x / w * Math.PI * 2 * freq * 5.1 + seed * .3) * .1); d += ` L${x},${y.toFixed(1)}`; } return d + ` L${w + 20},${h + 20} Z`; }
function grass(p, y0, w, n, col, hgt = 18) { let d = ''; for (let i = 0; i < n; i++) { const x = rnd() * w, y = y0 + rnd() * 12, h = (hgt + rnd() * hgt) * u; d += `M${x},${y} q${-3 * u},${-h * .6} ${-6 * u},${-h} M${x},${y} q${2 * u},${-h * .7} ${5 * u},${-h * .9} `; } return path(p, d, 'none', { stroke: col, 'stroke-width': 2.2 * u, 'stroke-linecap': 'round' }); }

// ------------------------------------------------------------------ layout per format
const L = land ? { tx: W * .075, ty: H * .36, anchor: 'start', availW: W * .44, cx: W * .68, ground: H * .93, cs: H / 1080 * .95 }
  : { tx: W / 2, ty: tall ? H * .2 : H * .13, anchor: 'middle', availW: W * .86, cx: W / 2, ground: tall ? H * .84 : H * .955, cs: u * (tall ? 1.08 : (H / W > 1.15 ? .9 : .78)) };
const horizon = land ? H * .64 : (tall ? H * .66 : H * .62);
const hF = land ? 1 : (tall ? .95 : .7);   // skyline/crane height factor so headlines stay clear

// kinetic word: tracking-in + gold sun dot + sub line
function Word(parent, word, sub, color) {
  const root = g(parent);
  const fs = Math.min(land ? 150 * H / 1080 : 132 * u, L.availW / (word.length * .78));
  const t1 = el('text', { x: 0, y: 0, 'font-family': 'Inter, Arial, sans-serif', 'font-weight': 600, 'font-size': fs, fill: color, 'text-anchor': L.anchor }, root); t1.textContent = word;
  const dot = el('circle', { r: fs * .11, fill: C.gold }, root);
  const t2 = el('text', { x: 0, y: fs * .62, 'font-family': "'Source Serif 4', Georgia, serif", 'font-style': 'italic', 'font-size': fs * .27, fill: color, 'text-anchor': L.anchor }, root); t2.textContent = sub;
  const bar = el('rect', { y: fs * .2, height: Math.max(2, fs * .03), fill: C.gold }, root);
  tf(root, `translate(${L.tx},${L.ty + fs * .8})`);
  return {
    g: root, fs, update(t, t0, t1end) {
      const k = seg(t, t0, t0 + .7, E.outExpo), out = seg(t, t1end - .5, t1end, E.inOutCubic);
      root.setAttribute('opacity', k * (1 - out));
      const ls = lerp(.55, .08, k);
      t1.setAttribute('letter-spacing', `${ls}em`);
      t1.setAttribute('transform', `translate(0,${(1 - k) * fs * .25 - out * fs * .2})`);
      const len = t1.getComputedTextLength();
      const right = L.anchor === 'start' ? len - ls * fs : len / 2 - ls * fs / 2;
      dot.setAttribute('cx', right + fs * .17); dot.setAttribute('cy', -fs * .11 + (1 - k) * fs * .25 - out * fs * .2);
      const d = seg(t, t0 + .35, t0 + .75, E.outBack); dot.setAttribute('transform', `translate(${right + fs * .17},${-fs * .11}) scale(${Math.max(0, d)}) translate(${-(right + fs * .17)},${fs * .11})`);
      const sk = seg(t, t0 + .5, t0 + 1.1, E.outCubic); t2.setAttribute('opacity', sk); t2.setAttribute('transform', `translate(0,${(1 - sk) * 14})`);
      const bw = fs * 1.2 * seg(t, t0 + .4, t0 + 1.1, E.outCubic); bar.setAttribute('width', bw); bar.setAttribute('x', L.anchor === 'start' ? 0 : -bw / 2); bar.setAttribute('y', fs * .95);
    },
  };
}
function scrim(parent, dark = true) {
  if (!land) return el('rect', { width: W, height: H * .42, fill: lin(defs, [[0, dark ? C.forest : C.ivory, dark ? .55 : .75], [1, dark ? C.forest : C.ivory, 0]], 0, 1) }, parent);
  return el('rect', { width: W * .62, height: H, fill: lin(defs, [[0, dark ? C.forest : C.ivory, dark ? .62 : .9], [.55, dark ? C.forest : C.ivory, dark ? .3 : .55], [1, dark ? C.forest : C.ivory, 0]], 1, 0) }, parent);
}

// ================================================================== 1 DAWN
const sD = g(svg);
const skyStops = [];
const skyId = id('sky'); const skyLg = el('linearGradient', { id: skyId, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
[0, .55, .9].forEach(o => skyStops.push(el('stop', { offset: o }, skyLg)));
const camD = g(sD);
el('rect', { x: -W * .1, y: -H * .1, width: W * 1.2, height: H * 1.2, fill: `url(#${skyId})` }, camD);
const stars = g(camD); const starEls = [...Array(90)].map(() => el('circle', { cx: rnd() * W, cy: rnd() * horizon * .8, r: (.8 + rnd() * 1.6) * u, fill: '#FFF7E0' }, stars));

const sunG = g(camD);
el('circle', { r: 330 * u, fill: rad(defs, [[0, '#FFD98A', .75], [.35, C.gold, .25], [1, C.gold, 0]]) }, sunG);
el('circle', { r: 62 * u, fill: '#F6C86A' }, sunG);
const farR = path(camD, ridgeD(W, horizon - 40 * u, 26 * u, 1.3, 2), '#2E5444');
const rockW = Math.min(W * .62, 940 * u), rockX = sunX - rockW * .78;
const rock = inselberg(camD, defs, rockW, rockW * .5); tf(rock, `translate(${rockX},${horizon + 26 * u})`);

const nearR1 = path(camD, ridgeD(W, horizon + 70 * u, 30 * u, .9, 5), '#173D30');
const tree1 = g(camD); tf(tree1, `translate(${W * (land ? .14 : .12)},${horizon + 66 * u}) scale(${1.3 * u})`); acacia(tree1, 1, '#123126');
const tree2 = g(camD); tf(tree2, `translate(${W * .9},${horizon + 90 * u}) scale(${.9 * u})`); acacia(tree2, 1, '#123126');

const birdsD = [...Array(9)].map(() => bird(camD, '#10241C'));
scrim(sD, true).setAttribute('opacity', .8);
const head1 = g(sD); tf(head1, `translate(${L.tx},${L.ty})`);
const ovl = el('text', { 'font-family': 'Inter, Arial', 'font-weight': 600, 'font-size': 22 * u * (land ? 1.15 : 1.1), 'letter-spacing': '.3em', fill: C.gold, 'text-anchor': L.anchor }, head1); ovl.textContent = 'DESTINATION NIGERIA';

const hl = el('text', { y: hfs * 1.15, 'font-family': "'Playfair Display', Georgia, serif", 'font-weight': 500, 'font-size': hfs, fill: C.ivory, 'text-anchor': L.anchor }, head1); hl.textContent = 'Horizons, opened.';

// ================================================================== 2 EXPERIENCE (dusk festival)
const sE = g(svg); const irisE = id('iris'); const cpE = el('clipPath', { id: irisE }, defs); const irisCE = el('circle', { r: 0 }, cpE);

el('rect', { x: -W * .1, y: -H * .1, width: W * 1.2, height: H * 1.2, fill: lin(defs, [[0, '#0E2C22'], [.45, '#3E2A22'], [.85, '#B8652E'], [1, '#E8A432']], 0, 1) }, camE);

}
const lights = [stringLights(camE, defs, -20, W * .55, H * (land ? .14 : .1), 50 * u, 11), stringLights(camE, defs, W * .45, W + 20, H * (land ? .1 : .08), 46 * u, 10), stringLights(camE, defs, W * .1, W * .95, H * (land ? .24 : .3), 60 * u, 14)];
el('rect', { x: -W * .1, y: horizon + 55 * u, width: W * 1.2, height: H, fill: lin(defs, [[0, '#3A2618'], [1, '#170E09']], 0, 1) }, camE);
// stall: pot of jollof on a fire, steam rising
const stall = g(camE); const stX = land ? W * .44 : W * .84, stY = horizon + 120 * u;
tf(stall, `translate(${stX},${stY}) scale(${u * (land ? 1 : .8)})`);
path(stall, 'M-70,0 L-40,-30 L40,-30 L70,0 Z', '#2B1E16');
el('ellipse', { cx: 0, cy: -10, rx: 40, ry: 10, fill: '#F08A2A', opacity: .8, filter: blur(defs, 6) }, stall);
path(stall, 'M-46,-34 C-50,-90 50,-90 46,-34 Z', '#1B1512'); el('ellipse', { cx: 0, cy: -84, rx: 44, ry: 9, fill: '#2B2420' }, stall);
el('ellipse', { cx: 0, cy: -84, rx: 38, ry: 6, fill: '#C0442A' }, stall);
const steam = [...Array(5)].map(() => path(stall, '', 'none', { stroke: '#F5F0E6', 'stroke-width': 6, 'stroke-linecap': 'round', opacity: .35, filter: blur(defs, 3) }));
const embers = [...Array(36)].map(() => ({ c: el('circle', { r: (1.5 + rnd() * 2.5) * u, fill: '#FFD27A' }, camE), x: rnd() * W, s: .3 + rnd() * .7, p: rnd() * 10 }));
const dr = drummer(camE, defs, T.drum), dc = dancer(g(camE), defs);
const dancerWrap = dc.g.parentNode;
const pScale = land ? L.cs : L.cs * .86;
tf(dr.g, `translate(${land ? L.cx - 210 * L.cs : W * .3},${L.ground}) scale(${pScale})`);
tf(dancerWrap, `translate(${land ? L.cx + 190 * L.cs : W * .73},${L.ground}) scale(${-pScale},${pScale})`);
scrim(sE, true);
const wE = Word(sE, 'EXPERIENCE', 'Culture, music, food and festivals.', C.ivory);

// ================================================================== 3 INVEST (waterfront, day)
const sI = g(svg); const wipeI = id('wipe'); const cpI = el('clipPath', { id: wipeI }, defs); const wipeR = el('rect', { x: 0, y: 0, height: H, width: 0 }, cpI);
sI.setAttribute('clip-path', `url(#${wipeI})`);
const camI = g(sI);
el('rect', { x: -W * .1, y: -H * .1, width: W * 1.2, height: H * 1.2, fill: lin(defs, [[0, '#B9D3CC'], [.7, '#EEF0E4'], [1, C.ivory]], 0, 1) }, camI);
el('circle', { cx: W * .86, cy: H * .14, r: 54 * u, fill: C.gold }, camI);
el('circle', { cx: W * .86, cy: H * .14, r: 120 * u, fill: rad(defs, [[0, C.gold, .35], [1, C.gold, 0]]) }, camI);
const lineG = g(camI);
const growth = path(lineG, '', 'none', { stroke: C.gold, 'stroke-width': 6 * u, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': 1 });
const gpts = land ? [[.5, .52], [.58, .44], [.65, .47], [.73, .35], [.8, .38], [.9, .2]] : [[.1, .48], [.28, .42], [.42, .45], [.6, .33], [.74, .36], [.9, .22]];
growth.setAttribute('d', 'M' + gpts.map(([x, y]) => `${W * x},${H * y}`).join(' L'));
const nodes = gpts.map(([x, y]) => el('circle', { cx: W * x, cy: H * y, r: 9 * u, fill: C.ivory, stroke: C.gold, 'stroke-width': 4 * u }, lineG));
const skyline = g(camI); const winI = [];
const sky0 = horizon;
let towerX = W * (land ? .62 : .66);

  const bw = (70 + rnd() * 90) * u; let bh = (110 + rnd() * 230) * u * hF;
  if (Math.abs(x - towerX) < bw) bh = 430 * u * hF;
  const col = rnd() > .5 ? '#2C5040' : '#3E6352';
  path(skyline, `M${x},${sky0} V${sky0 - bh} h${bw} V${sky0} Z`, col);
  path(skyline, `M${x + bw * .72},${sky0} V${sky0 - bh} h${bw * .28} V${sky0} Z`, '#173D30', { opacity: .35 });
  if (bh > 400 * u * hF - 1) { path(skyline, `M${x + bw * .2},${sky0 - bh} l${bw * .3},${-60 * u} l${bw * .3},${60 * u} Z`, '#2C5040'); path(skyline, `M${x + bw * .5},${sky0 - bh - 60 * u} v${-50 * u}`, 'none', { stroke: '#2C5040', 'stroke-width': 4 * u }); }
  for (let yy = sky0 - bh + 16 * u; yy < sky0 - 14 * u; yy += 22 * u) for (let xx = x + 10 * u; xx < x + bw - 16 * u; xx += 18 * u) { const w = el('rect', { x: xx, y: yy, width: 9 * u, height: 12 * u, fill: '#F5F0E6', opacity: .35 + rnd() * .35 }, skyline); if (rnd() < .06) winI.push(w); }
  x += bw + 4 * u;
}
// hotel under construction + tower crane
const site = g(camI); const sX = W * (land ? .2 : .08), sW = 220 * u, sH = 300 * u * hF;
for (let f = 0; f <= 6; f++) path(site, `M${sX},${sky0 - f * sH / 6} h${sW}`, 'none', { stroke: '#5F6662', 'stroke-width': 6 * u });
for (let c = 0; c <= 4; c++) path(site, `M${sX + c * sW / 4},${sky0} v${-sH}`, 'none', { stroke: '#5F6662', 'stroke-width': 5 * u });
for (let f = 0; f < 4; f++) el('rect', { x: sX, y: sky0 - (f + 1) * sH / 6, width: sW, height: sH / 6, fill: '#E7DFCF', opacity: .9 }, site);
const mastX = sX + sW + 50 * u, mastTop = sky0 - 560 * u * hF;
el('rect', { x: mastX - 10 * u, y: mastTop, width: 20 * u, height: 560 * u * hF, fill: 'none', stroke: C.golddeep, 'stroke-width': 3 * u }, site);
let zz = ''; for (let y = mastTop; y < sky0; y += 20 * u) zz += `M${mastX - 10 * u},${y} L${mastX + 10 * u},${y + 20 * u} M${mastX + 10 * u},${y} L${mastX - 10 * u},${y + 20 * u} `;
path(site, zz, 'none', { stroke: C.golddeep, 'stroke-width': 1.6 * u });
const jibL = 420 * u;
path(site, `M${mastX + 60 * u},${mastTop} h${-jibL - 60 * u} M${mastX + 60 * u},${mastTop + 18 * u} h${-jibL - 60 * u} M${mastX},${mastTop - 40 * u} L${mastX - jibL},${mastTop} M${mastX},${mastTop - 40 * u} L${mastX + 60 * u},${mastTop}`, 'none', { stroke: C.golddeep, 'stroke-width': 3 * u });
el('rect', { x: mastX + 40 * u, y: mastTop + 4 * u, width: 30 * u, height: 26 * u, fill: '#5F6662' }, site);
const trolley = el('rect', { width: 20 * u, height: 10 * u, fill: '#1B201E' }, site);
const cable = path(site, '', 'none', { stroke: '#1B201E', 'stroke-width': 2 * u });
const beam = el('rect', { width: 110 * u, height: 14 * u, fill: C.laterite }, site);
// lagoon + reflections + boats
el('rect', { x: -W * .1, y: sky0, width: W * 1.2, height: H, fill: lin(defs, [[0, '#7FA9A3'], [1, '#2E6E76']], 0, 1) }, camI);
const refl = el('use', { href: '#' + (skyline.id = id('skl')), opacity: .22, transform: `translate(0,${2 * sky0}) scale(1,-1)` }, camI);
const ripples = [...Array(14)].map((_, i) => el('rect', { y: sky0 + (12 + i * 16) * u, height: 2 * u, fill: '#FFFFFF', opacity: .35 }, camI));
const boats = [0, 1].map(i => { const b = g(camI); path(b, `M-60,0 L60,0 L44,18 L-48,18 Z`, '#0E2C22'); path(b, 'M-34,0 L-30,-26 L30,-26 L34,0 Z', i ? C.laterite : C.gold); path(b, 'M-80,22 h30 M60,22 h30', 'none', { stroke: '#FFFFFF', 'stroke-width': 3, opacity: .6 }); return b; });
el('rect', { x: -W * .1, y: horizon + (land ? 170 : 210) * u, width: W * 1.2, height: H, fill: lin(defs, [[0, '#E7DFCF'], [1, '#CFC5B1']], 0, 1) }, camI);
for (let i = 0; i < 12; i++) path(camI, `M${W * i / 11},${horizon + (land ? 170 : 210) * u} L${W * i / 11 + (i - 5.5) * 80 * u},${H}`, 'none', { stroke: '#BDB29B', 'stroke-width': 2 * u });
const cards = [['Verified project profiles', 'M4 18 L10 12 L14 15 L20 7'], ['Partnership frameworks', 'M7 12 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0 M17 12 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0']].map(([txt, ic], i) => {
  const c = g(camI); const cw = 360 * u, ch = 84 * u;
  el('rect', { width: cw, height: ch, rx: 16 * u, fill: '#FFFFFF', opacity: .95 }, c);
  el('rect', { x: 16 * u, y: 16 * u, width: 52 * u, height: 52 * u, rx: 12 * u, fill: C.forest }, c);
  el('path', { d: ic, transform: `translate(${22 * u},${22 * u}) scale(${1.7 * u})`, fill: 'none', stroke: C.gold, 'stroke-width': 2, 'stroke-linecap': 'round' }, c);
  const tx = el('text', { x: 84 * u, y: 52 * u, 'font-family': 'Inter, Arial', 'font-weight': 600, 'font-size': 24 * u, fill: C.forest }, c); tx.textContent = txt;
  return c;
});
const pro = professional(g(camI), defs); const proWrap = pro.g.parentNode;

const ribbon = path(svg, '', lin(defs, [[0, C.gold, 0], [.4, C.gold, 1], [.6, '#F6CD72', 1], [1, C.gold, 0]], 1, 0));
scrim(sI, false);
const wI = Word(sI, 'INVEST', 'Credible, coordinated opportunities.', C.forest);

// ================================================================== 4 MAP → EXPLORE
const sM = g(svg); const irisM = id('iris'); const cpM = el('clipPath', { id: irisM }, defs); const irisCM = el('circle', { cx: W / 2, cy: H / 2, r: 0 }, cpM);
sM.setAttribute('clip-path', `url(#${irisM})`);
el('rect', { width: W, height: H, fill: C.ivory }, sM);
const pid = id('tile'); const pat = el('pattern', { id: pid, width: 480, height: 480, patternUnits: 'userSpaceOnUse' }, defs); pat.innerHTML = DN.contourTile;
el('rect', { width: W, height: H, fill: `url(#${pid})`, opacity: .35 }, sM);
const mapBox = land ? { x: W * .52, y: H * .14, w: W * .42 } : { x: W * .1, y: tall ? H * .38 : H * .36, w: W * .8 };
const ms = mapBox.w / DNI.map.w; const mapG = g(sM);
const mapInner = g(mapG); tf(mapInner, `translate(${mapBox.x},${mapBox.y}) scale(${ms})`);
const ngFill = path(mapInner, DNI.map.d, C.sage, { opacity: 0 });
