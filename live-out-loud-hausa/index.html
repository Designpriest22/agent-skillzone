<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Live Out Loud — Hausa WhatsApp Story</title>
<script src="config.js"></script>
<style>
@font-face { font-family: "Anton"; src: url(assets/fonts/anton-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
@font-face { font-family: "Oswald"; src: url(assets/fonts/oswald-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Oswald"; src: url(assets/fonts/oswald-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "Oswald"; src: url(assets/fonts/oswald-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
/* latin-ext: Hausa hooked letters (Ɓ ɓ Ɗ ɗ Ƙ ƙ Ƴ ƴ) */
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-ext-600-normal.woff2) format("woff2"); font-weight: 600; unicode-range: U+0100-02AF, U+1E00-1EFF; }
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-ext-700-normal.woff2) format("woff2"); font-weight: 700; unicode-range: U+0100-02AF, U+1E00-1EFF; }
@font-face { font-family: "Montserrat"; src: url(assets/fonts/montserrat-latin-ext-800-normal.woff2) format("woff2"); font-weight: 800; unicode-range: U+0100-02AF, U+1E00-1EFF; }
@font-face { font-family: "Oswald"; src: url(assets/fonts/oswald-latin-ext-600-normal.woff2) format("woff2"); font-weight: 600; unicode-range: U+0100-02AF, U+1E00-1EFF; }

html, body { margin: 0; padding: 0; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050404;
  font-family: "Inter", "Noto Color Emoji", sans-serif; -webkit-font-smoothing: antialiased; }
#bg { position: absolute; inset: -60px; background: url(assets/bg_blur.jpg) center/cover; }
#bgShade { position: absolute; inset: 0;
  background: radial-gradient(120% 70% at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%); }
#embers { position: absolute; inset: 0; pointer-events: none; }
.ember { position: absolute; border-radius: 50%; background: #ffb070; filter: blur(1px); }
#pagefade { position: absolute; inset: 0; background: #000; pointer-events: none; }

/* ---- closing frame (px units, 1080x1920 canvas) ---- */
#closing { position: absolute; inset: 0; opacity: 0; }
#closing .shade { position: absolute; inset: 0;
  background: radial-gradient(70% 45% at 50% 38%, rgba(232,110,40,.22), rgba(0,0,0,0) 70%),
              linear-gradient(180deg, rgba(5,4,4,.55), rgba(5,4,4,.82)); }
#closing .eyebrow { position: absolute; left: 0; right: 0; top: 214px; text-align: center;
  font: 700 32px/1 Montserrat; letter-spacing: 9px; color: #EBC791; }
#closing .flyerWrap { position: absolute; left: 255px; top: 280px; width: 570px; height: 712px;
  border-radius: 26px; overflow: hidden;
  box-shadow: 0 40px 90px rgba(0,0,0,.65), 0 0 0 2px rgba(255,236,210,.14), 0 0 120px rgba(240,120,40,.25); }
#closing .flyerWrap img { width: 100%; height: 100%; display: block; }
#closing .sheen { position: absolute; inset: 0;
  background: linear-gradient(115deg, rgba(255,255,255,0) 40%, rgba(255,240,220,.28) 50%, rgba(255,255,255,0) 60%);
  background-size: 300% 100%; mix-blend-mode: screen; }
#closing .headline { position: absolute; left: 0; right: 0; top: 1018px; text-align: center;
  font: 400 214px/1 Anton; letter-spacing: 8px; color: transparent;
  background-image: linear-gradient(100deg, #F4ECE1 0%, #F4ECE1 42%, #FFFFFF 48%, #FFD9A0 50%, #FFFFFF 52%, #F4ECE1 58%, #F4ECE1 100%);
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
  text-shadow: none; filter: drop-shadow(0 8px 24px rgba(0,0,0,.5)); }
#closing .when { position: absolute; left: 0; right: 0; top: 1268px; text-align: center;
  font: 600 54px/1.22 Oswald; letter-spacing: 13px; color: #C99E78; text-transform: uppercase; }
#closing .getLabel { position: absolute; left: 0; right: 0; top: 1438px; text-align: center;
  font: 600 32px/1 Montserrat; letter-spacing: 10px; color: rgba(244,236,225,.86); }
#closing .cta { position: absolute; left: 70px; width: 940px; top: 1494px; height: 140px; border-radius: 70px;
  background: linear-gradient(100deg, #F58A2F, #E2531C 55%, #C9401A);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  box-shadow: 0 18px 50px rgba(226,83,28,.45), inset 0 2px 0 rgba(255,220,180,.45); }
#closing .cta span { font: 800 70px/1 Montserrat; letter-spacing: 1px; color: #FFF8EE; position: relative; z-index: 1;
  text-shadow: 0 2px 8px rgba(80,20,0,.35); }
#closing .cta .ctaSweep { position: absolute; inset: 0;
  background: linear-gradient(110deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 60%);
  background-size: 300% 100%; }
</style>

<!-- Chat UI is authored in "u" (iPhone points); converted to px at load: 1u = 972/390 px -->
<style id="ucss" type="text/u-css">
#card { position: absolute; left: 54px; top: 150px; width: 390u; height: 654u; border-radius: 28u; overflow: hidden;
  background: #0B141A; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1u rgba(255,255,255,.07); transform-origin: 50% 50%; }
.statusbar { position: absolute; left: 0; right: 0; top: 0; height: 50u; z-index: 5; color: #fff; background: #121212; }
.statusbar .clock { position: absolute; left: 36u; top: 17u; font: 600 16u/1 Inter; letter-spacing: -.2u; }
.statusbar .island { position: absolute; left: 50%; top: 11u; width: 118u; height: 33u; margin-left: -59u; border-radius: 20u; background: #000; }
.statusbar .icons { position: absolute; right: 26u; top: 17u; display: flex; gap: 6u; align-items: center; }
.screens { position: absolute; left: 0; right: 0; top: 50u; bottom: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; background: #0B141A; }
.dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.header { position: absolute; left: 0; right: 0; top: 0; height: 56u; background: #121212; z-index: 3;
  display: flex; align-items: center; border-bottom: .5u solid rgba(255,255,255,.08); }
.header .back { display: flex; align-items: center; margin-left: 8u; color: #E9EDEF; }
.header .badge { min-width: 22u; height: 22u; padding: 0 6u; box-sizing: border-box; border-radius: 11u; background: #2A3942; color: #E9EDEF;
  font: 500 13u/22u Inter; text-align: center; margin-left: 2u; }
.header .hav { width: 38u; height: 38u; margin-left: 8u; flex: none; }
.header .meta { margin-left: 10u; flex: 1; min-width: 0; }
.header .title { font: 600 16.5u/1.15 Inter; color: #F2F2F2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header .sub { font: 400 12.5u/1.3 Inter; color: #8696A0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1u; }
.header .acts { display: flex; gap: 22u; margin-right: 16u; color: #E9EDEF; align-items: center; }
.chat { position: absolute; left: 0; right: 0; top: 56u; bottom: 76u; overflow: hidden; }
.wall { position: absolute; inset: 0; opacity: .055; background-size: 150u 150u; }
.list { position: absolute; left: 0; right: 0; bottom: 6u; display: flex; flex-direction: column; }
.inputbar { position: absolute; left: 0; right: 0; bottom: 0; height: 76u; background: #121212; border-top: .5u solid rgba(255,255,255,.06); }
.inputbar .row1 { position: absolute; left: 0; right: 0; top: 8u; height: 38u; display: flex; align-items: center; color: #E9EDEF; }
.inputbar .field { flex: 1; height: 34u; margin: 0 10u; border-radius: 17u; background: #1F2C34; position: relative; }
.inputbar .field svg { position: absolute; right: 9u; top: 7u; }
.inputbar .homebar { position: absolute; left: 50%; bottom: 8u; width: 134u; height: 5u; margin-left: -67u; border-radius: 3u; background: #E9EDEF; opacity: .9; }

.row { position: relative; overflow: visible; flex: none; }
.row .inner { position: relative; }
.chipRow .inner { text-align: center; padding: 5u 0 5u; }
.chip { display: inline-block; padding: 5u 11u; border-radius: 8u; background: #182229; color: #8696A0; font: 500 12.5u/1.25 Inter; }
.msgRow .inner { display: flex; padding: 0 10u; }
.msgRow.out .inner { justify-content: flex-end; }
.bubble { position: relative; max-width: 290u; border-radius: 9u; padding: 6u 8u 7u 9u; box-sizing: border-box;
  font: 400 16.5u/21u Inter, "Noto Color Emoji"; color: #E9EDEF; word-wrap: break-word; box-shadow: 0 1u .5u rgba(0,0,0,.25); }
.out .bubble { background: #005C4B; }
.in .bubble { background: #1F2C34; }
.out.first .bubble { border-top-right-radius: 0; }
.in.first .bubble { border-top-left-radius: 0; }
.out.first .bubble::after { content: ""; position: absolute; right: -7u; top: 0; border-style: solid; border-width: 0 0 9u 8u; border-color: transparent transparent transparent #005C4B; }
.in.first .bubble::before { content: ""; position: absolute; left: -7u; top: 0; border-style: solid; border-width: 0 8u 9u 0; border-color: transparent #1F2C34 transparent transparent; }
.bubble .sender { font: 600 13.5u/18u Inter; margin-bottom: 1u; }
.bubble .sp { display: inline-block; width: 52u; height: 1u; }
.in .bubble .sp { width: 38u; }
.bubble .mt { position: absolute; right: 8u; bottom: 4u; font: 400 11u/1 Inter; color: rgba(233,237,239,.6); display: flex; align-items: center; gap: 3u; }
.group .in .inner { padding-left: 44u; }
.avatarSlot { position: absolute; left: 10u; bottom: 0; width: 28u; height: 28u; }
.av { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; position: relative; background: #2A3942; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av .mono { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; }

.imgBubble { padding: 3u !important; }
.imgBox { position: relative; width: 232u; height: 290u; border-radius: 7u; overflow: hidden; background: #111; }
.imgBox img { width: 100%; height: 100%; display: block; }
.imgBox .grad { position: absolute; left: 0; right: 0; bottom: 0; height: 36u; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.55)); }
.imgBox .mt { right: 7u; bottom: 6u; color: rgba(255,255,255,.92); }
.imgBox .prog { position: absolute; left: 50%; top: 50%; width: 52u; height: 52u; margin: -26u 0 0 -26u; border-radius: 50%; background: rgba(0,0,0,.45); }

.linkBubble { padding: 3u 3u 6u 3u !important; width: 286u; }
.preview { display: flex; border-radius: 7u; overflow: hidden; background: rgba(0,0,0,.2); }
.preview img { width: 76u; height: 76u; object-fit: cover; flex: none; }
.preview .pt { padding: 7u 9u; min-width: 0; }
.preview .ptitle { font: 600 14u/18u Inter; color: #E9EDEF; }
.preview .pdesc { font: 400 12.5u/16u Inter; color: rgba(233,237,239,.7); margin-top: 2u; }
.preview .pdom { font: 400 12u/15u Inter; color: rgba(233,237,239,.55); margin-top: 3u; }
.linkText { padding: 6u 6u 0 6u; }
.ltxt { margin-bottom: 2u; }
.url { color: #53BDEB; text-decoration: underline; text-decoration-thickness: 1u; text-underline-offset: 2u; white-space: nowrap; font-weight: 500; }
.reaction { position: absolute; bottom: -21u; padding: 2u 7u; border-radius: 13u; background: #1F2C34; border: 2u solid #0B141A;
  font: 500 13u/18u Inter, "Noto Color Emoji"; color: #E9EDEF; white-space: nowrap; display: flex; gap: 3u; align-items: center; }
.out .reaction { left: 6u; }

.typingBubble { padding: 10u 13u !important; display: flex; gap: 5u; align-items: center; }
.dot { width: 7.5u; height: 7.5u; border-radius: 50%; background: #8696A0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="bgShade"></div>
  <div id="embers"></div>

  <div id="card">
    <div class="statusbar">
      <div class="clock"></div>
      <div class="island"></div>
      <div class="icons" id="sbIcons"></div>
    </div>
    <div class="screens">
      <div class="screen" id="screenA"></div>
      <div class="dim" id="dimA"></div>
      <div class="screen group" id="screenB"></div>
    </div>
  </div>

  <div id="closing">
    <div class="shade"></div>
    <div class="eyebrow" id="cEyebrow"></div>
    <div class="flyerWrap" id="cFlyer"><img id="cFlyerImg"><div class="sheen" id="cSheen"></div></div>
    <div class="headline" id="cHead"></div>
    <div class="when" id="cWhen"></div>
    <div class="getLabel" id="cGet"></div>
    <div class="cta" id="cCta"><span id="cCtaText"></span><div class="ctaSweep" id="cCtaSweep"></div></div>
  </div>
  <div id="pagefade"></div>
</div>

<script>
(function () {
const C = window.CONFIG;
const U = 972 / 390;                       // px per iPhone point
const css = document.getElementById('ucss').textContent
  .replace(/(-?\d*\.?\d+)u\b/g, (_, n) => (parseFloat(n) * U).toFixed(2) + 'px');
const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
const u = n => n * U;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = p => 1 - Math.pow(1 - p, 3);
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const s = 1.15; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

const ICON = {
  back: `<svg width="${u(12)}" height="${u(21)}" viewBox="0 0 12 21"><path d="M10 2 L2 10.5 L10 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  video: `<svg width="${u(26)}" height="${u(18)}" viewBox="0 0 26 18"><rect x="1.2" y="2" width="16" height="14" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M18 7.2 L24.5 3.5 V14.5 L18 10.8 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  phone: `<svg width="${u(21)}" height="${u(21)}" viewBox="0 0 24 24"><path d="M6.6 2.5h3l1.6 4.6-2.2 1.6a12 12 0 0 0 6.3 6.3l1.6-2.2 4.6 1.6v3a2.2 2.2 0 0 1-2.4 2.2A18.5 18.5 0 0 1 4.4 4.9 2.2 2.2 0 0 1 6.6 2.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  plus: `<svg width="${u(22)}" height="${u(22)}" viewBox="0 0 22 22" style="margin-left:${u(14)}px"><path d="M11 2v18M2 11h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  sticker: `<svg width="${u(20)}" height="${u(20)}" viewBox="0 0 22 22"><path d="M20 12.5A9 9 0 1 1 9.5 2h5.5L20 7Z" fill="none" stroke="#8696A0" stroke-width="1.9" stroke-linejoin="round"/><circle cx="8" cy="10" r="1.3" fill="#8696A0"/><circle cx="14" cy="10" r="1.3" fill="#8696A0"/><path d="M7.5 14.5c2 2 5 2 7 0" fill="none" stroke="#8696A0" stroke-width="1.7" stroke-linecap="round"/></svg>`,
  camera: `<svg width="${u(24)}" height="${u(20)}" viewBox="0 0 24 20" style="margin-right:${u(18)}px"><path d="M3 5.5h4l2-3h6l2 3h4a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 21 18.5H3A1.5 1.5 0 0 1 1.5 17V7A1.5 1.5 0 0 1 3 5.5Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="11.5" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>`,
  mic: `<svg width="${u(16)}" height="${u(22)}" viewBox="0 0 16 24" style="margin-right:${u(16)}px"><rect x="4.5" y="1.5" width="7" height="13" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M1.5 11a6.5 6.5 0 0 0 13 0M8 17.5v4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>`,
  ticks: c => `<svg width="${u(16)}" height="${u(11)}" viewBox="0 0 16 11"><path d="M1 6 L4.2 9.2 L10.5 1.8 M6.4 8.6 L7.2 9.2 L13.8 1.8" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  signal: `<svg width="${u(18)}" height="${u(12)}" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx=".8" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx=".8" fill="#fff"/></svg>`,
  wifi: `<svg width="${u(16)}" height="${u(12)}" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 9 A3.4 3.4 0 0 1 10.4 9 Z" fill="#fff"/><path d="M3.4 6.8 A6.6 6.6 0 0 1 12.6 6.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M1 4.3 A10 10 0 0 1 15 4.3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  battery: `<svg width="${u(27)}" height="${u(13)}" viewBox="0 0 27 13"><rect x=".7" y=".7" width="22.6" height="11.6" rx="3.5" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/><rect x="2.4" y="2.4" width="15" height="8.2" rx="2" fill="#fff"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" fill="rgba(255,255,255,.45)"/></svg>`
};

// WhatsApp-style doodle wallpaper tile
const WALL = (() => {
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 30v-16l12-3v16"/><circle cx="17" cy="30" r="3.5"/><circle cx="29" cy="27" r="3.5"/>
    <path d="M95 20c3-6 12-6 12 1 0 6-12 12-12 12s-12-6-12-12c0-7 9-7 12-1z"/>
    <path d="M60 70l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>
    <rect x="110" y="70" width="22" height="16" rx="4"/><circle cx="121" cy="78" r="4"/>
    <path d="M15 105c8-8 18-8 26 0M20 112c5-4 11-4 16 0"/><circle cx="28" cy="120" r="2"/>
    <path d="M75 120c0-8 14-8 14 0v10h-14z M82 112v-6"/>
    <path d="M125 125l10-10M125 115l10 10"/><circle cx="50" cy="35" r="5"/><path d="M135 40c-4 0-6 3-6 6s3 6 6 6"/></svg>`;
  return 'url("data:image/svg+xml,' + encodeURIComponent(s) + '")';
})();

// ---------- avatars ----------
const imgPromises = [];
function trackImg(img) {
  imgPromises.push(new Promise(r => { if (img.complete && img.naturalWidth) r(); else { img.onload = r; img.onerror = r; } }));
}
function avatar(id, sizeU) {
  const p = C.people[id];
  const box = el('div', 'av');
  const initials = p.name.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const mono = el('div', 'mono', initials);
  mono.style.background = `linear-gradient(145deg, ${p.color}, #2a1a12)`;
  mono.style.fontSize = u(sizeU * 0.4) + 'px';
  box.appendChild(mono);
  if (p.avatar) {
    const img = el('img'); img.src = p.avatar;
    img.onerror = () => img.remove();
    box.appendChild(img); trackImg(img);
  }
  return box;
}

function groupIconSVG(sizePx) {
  return `<svg width="${sizePx}" height="${sizePx}" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gbg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#2b1a0e"/><stop offset=".55" stop-color="#0d0907"/><stop offset="1" stop-color="#030303"/></radialGradient>
    <linearGradient id="ggold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7B8"/><stop offset=".5" stop-color="#E7B064"/><stop offset="1" stop-color="#B9722F"/></linearGradient>
    <clipPath id="gclip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#gclip)">
    <rect width="400" height="400" fill="url(#gbg)"/>
    <circle cx="200" cy="200" r="184" fill="none" stroke="url(#ggold)" stroke-width="3" opacity=".55"/>
    <g fill="url(#ggold)">
      <rect x="160" y="88" width="9" height="22" rx="4.5"/><rect x="176" y="74" width="9" height="36" rx="4.5"/>
      <rect x="192" y="62" width="9" height="48" rx="4.5"/><rect x="208" y="78" width="9" height="32" rx="4.5"/>

}
window.groupIconSVG = groupIconSVG;

// ---------- build a chat screen ----------
function buildScreen(root, opts) {
  const header = el('div', 'header');
  const back = el('div', 'back', ICON.back);
  back.appendChild(el('div', 'badge', opts.unread));
  header.appendChild(back);
  const hav = el('div', 'hav');
  if (opts.groupIcon) hav.innerHTML = groupIconSVG(u(38)); else hav.appendChild(avatar(opts.contact, 38));
  header.appendChild(hav);
  const meta = el('div', 'meta');
  meta.appendChild(el('div', 'title', esc(opts.title)));
  const sub = el('div', 'sub', ''); meta.appendChild(sub);
  header.appendChild(meta);
  header.appendChild(el('div', 'acts', ICON.video + ICON.phone));
  root.appendChild(header);

  const chat = el('div', 'chat');
  const wall = el('div', 'wall'); wall.style.backgroundImage = WALL; chat.appendChild(wall);
  const list = el('div', 'list'); chat.appendChild(list);
  root.appendChild(chat);

  const ib = el('div', 'inputbar');
  const r1 = el('div', 'row1');
  r1.innerHTML = ICON.plus + `<div class="field">${ICON.sticker}</div>` + ICON.camera + ICON.mic;
  ib.appendChild(r1); ib.appendChild(el('div', 'homebar'));
  root.appendChild(ib);

  const rows = [];
  let prevFrom = null;
  for (const m of opts.messages) {
    const type = m.type || 'text';
    const row = el('div', 'row');
    const inner = el('div', 'inner');
    row.appendChild(inner);
    const R = { m, type, row, inner, h: 0 };
    if (type === 'chip') {
      row.classList.add('chipRow');
      inner.appendChild(el('span', 'chip', esc(m.text)));
      prevFrom = null;
    } else {
      const out = m.from === opts.me;
      const first = m.from !== prevFrom;
      row.classList.add('msgRow', out ? 'out' : 'in');
      if (first) row.classList.add('first');
      inner.style.paddingTop = u(first ? 7 : 2) + 'px';
      const b = el('div', 'bubble');
      R.bubble = b;
      const showName = opts.group && !out && type !== 'typing';
      if (opts.group && !out) {
        const slot = el('div', 'avatarSlot'); slot.appendChild(avatar(m.from, 28)); inner.appendChild(slot);
      }
      const tickHTML = out ? `<span class="tk"></span>` : '';
      if (type === 'typing') {
        b.classList.add('typingBubble');
        R.dots = [0, 1, 2].map(() => { const d = el('div', 'dot'); b.appendChild(d); return d; });
        prevFrom = m.from;
      } else if (type === 'image') {
        b.classList.add('imgBubble');
        const box = el('div', 'imgBox');
        const img = el('img'); img.src = m.src; trackImg(img); box.appendChild(img);
        box.appendChild(el('div', 'grad'));
        const mt = el('div', 'mt', `${m.time}${tickHTML}`); box.appendChild(mt);
        const pr = el('div', 'prog');
        pr.innerHTML = `<svg width="${u(52)}" height="${u(52)}" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/><circle class="arc" cx="26" cy="26" r="21" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132" transform="rotate(-90 26 26)"/><path d="M19 19 L33 33 M33 19 L19 33" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
        box.appendChild(pr);
        R.img = img; R.prog = pr; R.arc = pr.querySelector('.arc');
        b.appendChild(box);
        R.mt = mt;
      } else if (type === 'link') {
        b.classList.add('linkBubble');
        const L = C.linkPreview;
        const pv = el('div', 'preview');
        const th = el('img'); th.src = L.thumb; trackImg(th); pv.appendChild(th);
        pv.appendChild(el('div', 'pt', `<div class="ptitle">${esc(L.title)}</div><div class="pdesc">${esc(L.description)}</div><div class="pdom">${esc(L.domain)}</div>`));
        b.appendChild(pv);
        if (showName) b.insertBefore(el('div', 'sender', esc(C.people[m.from].name)), pv);
        const cap = m.text ? `<div class="ltxt">${esc(m.text)}</div>` : '';
        const lt = el('div', 'linkText', `${cap}<span class="url">${esc(m.url)}</span><span class="sp"></span>`);
        b.appendChild(lt);
        R.mt = el('div', 'mt', `${m.time}${tickHTML}`); b.appendChild(R.mt);
      } else {
        if (showName) { const s = el('div', 'sender', esc(C.people[m.from].name)); s.style.color = C.people[m.from].color; b.appendChild(s); }
        b.appendChild(el('span', 'txt', esc(m.text)));
        b.appendChild(el('span', 'sp'));
        R.mt = el('div', 'mt', `${m.time}${tickHTML}`); b.appendChild(R.mt);
      }
      if (showName && type === 'link') b.querySelector('.sender').style.color = C.people[m.from].color;
      R.tk = b.querySelector('.tk');
      inner.appendChild(b);
      if (m.reactions) {
        const rc = el('div', 'reaction', `<span>${m.reactions.text}</span><span style="color:#8696A0">${m.reactions.count}</span>`);
        b.appendChild(rc); R.reaction = rc;
      }
      if (type !== 'typing') prevFrom = m.from;
      R.out = out;
    }
    list.appendChild(row);
    rows.push(R);
  }
  return { root, rows, sub, list, opts };
}

function measure(S) {
  for (const R of S.rows) { R.row.style.height = 'auto'; R.row.style.display = ''; R.h = R.row.getBoundingClientRect().height; }
}

// Deterministic per-frame state for one chat screen
function renderScreen(S, t) {
  const status = S.opts.status.filter(s => s.at <= t);
  S.sub.textContent = status.length ? status[status.length - 1].text : S.opts.subtitle;
  for (const R of S.rows) {
    const m = R.m, at = m.at;
    let hp, vis;
    if (t < at) { R.row.style.display = 'none'; continue; }
    R.row.style.display = '';
    hp = eOut(prog(t, at, 0.30));
    vis = eOut(prog(t, at, 0.24));
    let extra = 0;
    if (R.type === 'typing') {
      const outp = prog(t, m.until, 0.12);
      if (outp >= 1) { R.row.style.display = 'none'; continue; }
      hp = hp * (1 - eInOut(outp)); vis = vis * (1 - outp);
      R.dots.forEach((d, i) => {
        const ph = ((t - at) * 2.6 - i * 0.18) % 1;
        const k = Math.max(0, Math.sin(Math.max(0, ph) * Math.PI));
        d.style.opacity = 0.45 + 0.55 * k; d.style.transform = `translateY(${-u(2.5) * k}px)`;
      });
    }
    if (R.reaction) {
      const rp = t < m.reactions.at ? 0 : eBack(prog(t, m.reactions.at, 0.28));
      R.reaction.style.opacity = clamp(rp * 1.5);
      R.reaction.style.transform = `scale(${0.4 + 0.6 * rp})`;
      R.reaction.style.transformOrigin = '20% 50%';
      extra = u(17) * eOut(prog(t, m.reactions.at, 0.25));
    }
    R.row.style.height = (R.h * hp + extra) + 'px';
    const sideOrigin = R.type === 'chip' ? '50% 100%' : (R.out ? '100% 100%' : '0% 100%');
    R.inner.style.transformOrigin = sideOrigin;
    const sc = R.type === 'image' ? lerp(0.88, 1, eBack(prog(t, at, 0.42))) : lerp(0.92, 1, eOut(prog(t, at, 0.26)));
    R.inner.style.transform = `translateY(${(1 - vis) * u(14)}px) scale(${sc})`;
    R.inner.style.opacity = vis;
    if (R.tk) {
      const read = t >= at + 0.75 || at < 0;
      const sent = t >= at + 0.18 || at < 0;
      R.tk.innerHTML = ICON.ticks(read ? '#53BDEB' : 'rgba(233,237,239,.6)');
      R.tk.style.opacity = sent ? 1 : 0.5;
    }
    if (R.type === 'image') {
      const up = prog(t, at + 0.05, 0.55);
      R.img.style.filter = up < 1 ? `blur(${(1 - eOut(up)) * u(8)}px) brightness(${0.75 + 0.25 * up})` : 'none';
      R.arc.setAttribute('stroke-dashoffset', String(132 * (1 - eInOut(up))));
      R.prog.style.opacity = up < 1 ? 1 : clamp(1 - (t - (at + 0.6)) / 0.12);
      R.mt.style.opacity = up < 1 ? 0 : 1;
    }
  }
}

// ---------- build ----------
document.querySelector('.statusbar .clock').textContent = C.clock;
document.getElementById('sbIcons').innerHTML = ICON.signal + ICON.wifi + ICON.battery;

const A = buildScreen(document.getElementById('screenA'), {
  me: C.me, contact: C.privateChat.contact, title: C.people[C.privateChat.contact].name,
  unread: C.privateChat.unread, subtitle: C.privateChat.subtitle, status: C.privateChat.status,
  messages: C.privateChat.messages, group: false
});
const B = buildScreen(document.getElementById('screenB'), {
  me: C.me, groupIcon: true, title: C.groupChat.name, unread: C.groupChat.unread,
  subtitle: `${C.groupChat.members} members`, status: C.groupChat.status,
  messages: C.groupChat.messages, group: true
});

// closing copy
const CL = C.closing;
document.getElementById('cEyebrow').textContent = CL.eyebrow;
document.getElementById('cHead').textContent = CL.headline;
document.getElementById('cWhen').innerHTML = `${esc(CL.date)}<br>${esc(CL.venue)}`;
document.getElementById('cGet').textContent = CL.ctaLabel;
document.getElementById('cCtaText').textContent = C.ticketDisplay;
const cImg = document.getElementById('cFlyerImg'); cImg.src = CL.flyer; trackImg(cImg);

// embers (seeded, deterministic)
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const embers = [];
for (let i = 0; i < 34; i++) {
  const e = el('div', 'ember'); const s = 3 + rnd() * 7;
  e.style.width = e.style.height = s + 'px';
  document.getElementById('embers').appendChild(e);
  embers.push({ e, x: rnd() * 1080, y: rnd() * 1920, sp: 30 + rnd() * 70, sway: 10 + rnd() * 30, ph: rnd() * 6.28, o: .15 + rnd() * .45 });
}

// ---------- master render ----------
const card = document.getElementById('card');
const sA = document.getElementById('screenA'), sB = document.getElementById('screenB'), dimA = document.getElementById('dimA');
const closing = document.getElementById('closing');
const q = id => document.getElementById(id);

function renderAt(t) {
  const [g0, g1] = C.scenes.toGroup, [c0, c1] = C.scenes.toClosing;

  // background drift
  q('bg').style.transform = `scale(${1.08 - 0.06 * (t / C.duration)}) translateY(${-20 * (t / C.duration)}px)`;
  embers.forEach(E => {
    const y = ((E.y - E.sp * t) % 1980 + 1980) % 1980 - 30;
    E.e.style.transform = `translate(${E.x + Math.sin(t * 0.9 + E.ph) * E.sway}px, ${y}px)`;
    E.e.style.opacity = E.o * (0.35 + 0.65 * eOut(prog(t, c0, 0.6)));
  });
  q('pagefade').style.opacity = 1 - eOut(prog(t, 0, 0.12));

  // card: gentle drift, exit into closing frame
  const nav = eInOut(prog(t, g0, g1 - g0));
  const ex = eInOut(prog(t, c0, c1 - c0));
  const drift = t < g0 ? 0.012 * (t / g0) : 0.012 * prog(t, g1, c0 - g1);
  card.style.transform = `translateY(${-70 * ex}px) scale(${(1 + drift) * (1 - 0.1 * ex)})`;
  card.style.opacity = 1 - ex;
  card.style.filter = ex > 0 ? `blur(${10 * ex}px)` : 'none';
  card.style.display = ex >= 1 ? 'none' : '';

  // iOS push navigation into the group
  sA.style.transform = `translateX(${-30 * nav}%)`;
  dimA.style.opacity = 0.45 * nav;
  sB.style.transform = `translateX(${100 * (1 - nav)}%)`;
  sB.style.boxShadow = nav > 0 && nav < 1 ? '-20px 0 40px rgba(0,0,0,.45)' : 'none';
  sB.style.display = nav <= 0 ? 'none' : '';
  sA.style.display = nav >= 1 ? 'none' : '';
  if (nav < 1) renderScreen(A, t);
  if (nav > 0) renderScreen(B, t);

  // closing frame
  const tc = t - c0;
  closing.style.opacity = eOut(prog(t, c0 + 0.05, 0.45));
  const show = (id, a, d, dy, s0) => {
    const p = eOut(prog(tc, a, d));
    const n = q(id); n.style.opacity = p;
    n.style.transform = `translateY(${(1 - p) * dy}px) scale(${lerp(s0 || 1, 1, p)})`;
    return p;
  };
  show('cEyebrow', 0.35, 0.5, 18);
  const fp = show('cFlyer', 0.15, 0.65, 70, 0.94);
  if (fp >= 1) q('cFlyer').style.transform = `scale(${1 + 0.02 * prog(tc, 0.8, 1.7)})`;
  q('cSheen').style.backgroundPosition = `${lerp(130, -30, eInOut(prog(tc, 1.0, 0.8)))}% 0`;
  const hp = show('cHead', 0.45, 0.55, 30, 1.04);
  q('cHead').style.letterSpacing = lerp(30, 8, eOut(prog(tc, 0.45, 0.7))) + 'px';
  q('cHead').style.backgroundPosition = `${lerp(100, 0, eInOut(prog(tc, 1.25, 0.75)))}% 0`;
  show('cWhen', 0.65, 0.5, 22);
  show('cGet', 0.85, 0.45, 18);
  const cp = eBack(prog(tc, 0.95, 0.5));
  q('cCta').style.opacity = clamp(prog(tc, 0.95, 0.3));
  const pulse = tc > 1.5 ? 0.5 + 0.5 * Math.sin((tc - 1.5) * 4.2) : 0;
  q('cCta').style.transform = `scale(${lerp(0.9, 1, cp) * (1 + 0.012 * pulse)})`;
  q('cCta').style.boxShadow = `0 18px ${50 + 30 * pulse}px rgba(226,83,28,${0.45 + 0.25 * pulse}), inset 0 2px 0 rgba(255,220,180,.45)`;
  q('cCtaSweep').style.backgroundPosition = `${lerp(110, -10, eInOut(prog(tc, 1.6, 0.7)))}% 0`;
}
window.renderAt = renderAt;

// ---------- ready ----------
window.ready = (async () => {
  await Promise.all([document.fonts.load('40px Anton'), document.fonts.load('700 40px Montserrat'), document.fonts.load('800 40px Montserrat'),
    document.fonts.load('600 40px Montserrat'), document.fonts.load('600 40px Oswald'), document.fonts.load('600 40px Montserrat', 'Ɗɗ'), document.fonts.load('40px "Noto Color Emoji"', '😭🔥')]);
  await document.fonts.ready;
  await Promise.all(imgPromises);
  // measure natural row heights with everything visible
  [A, B].forEach(S => { S.root.style.display = ''; S.root.style.transform = 'none'; measure(S); });
  renderAt(0);
  return true;
})();

// live preview: open index.html (no ?render) to play in a browser
if (!/render/.test(location.search)) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { renderAt(((performance.now() - t0) / 1000) % C.duration); requestAnimationFrame(loop); };
    loop();
  });
}
})();
