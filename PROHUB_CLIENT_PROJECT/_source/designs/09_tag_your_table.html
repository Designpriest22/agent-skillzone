<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../css/campaign.css"><style>
.t{position:absolute;left:60px;top:58px;font-size:150px;color:var(--night)}
.t span{color:var(--pepper)}
.s{position:absolute;left:64px;top:210px;font-size:40px;color:var(--night)}
.tbl{position:absolute;left:330px;top:350px;width:420px;height:420px;border-radius:50%;background:var(--violet);display:grid;place-items:center;box-shadow:0 20px 50px rgba(21,10,46,.25)}
.tbl .in{width:250px;height:250px}
.seat{position:absolute;width:150px;text-align:center}
.seat .pl{width:120px;height:120px;margin:0 auto}
.seat b{display:block;font-family:var(--mono);font-weight:500;font-size:15px;letter-spacing:.14em;color:var(--pepper);margin-top:6px}
.seat span{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--night)}
.f{position:absolute;left:64px;right:64px;bottom:44px;display:flex;justify-content:space-between;font-size:17px;color:var(--night)}
</style></head><body>
<div class="canvas sq paperbg grain">
 <div class="t disp">Tag your <span>table.</span></div>
 <div class="s serif">Five friends. One Better Day. Who’s sitting with you?</div>
 <div class="tbl"><div class="in" data-plate='{"label":"YOU","sub":"05.12 · ABUJA","noShadow":true}'></div></div>
 <div id="seats"></div>
 <div class="f mono"><span>Better Days · Sat 05.12.26</span><span style="color:var(--pepper)">Tables · cibusmusica.com</span></div>
</div>
<script>
const c={x:540,y:560},R=330;const S=document.getElementById('seats');
let n=0;[-150,-30,30,90,150].forEach((a)=>{const i=n++;const r=a*Math.PI/180;const x=c.x+R*Math.cos(r)-75,y=c.y+R*Math.sin(r)*0.98-90;
S.insertAdjacentHTML('beforeend',`<div class="seat" style="left:${x}px;top:${y}px"><div class="pl" data-plate='{"label":"0${i+1}","sub":"SEAT","noShadow":true}'></div><b>Seat 0${i+1}</b><span>@__________</span></div>`)});
</script><script src="../js/components.js"></script><script>document.querySelectorAll(".barcode").forEach(b=>{let s="";let x=0;let seed=7;while(x<100){seed=(seed*9301+49297)%233280;const w=1+seed%4;s+=`<i style="left:${x}%;width:${w*0.45}%"></i>`;x+=w*0.45+0.6+(seed%3)*0.4;}b.innerHTML=s;});</script></body></html>
