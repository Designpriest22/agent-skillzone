<!doctype html>
<html><head><meta charset="utf-8"><title>All About R&amp;B Render</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="core.js"></script><script src="scenes-a.js"></script><script src="scenes-b.js"></script><script src="scenes-c.js"></script><script src="scenes-d.js"></script><script src="scenes-e.js"></script><script src="talent.js"></script><script src="affirm.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scene = SCENES[0], PW = 1920, PH = 1080;
window.setup = (id, w, h) => { scene = SCENES.find(s => s.id === id) || SCENES[+id] || SCENES[0]; PW = cv.width = w; PH = cv.height = h; };
window.renderAt = t => {
  const s = PH / 1080; ctx.setTransform(s, 0, 0, s, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.save(); scene.draw(ctx, ((t % LOOP) + LOOP) % LOOP, PW / s, 1080); ctx.restore();
};
window.ready = (async () => {
  await Promise.all(Object.entries(ASSET_LIST).map(async ([k, v]) => IMG[k] = await loadImg(v)));
  await Promise.all(FONTS.map(f => document.fonts.load(f, 'AaR&B 0123')));
  window.sceneList = SCENES.map(s => ({ id: s.id, name: s.name }));
  return true;
})();
</script></body></html>
